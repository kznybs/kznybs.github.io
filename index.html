    <script>
        let audioCtx = null;
        let sfxEnabled = true;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playSciFiChirp(freq = 880, dur = 0.06, type = 'sine') {
            if (!sfxEnabled) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.5, ctx.currentTime + dur);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + dur);
            } catch (e) {}
        }
        function playConfirmBeep() {
            if (!sfxEnabled) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(520, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1040, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.07, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.14);
            } catch (e) {}
        }
        function toggleSFX() {
            sfxEnabled = !sfxEnabled;
            const icon = document.getElementById('sfx-icon');
            const label = document.getElementById('sfx-label');
            if (sfxEnabled) {
                icon.className = 'fas fa-volume-up';
                label.textContent = 'SFX ON';
                playSciFiChirp(900, 0.08);
            } else {
                icon.className = 'fas fa-volume-mute';
                label.textContent = 'SFX OFF';
            }
        }
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let mouse = { x: -1000, y: -1000, radius: 160 };
        function getActiveColor() {
            const theme = document.body.getAttribute('data-theme') || 'cyan';
            switch (theme) {
                case 'violet': return { r: 176, g: 38, b: 255 };
                case 'emerald': return { r: 0, g: 255, b: 136 };
                case 'crimson': return { r: 255, g: 0, b: 85 };
                default: return { r: 0, g: 229, b: 255 };
            }
        }
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.baseSize = Math.random() * 2 + 1;
                this.size = this.baseSize;
                this.vx = (Math.random() - 0.5) * 0.85;
                this.vy = (Math.random() - 0.5) * 0.85;
                this.pulseSpeed = Math.random() * 0.03 + 0.01;
                this.pulseVal = Math.random() * Math.PI;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
                this.pulseVal += this.pulseSpeed;
                this.size = this.baseSize + Math.sin(this.pulseVal) * 0.7;
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < mouse.radius) {
                    const force = (mouse.radius - dist) / mouse.radius;
                    const angle = Math.atan2(dy, dx);
                    this.x -= Math.cos(angle) * force * 3.5;
                    this.y -= Math.sin(angle) * force * 3.5;
                }
            }
            draw() {
                const color = getActiveColor();
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.2, this.size), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.85)`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = `rgba(${color.r}, ${color.g}, ${color.b}, 0.9)`;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
        function initParticles() {
            particles = [];
            const count = Math.min(Math.floor((width * height) / 10000), 110);
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }
        function connectParticles() {
            const color = getActiveColor();
            const maxDistance = 140;
            for (let a = 0; a < particles.length; a++) {
                for (let b = a + 1; b < particles.length; b++) {
                    const dx = particles[a].x - particles[b].x;
                    const dy = particles[a].y - particles[b].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDistance) {
                        const alpha = (1 - dist / maxDistance) * 0.22;
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
            if (mouse.x > 0 && mouse.y > 0) {
                for (let i = 0; i < particles.length; i++) {
                    const dx = mouse.x - particles[i].x;
                    const dy = mouse.y - particles[i].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.radius) {
                        const alpha = (1 - dist / mouse.radius) * 0.45;
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
                        ctx.lineWidth = 1.2;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                    }
                }
            }
        }
        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            connectParticles();
            requestAnimationFrame(animateCanvas);
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = -1000; mouse.y = -1000; });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
        });
        window.addEventListener('touchend', () => { mouse.x = -1000; mouse.y = -1000; });
        window.addEventListener('click', (e) => {
            playSciFiChirp(1200, 0.05);
            particles.forEach(p => {
                const dx = p.x - e.clientX;
                const dy = p.y - e.clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 220 && dist > 0) {
                    p.vx += (dx / dist) * 3;
                    p.vy += (dy / dist) * 3;
                }
            });
        });
        document.querySelectorAll('.social-tile, .ctrl-btn, .tag-pill, .palette-dot').forEach(el => {
            el.addEventListener('mouseenter', () => playSciFiChirp(980, 0.04));
        });
        document.querySelectorAll('.social-tile').forEach(tile => {
            tile.addEventListener('mousemove', (e) => {
                const rect = tile.getBoundingClientRect();
                tile.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                tile.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
            });
        });
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            playConfirmBeep();
        }
        function copyTag(tag) {
            navigator.clipboard.writeText(tag).then(() => {
                showToast(`Tag "${tag}" copiada!`);
                playConfirmBeep();
            }).catch(() => {
                showToast(`Handle: ${tag}`);
            });
        }
        function showToast(text) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toast-msg');
            msg.textContent = text;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }
        function updateClock() {
            const now = new Date();
            const h = String(now.getUTCHours()).padStart(2, '0');
            const m = String(now.getUTCMinutes()).padStart(2, '0');
            const s = String(now.getUTCSeconds()).padStart(2, '0');
            const clockEl = document.getElementById('live-clock');
            if (clockEl) clockEl.textContent = `${h}:${m}:${s} UTC`;
        }
        setInterval(updateClock, 1000);
        updateClock();
        setInterval(() => {
            const pingEl = document.getElementById('ping-display');
            if (pingEl) {
                const simulatedPing = Math.floor(Math.random() * 8) + 11;
                pingEl.textContent = `LATENCY: ${simulatedPing}ms`;
            }
        }, 3000);
        resizeCanvas();
        animateCanvas();
    </script>
</body>
</html>
