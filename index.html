<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identidade Visual - Deep Blue</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');

        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg-dark: #050b14;
            --glass-bg: rgba(10, 25, 47, 0.6);
            --glass-border: rgba(0, 210, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(45deg, #050b14, #0a1930, #020c1b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }

        .orb:nth-child(1) {
            width: 300px; height: 300px;
            background: var(--primary);
            top: -50px; left: -50px;
        }

        .orb:nth-child(2) {
            width: 400px; height: 400px;
            background: var(--secondary);
            bottom: -100px; right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(50px) translateX(50px); }
        }

        /* Main Container (Glassmorphism) */
        .container {
            width: 90%;
            max-width: 1200px;
            padding: 4rem;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            transform: translateY(50px);
            opacity: 0;
            animation: slideUp 1s ease forwards 0.5s;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Content */
        .content h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, var(--primary), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content p {
            font-size: 1.1rem;
            color: #a8b2d1;
            line-height: 1.8;
            margin-bottom: 2.5rem;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 1.5rem;
        }

        .btn {
            padding: 1rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
        }

        .btn-primary:hover {
            background: var(--primary);
            color: var(--bg-dark);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            transform: translateY(-3px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 2px solid transparent;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
        }

        /* Interactive Card Element */
        .card-visual {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 20px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: transform 0.5s ease;
        }

        .card-visual:hover {
            transform: scale(1.02) rotateY(5deg);
        }

        .card-visual::before {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--primary);
            border-radius: 50%;
            filter: blur(50px);
            animation: orbit 8s linear infinite;
        }

        @keyframes orbit {
            0% { transform: rotate(0deg) translateX(100px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(100px) rotate(-360deg); }
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .container {
                grid-template-columns: 1fr;
                padding: 3rem 2rem;
                gap: 3rem;
                text-align: center;
            }

            .content h1 {
                font-size: 3rem;
            }

            .btn-group {
                justify-content: center;
            }

            .card-visual {
                height: 300px;
            }
        }

        @media (max-width: 576px) {
            .container {
                padding: 2rem 1.5rem;
            }

            .content h1 {
                font-size: 2.2rem;
            }

            .btn-group {
                flex-direction: column;
                gap: 1rem;
            }
            
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="container">
        <div class="content">
            <h1>Identidade<br>Visual Fluida</h1>
            <p>Uma interface responsiva e imersiva construída com Glassmorphism, animações CSS puras e uma paleta profunda inspirada no oceano digital. Sem bibliotecas externas, apenas código limpo.</p>
            <div class="btn-group">
                <a href="#" class="btn btn-primary">Iniciar Projeto</a>
                <a href="#" class="btn btn-secondary">Explorar</a>
            </div>
        </div>
        
        <div class="card-visual">
            <h3 style="z-index: 2; font-weight: 300; letter-spacing: 2px;">INTERAÇÃO 3D</h3>
        </div>
    </div>

    <script>
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.container');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            container.style.transform = `translateY(0) perspective(1000px) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            const container = document.querySelector('.container');
            container.style.transition = 'transform 0.5s ease';
            container.style.transform = `translateY(0) perspective(1000px) rotateY(0deg) rotateX(0deg)`;
            setTimeout(() => container.style.transition = 'none', 500);
        });
    </script>
</body>
</html>
