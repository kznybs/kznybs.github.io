<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KZ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Montserrat:wght@300;400;700;900&family=Syne:wght@500;600;700&family=Inter:wght@500&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- ESTILOS GERAIS UNIFICADOS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* --- HIGH-END CINEMATIC SETTINGS (BLUE/OCEAN) --- */
        :root {
            --void-black: #000414; /* Azul oceano profundo */
            --glass-base: rgba(10, 30, 60, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-glow: rgba(0, 150, 255, 0.05);
            --thunder-glow: rgba(100, 200, 255, 0.8); /* Brilho cyan elétrico */
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            background-color: var(--void-black);
            overflow: hidden; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; 
            perspective: 1000px;
            cursor: none; /* Cursor personalizado */
        }

        /* --- WEBGL BACKGROUND --- */
        #webGLApp {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Fica atrás de tudo */
        }

        /* --- CANVAS ENGINE --- */
        #storm-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            filter: contrast(1.1);
            pointer-events: none; /* Permite que os toques cheguem ao WebGL */
        }

        /* --- IMMERSIVE OVERLAYS --- */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(0,2,8,0.8) 90%, #000 100%);
            pointer-events: none;
            z-index: 2;
        }

        .film-grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            z-index: 50;
            pointer-events: none;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0%,
                rgba(255, 255, 255, 0.02) 0.5%,
                transparent 1%
            );
            z-index: 49;
            pointer-events: none;
            animation: scanline-shift 10s linear infinite;
        }

        @keyframes scanline-shift {
            0% { background-position: 0 0; }
            100% { background-position: 0 100vh; }
        }

        /* --- PHYSICS & SHAKE FX --- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 10;
            padding: 1rem;
            transition: transform 0.05s ease-out; 
            transform-style: preserve-3d;
        }

        /* --- TYPOGRAPHY (NEXT-GEN GLITCH) --- */
        .name-container { 
            margin-bottom: 3rem; 
            perspective: 800px;
        }

        h1 { font-family: 'Audiowide', cursive; }
        
        .glitch-wrapper { 
            position: relative; 
            display: inline-block; 
            white-space: nowrap; 
        }

        .glitch-text {
            position: relative;
            font-size: clamp(4rem, 15vw, 8.5rem);
            font-weight: 900;
            letter-spacing: 0.05em;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.4);
            background: linear-gradient(180deg, #fff 0%, #777 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
            transition: all 0.2s ease;
        }

        /* --- ULTRA-PREMIUM GLASS CARD --- */
        .profile-card {
            background: linear-gradient(135deg, rgba(20, 50, 100, 0.4) 0%, rgba(5, 10, 20, 0.7) 100%);
            backdrop-filter: blur(35px) saturate(150%);
            -webkit-backdrop-filter: blur(35px) saturate(150%);
            border-radius: 40px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.2), 
                inset 0 -1px 2px rgba(0, 0, 0, 0.8), 
                0 40px 80px rgba(0, 0, 0, 0.95), 
                0 0 0 1px rgba(255, 255, 255, 0.02); 
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .profile-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.03) 40%,
                rgba(255,255,255,0.15) 50%,
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0) 100%
            );
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.6s ease-out;
            pointer-events: none;
            z-index: 1;
        }

        .profile-card:hover::before { transform: rotate(30deg) translateY(100%); }

        .profile-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- ICONS (NEO-MORPHIC) --- */
        .icon-container { 
            display: flex; gap: 2rem; justify-content: center; align-items: center; z-index: 2; position: relative;
        }
        @media (min-width: 768px) { .icon-container { gap: 3.5rem; } }

        .icon-link {
            position: relative;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
        }
        
        .icon-link:hover { 
            color: #fff; transform: translateY(-10px) scale(1.2); text-shadow: 0 0 25px rgba(255, 255, 255, 0.9); 
        }
        
        .icon-link::after {
            content: ''; position: absolute; bottom: -15px; width: 4px; height: 4px; border-radius: 50%;
            background: #fff; opacity: 0; transform: scale(0); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
        }
        .icon-link:hover::after { opacity: 1; transform: scale(1); }

        /* --- HUD ELEMENTS --- */
        .hud-text {
            position: absolute; font-family: 'Courier New', Courier, monospace; font-weight: 700;
            letter-spacing: 0.4em; font-size: 0.65rem; color: rgba(255, 255, 255, 0.2); pointer-events: none;
            transition: color 0.2s; z-index: 2;
        }

        .hud-bottom-right { bottom: 1.5rem; right: 2rem; }
        .hud-top-left { top: 1.5rem; left: 2rem; opacity: 0.5; }

        /* --- COLOR CONTROLS & FLUID UI --- */
        .color-controls {
            position: fixed; top: 2rem; right: 2rem; z-index: 100; display: flex; gap: 1rem; pointer-events: auto;
        }
        .color-btn {
            min-width: 48px; height: 48px; padding: 0.75rem 1.25rem; background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 24px; color: white;
            font-family: "Syne", sans-serif; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.05em;
            text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; white-space: nowrap;
        }
        .color-btn:hover { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.5); transform: translateY(-2px); }
        .color-btn.active { background: rgba(255, 255, 255, 0.25); border-color: rgba(255, 255, 255, 0.6); }

        .color-adjuster-panel {
            position: fixed; top: 2rem; left: 2rem; z-index: 100; background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px; padding: 1.5rem; min-width: 320px; max-width: 400px; pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); transition: all 0.3s ease; display: none;
        }
        .color-adjuster-panel.open { display: block; }

        .color-adjuster-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;
            padding-bottom: 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .color-adjuster-title {
            color: white; font-family: "Syne", sans-serif; font-size: 1rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
        }
        .color-adjuster-close {
            background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center; transition: opacity 0.3s ease;
        }
        .color-adjuster-close:hover { opacity: 0.7; }

        .color-picker-group { margin-bottom: 1.25rem; }
        .color-picker-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; color: white; font-family: "Inter", sans-serif; font-size: 0.875rem; font-weight: 500; }
        .color-picker-wrapper { display: flex; gap: 0.75rem; align-items: center; }
        .color-picker-input {
            width: 60px; height: 40px; border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 8px; cursor: pointer; background: none; padding: 0; -webkit-appearance: none; appearance: none;
        }
        .color-picker-input::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-input::-webkit-color-swatch { border: none; border-radius: 6px; }

        .color-value-display {
            flex: 1; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; padding: 0.5rem 0.75rem;
            color: white; font-family: "Inter", monospace; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.05em; cursor: text; user-select: all; transition: all 0.3s ease;
        }
        .color-value-display:hover { background: rgba(0, 0, 0, 0.3); border-color: rgba(255, 255, 255, 0.4); }
        .color-value-display:focus { outline: none; background: rgba(0, 0, 0, 0.4); border-color: rgba(255, 255, 255, 0.5); }

        .copy-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 6px; padding: 0.5rem 0.75rem; color: white; font-family: "Inter", sans-serif; font-size: 0.75rem; font-weight: 500; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px);
        }
        .copy-btn:hover { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.5); }
        .copy-btn.copied { background: rgba(76, 175, 80, 0.3); border-color: rgba(76, 175, 80, 0.5); }

        .color-adjuster-actions { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; gap: 0.75rem; }
        .export-btn {
            flex: 1; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 8px; padding: 0.75rem; color: white; font-family: "Syne", sans-serif; font-size: 0.875rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px);
        }
        .export-btn:hover { background: rgba(255, 255, 255, 0.25); border-color: rgba(255, 255, 255, 0.5); transform: translateY(-2px); }

        .toggle-adjuster-btn {
            position: fixed; top: 2rem; left: 2rem; z-index: 100; padding: 0.75rem 1.5rem; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white; font-family: "Syne", sans-serif; font-size: 0.875rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px); border-radius: 8px; pointer-events: auto;
        }
        .toggle-adjuster-btn:hover { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.5); transform: translateY(-2px); }

        .footer {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 10; color: white; font-family: "Syne", sans-serif; font-size: clamp(0.875rem, 1.5vw, 1.125rem); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; text-align: center; pointer-events: auto;
        }
        .footer a { color: white; text-decoration: none; transition: opacity 0.3s ease; }
        .footer a:hover { opacity: 0.7; }

        .custom-cursor {
            position: fixed; width: 40px; height: 40px; border: 2px solid white; border-radius: 50%; pointer-events: none; z-index: 1000; transform: translate(-50%, -50%); transition: width 0.2s ease, height 0.2s ease, border-width 0.2s ease; background: transparent; will-change: transform;
        }
        .custom-cursor::before {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; background: white; border-radius: 50%;
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // ==========================================
        // PARTE 1: SISTEMA DE FUNDO FLUIDO (THREE.JS)
        // ==========================================

        // Classe TouchTexture (Textura Interativa)
        class TouchTexture {
            constructor() {
                this.size = 64;
                this.width = this.height = this.size;
                this.maxAge = 64;
                this.radius = 0.25 * this.size; // Raio de toque muito maior para um efeito mais evidente
                this.speed = 1 / this.maxAge;
                this.trail = [];
                this.last = null;
                this.initTexture();
            }

            initTexture() {
                this.canvas = document.createElement("canvas");
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.ctx = this.canvas.getContext("2d");
                this.ctx.fillStyle = "black";
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.texture = new THREE.Texture(this.canvas);
            }

            update() {
                this.clear();
                let speed = this.speed;
                // Iteração inversa para remover itens de forma segura
                for (let i = this.trail.length - 1; i >= 0; i--) {
                    const point = this.trail[i];
                    let f = point.force * speed * (1 - point.age / this.maxAge);
                    point.x += point.vx * f;
                    point.y += point.vy * f;
                    point.age++;
                    if (point.age > this.maxAge) {
                        this.trail.splice(i, 1);
                    } else {
                        this.drawPoint(point);
                    }
                }
                this.texture.needsUpdate = true;
            }

            clear() {
                this.ctx.fillStyle = "black";
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }

            addTouch(point) {
                let force = 0;
                let vx = 0;
                let vy = 0;
                const last = this.last;
                if (last) {
                    const dx = point.x - last.x;
                    const dy = point.y - last.y;
                    if (dx === 0 && dy === 0) return;
                    const dd = dx * dx + dy * dy;
                    let d = Math.sqrt(dd);
                    vx = dx / d;
                    vy = dy / d;
                    force = Math.min(dd * 20000, 2.0); // Força mais potente para efeito visível
                }
                this.last = { x: point.x, y: point.y };
                this.trail.push({ x: point.x, y: point.y, age: 0, force, vx, vy });
            }

            drawPoint(point) {
                const pos = { x: point.x * this.width, y: (1 - point.y) * this.height };
                let intensity = 1;
                
                if (point.age < this.maxAge * 0.3) {
                    intensity = Math.sin((point.age / (this.maxAge * 0.3)) * (Math.PI / 2));
                } else {
                    const t = 1 - (point.age - this.maxAge * 0.3) / (this.maxAge * 0.7);
                    intensity = -t * (t - 2);
                }
                intensity *= point.force;

                const radius = this.radius;
                let color = `${((point.vx + 1) / 2) * 255}, ${((point.vy + 1) / 2) * 255}, ${intensity * 255}`;
                let offset = this.size * 5;
                
                this.ctx.shadowOffsetX = offset;
                this.ctx.shadowOffsetY = offset;
                this.ctx.shadowBlur = radius * 1;
                this.ctx.shadowColor = `rgba(${color},${0.2 * intensity})`;

                this.ctx.beginPath();
                this.ctx.fillStyle = "rgba(255,0,0,1)";
                this.ctx.arc(pos.x - offset, pos.y - offset, radius, 0, Math.PI * 2);
                this.ctx.fill();
            }
        }

        // Classe GradientBackground
        class GradientBackground {
            constructor(sceneManager) {
                this.sceneManager = sceneManager;
                this.mesh = null;
                const w = window.innerWidth || 1;
                const h = window.innerHeight || 1;
                this.uniforms = {
                    uTime: { value: 0 },
                    uResolution: { value: new THREE.Vector2(w, h) },
                    uColor1: { value: new THREE.Vector3(0.945, 0.353, 0.133) }, 
                    uColor2: { value: new THREE.Vector3(0.039, 0.055, 0.153) }, 
                    uColor3: { value: new THREE.Vector3(0.945, 0.353, 0.133) }, 
                    uColor4: { value: new THREE.Vector3(0.039, 0.055, 0.153) }, 
                    uColor5: { value: new THREE.Vector3(0.945, 0.353, 0.133) }, 
                    uColor6: { value: new THREE.Vector3(0.039, 0.055, 0.153) }, 
                    uSpeed: { value: 1.2 }, 
                    uIntensity: { value: 1.8 },
                    uTouchTexture: { value: null },
                    uGrainIntensity: { value: 0.08 },
                    uZoom: { value: 1.0 }, 
                    uDarkNavy: { value: new THREE.Vector3(0.039, 0.055, 0.153) }, 
                    uGradientSize: { value: 1.0 }, 
                    uGradientCount: { value: 6.0 }, 
                    uColor1Weight: { value: 1.0 }, 
                    uColor2Weight: { value: 1.0 } 
                };
            }

            init() {
                const viewSize = this.sceneManager.getViewSize();
                const geometry = new THREE.PlaneGeometry(viewSize.width, viewSize.height, 1, 1);

                const material = new THREE.ShaderMaterial({
                    uniforms: this.uniforms,
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vec3 pos = position.xyz;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.);
                            vUv = uv;
                        }
                    `,
                    fragmentShader: `
                        uniform float uTime;
                        uniform vec2 uResolution;
                        uniform vec3 uColor1;
                        uniform vec3 uColor2;
                        uniform vec3 uColor3;
                        uniform vec3 uColor4;
                        uniform vec3 uColor5;
                        uniform vec3 uColor6;
                        uniform float uSpeed;
                        uniform float uIntensity;
                        uniform sampler2D uTouchTexture;
                        uniform float uGrainIntensity;
                        uniform float uZoom;
                        uniform vec3 uDarkNavy;
                        uniform float uGradientSize;
                        uniform float uGradientCount;
                        uniform float uColor1Weight;
                        uniform float uColor2Weight;
                        
                        varying vec2 vUv;
                        
                        #define PI 3.14159265359
                        
                        // Função de ruído para o efeito film grain
                        float grain(vec2 uv, float time) {
                            vec2 grainUv = uv * uResolution * 0.5;
                            float grainValue = fract(sin(dot(grainUv + time, vec2(12.9898, 78.233))) * 43758.5453);
                            return grainValue * 2.0 - 1.0;
                        }
                        
                        vec3 getGradientColor(vec2 uv, float time) {
                            float gradientRadius = uGradientSize;
                            
                            vec2 center1 = vec2(0.5 + sin(time * uSpeed * 0.4) * 0.4, 0.5 + cos(time * uSpeed * 0.5) * 0.4);
                            vec2 center2 = vec2(0.5 + cos(time * uSpeed * 0.6) * 0.5, 0.5 + sin(time * uSpeed * 0.45) * 0.5);
                            vec2 center3 = vec2(0.5 + sin(time * uSpeed * 0.35) * 0.45, 0.5 + cos(time * uSpeed * 0.55) * 0.45);
                            vec2 center4 = vec2(0.5 + cos(time * uSpeed * 0.5) * 0.4, 0.5 + sin(time * uSpeed * 0.4) * 0.4);
                            vec2 center5 = vec2(0.5 + sin(time * uSpeed * 0.7) * 0.35, 0.5 + cos(time * uSpeed * 0.6) * 0.35);
                            vec2 center6 = vec2(0.5 + cos(time * uSpeed * 0.45) * 0.5, 0.5 + sin(time * uSpeed * 0.65) * 0.5);
                            
                            vec2 center7 = vec2(0.5 + sin(time * uSpeed * 0.55) * 0.38, 0.5 + cos(time * uSpeed * 0.48) * 0.42);
                            vec2 center8 = vec2(0.5 + cos(time * uSpeed * 0.65) * 0.36, 0.5 + sin(time * uSpeed * 0.52) * 0.44);
                            vec2 center9 = vec2(0.5 + sin(time * uSpeed * 0.42) * 0.41, 0.5 + cos(time * uSpeed * 0.58) * 0.39);
                            vec2 center10 = vec2(0.5 + cos(time * uSpeed * 0.48) * 0.37, 0.5 + sin(time * uSpeed * 0.62) * 0.43);
                            vec2 center11 = vec2(0.5 + sin(time * uSpeed * 0.68) * 0.33, 0.5 + cos(time * uSpeed * 0.44) * 0.46);
                            vec2 center12 = vec2(0.5 + cos(time * uSpeed * 0.38) * 0.39, 0.5 + sin(time * uSpeed * 0.56) * 0.41);
                            
                            float dist1 = length(uv - center1); float dist2 = length(uv - center2); float dist3 = length(uv - center3);
                            float dist4 = length(uv - center4); float dist5 = length(uv - center5); float dist6 = length(uv - center6);
                            float dist7 = length(uv - center7); float dist8 = length(uv - center8); float dist9 = length(uv - center9);
                            float dist10 = length(uv - center10); float dist11 = length(uv - center11); float dist12 = length(uv - center12);
                            
                            float influence1 = 1.0 - smoothstep(0.0, gradientRadius, dist1); float influence2 = 1.0 - smoothstep(0.0, gradientRadius, dist2);
                            float influence3 = 1.0 - smoothstep(0.0, gradientRadius, dist3); float influence4 = 1.0 - smoothstep(0.0, gradientRadius, dist4);
                            float influence5 = 1.0 - smoothstep(0.0, gradientRadius, dist5); float influence6 = 1.0 - smoothstep(0.0, gradientRadius, dist6);
                            float influence7 = 1.0 - smoothstep(0.0, gradientRadius, dist7); float influence8 = 1.0 - smoothstep(0.0, gradientRadius, dist8);
                            float influence9 = 1.0 - smoothstep(0.0, gradientRadius, dist9); float influence10 = 1.0 - smoothstep(0.0, gradientRadius, dist10);
                            float influence11 = 1.0 - smoothstep(0.0, gradientRadius, dist11); float influence12 = 1.0 - smoothstep(0.0, gradientRadius, dist12);
                            
                            vec2 rotatedUv1 = uv - 0.5;
                            float angle1 = time * uSpeed * 0.15;
                            rotatedUv1 = vec2(rotatedUv1.x * cos(angle1) - rotatedUv1.y * sin(angle1), rotatedUv1.x * sin(angle1) + rotatedUv1.y * cos(angle1)) + 0.5;
                            
                            vec2 rotatedUv2 = uv - 0.5;
                            float angle2 = -time * uSpeed * 0.12;
                            rotatedUv2 = vec2(rotatedUv2.x * cos(angle2) - rotatedUv2.y * sin(angle2), rotatedUv2.x * sin(angle2) + rotatedUv2.y * cos(angle2)) + 0.5;
                            
                            float radialGradient1 = length(rotatedUv1 - 0.5); float radialGradient2 = length(rotatedUv2 - 0.5);
                            float radialInfluence1 = 1.0 - smoothstep(0.0, 0.8, radialGradient1); float radialInfluence2 = 1.0 - smoothstep(0.0, 0.8, radialGradient2);
                            
                            vec3 color = vec3(0.0);
                            color += uColor1 * influence1 * (0.55 + 0.45 * sin(time * uSpeed)) * uColor1Weight;
                            color += uColor2 * influence2 * (0.55 + 0.45 * cos(time * uSpeed * 1.2)) * uColor2Weight;
                            color += uColor3 * influence3 * (0.55 + 0.45 * sin(time * uSpeed * 0.8)) * uColor1Weight;
                            color += uColor4 * influence4 * (0.55 + 0.45 * cos(time * uSpeed * 1.3)) * uColor2Weight;
                            color += uColor5 * influence5 * (0.55 + 0.45 * sin(time * uSpeed * 1.1)) * uColor1Weight;
                            color += uColor6 * influence6 * (0.55 + 0.45 * cos(time * uSpeed * 0.9)) * uColor2Weight;
                            
                            if (uGradientCount > 6.0) {
                                color += uColor1 * influence7 * (0.55 + 0.45 * sin(time * uSpeed * 1.4)) * uColor1Weight;
                                color += uColor2 * influence8 * (0.55 + 0.45 * cos(time * uSpeed * 1.5)) * uColor2Weight;
                                color += uColor3 * influence9 * (0.55 + 0.45 * sin(time * uSpeed * 1.6)) * uColor1Weight;
                                color += uColor4 * influence10 * (0.55 + 0.45 * cos(time * uSpeed * 1.7)) * uColor2Weight;
                            }
                            if (uGradientCount > 10.0) {
                                color += uColor5 * influence11 * (0.55 + 0.45 * sin(time * uSpeed * 1.8)) * uColor1Weight;
                                color += uColor6 * influence12 * (0.55 + 0.45 * cos(time * uSpeed * 1.9)) * uColor2Weight;
                            }
                            
                            color += mix(uColor1, uColor3, radialInfluence1) * 0.45 * uColor1Weight;
                            color += mix(uColor2, uColor4, radialInfluence2) * 0.4 * uColor2Weight;
                            
                            color = clamp(color, vec3(0.0), vec3(1.0)) * uIntensity;
                            
                            float luminance = dot(color, vec3(0.299, 0.587, 0.114));
                            color = mix(vec3(luminance), color, 1.35);
                            color = pow(color, vec3(0.92));
                            
                            float brightness1 = length(color);
                            float mixFactor1 = max(brightness1 * 1.2, 0.15);
                            color = mix(uDarkNavy, color, mixFactor1);
                            
                            float maxBrightness = 1.0;
                            float brightness = length(color);
                            if (brightness > maxBrightness) {
                                color = color * (maxBrightness / brightness);
                            }
                            return color;
                        }
                        
                        void main() {
                            vec2 uv = vUv;
                            
                            // Efeito distorção na água com base no toque
                            vec4 touchTex = texture2D(uTouchTexture, uv);
                            float vx = -(touchTex.r * 2.0 - 1.0);
                            float vy = -(touchTex.g * 2.0 - 1.0);
                            float intensity = touchTex.b;
                            
                            uv.x += vx * 0.8 * intensity;
                            uv.y += vy * 0.8 * intensity;
                            
                            vec2 center = vec2(0.5);
                            float dist = length(uv - center);
                            float ripple = sin(dist * 20.0 - uTime * 3.0) * 0.04 * intensity;
                            float wave = sin(dist * 15.0 - uTime * 2.0) * 0.03 * intensity;
                            uv += vec2(ripple + wave);
                            
                            vec3 color = getGradientColor(uv, uTime);
                            
                            float grainValue = grain(uv, uTime);
                            color += grainValue * uGrainIntensity;
                            
                            float timeShift = uTime * 0.5;
                            color.r += sin(timeShift) * 0.02;
                            color.g += cos(timeShift * 1.4) * 0.02;
                            color.b += sin(timeShift * 1.2) * 0.02;
                            
                            float brightness2 = length(color);
                            float mixFactor2 = max(brightness2 * 1.2, 0.15);
                            color = mix(uDarkNavy, color, mixFactor2);
                            
                            color = clamp(color, vec3(0.0), vec3(1.0));
                            
                            float maxBrightness = 1.0;
                            float brightness = length(color);
                            if (brightness > maxBrightness) {
                                color = color * (maxBrightness / brightness);
                            }
                            
                            gl_FragColor = vec4(color, 1.0);
                        }
                    `
                });

                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.z = 0;
                this.sceneManager.scene.add(this.mesh);
            }

            update(delta) {
                if (this.uniforms.uTime) {
                    this.uniforms.uTime.value += delta;
                }
            }

            onResize(width, height) {
                const viewSize = this.sceneManager.getViewSize();
                if (this.mesh) {
                    this.mesh.geometry.dispose();
                    this.mesh.geometry = new THREE.PlaneGeometry(viewSize.width, viewSize.height, 1, 1);
                }
                if (this.uniforms.uResolution) {
                    this.uniforms.uResolution.value.set(width, height);
                }
            }
        }

        // Classe Principal da Aplicação
        class App {
            constructor() {
                const w = window.innerWidth || 1;
                const h = window.innerHeight || 1;
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", alpha: false, stencil: false, depth: false });
                this.renderer.setSize(w, h);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.setAnimationLoop(null);
                document.body.appendChild(this.renderer.domElement);
                this.renderer.domElement.id = "webGLApp"; // CSS garante z-index: -1

                this.camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 10000);
                this.camera.position.z = 50;
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0e27);
                this.clock = new THREE.Clock();

                this.touchTexture = new TouchTexture();
                this.gradientBackground = new GradientBackground(this);
                this.gradientBackground.uniforms.uTouchTexture.value = this.touchTexture.texture;

                this.colorSchemes = {
                    1: { color1: new THREE.Vector3(0.945, 0.353, 0.133), color2: new THREE.Vector3(0.039, 0.055, 0.153) },
                    2: { color1: new THREE.Vector3(1.0, 0.424, 0.314), color2: new THREE.Vector3(0.251, 0.878, 0.816) },
                    3: { color1: new THREE.Vector3(0.945, 0.353, 0.133), color2: new THREE.Vector3(0.039, 0.055, 0.153), color3: new THREE.Vector3(0.251, 0.878, 0.816) },
                    4: { color1: new THREE.Vector3(0.949, 0.4, 0.2), color2: new THREE.Vector3(0.176, 0.42, 0.427), color3: new THREE.Vector3(0.82, 0.686, 0.612) },
                    5: { color1: new THREE.Vector3(0.945, 0.353, 0.133), color2: new THREE.Vector3(0.0, 0.259, 0.22), color3: new THREE.Vector3(0.945, 0.353, 0.133), color4: new THREE.Vector3(0.0, 0.0, 0.0), color5: new THREE.Vector3(0.945, 0.353, 0.133), color6: new THREE.Vector3(0.0, 0.0, 0.0) }
                };
                this.currentScheme = 1;
                this.init();
            }

            setColorScheme(scheme) {
                if (!this.colorSchemes[scheme]) return;
                this.currentScheme = scheme;
                const colors = this.colorSchemes[scheme];
                const uniforms = this.gradientBackground.uniforms;

                if (scheme === 3) {
                    uniforms.uColor1.value.copy(colors.color1); uniforms.uColor2.value.copy(colors.color2); uniforms.uColor3.value.copy(colors.color3); uniforms.uColor4.value.copy(colors.color1); uniforms.uColor5.value.copy(colors.color2); uniforms.uColor6.value.copy(colors.color3);
                } else if (scheme === 4) {
                    uniforms.uColor1.value.copy(colors.color1); uniforms.uColor2.value.copy(colors.color2); uniforms.uColor3.value.copy(colors.color3); uniforms.uColor4.value.copy(colors.color1); uniforms.uColor5.value.copy(colors.color2); uniforms.uColor6.value.copy(colors.color3);
                } else if (scheme === 5) {
                    uniforms.uColor1.value.copy(colors.color1); uniforms.uColor2.value.copy(colors.color2); uniforms.uColor3.value.copy(colors.color3); uniforms.uColor4.value.copy(colors.color4); uniforms.uColor5.value.copy(colors.color5); uniforms.uColor6.value.copy(colors.color6);
                } else {
                    uniforms.uColor1.value.copy(colors.color1); uniforms.uColor2.value.copy(colors.color2); uniforms.uColor3.value.copy(colors.color1); uniforms.uColor4.value.copy(colors.color2); uniforms.uColor5.value.copy(colors.color1); uniforms.uColor6.value.copy(colors.color2);
                }

                if (scheme === 1 || scheme === 6 || scheme === 7 || scheme === 8 || scheme === 5) {
                    this.scene.background = new THREE.Color(0x0a0e27);
                    uniforms.uDarkNavy.value.set(0.039, 0.055, 0.153);
                    uniforms.uGradientSize.value = 0.45;
                    uniforms.uGradientCount.value = 12.0;
                    uniforms.uSpeed.value = 1.5;
                    uniforms.uColor1Weight.value = 0.5;
                    uniforms.uColor2Weight.value = 1.8;
                } else if (scheme === 4) {
                    this.scene.background = new THREE.Color(0xffffff);
                    uniforms.uDarkNavy.value.set(0, 0, 0);
                } else {
                    this.scene.background = new THREE.Color(0x0a0e27);
                    uniforms.uDarkNavy.value.set(0.039, 0.055, 0.153);
                    uniforms.uGradientSize.value = 1.0;
                    uniforms.uGradientCount.value = 6.0;
                    uniforms.uSpeed.value = 1.2;
                    uniforms.uColor1Weight.value = 1.0;
                    uniforms.uColor2Weight.value = 1.0;
                }
            }

            init() {
                this.gradientBackground.init();
                this.setColorScheme(1);
                this.render();
                this.tick();

                window.addEventListener("resize", () => this.onResize());
                window.addEventListener("mousemove", (ev) => this.onMouseMove(ev));
                window.addEventListener("touchmove", (ev) => this.onTouchMove(ev));
                document.addEventListener("visibilitychange", () => { if (!document.hidden) this.render(); });

                const wakeUpAnimation = () => {
                    this.render();
                    window.removeEventListener("click", wakeUpAnimation);
                    window.removeEventListener("touchstart", wakeUpAnimation);
                    window.removeEventListener("mousemove", wakeUpAnimation);
                };
                window.addEventListener("click", wakeUpAnimation, { once: true });
                window.addEventListener("touchstart", wakeUpAnimation, { once: true });
                window.addEventListener("mousemove", wakeUpAnimation, { once: true });
            }

            onTouchMove(ev) {
                const touch = ev.touches[0];
                this.onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
            }

            onMouseMove(ev) {
                this.mouse = { x: ev.clientX / window.innerWidth, y: 1 - ev.clientY / window.innerHeight };
                this.touchTexture.addTouch(this.mouse);
            }

            getViewSize() {
                const fovInRadians = (this.camera.fov * Math.PI) / 180;
                let height = Math.abs(this.camera.position.z * Math.tan(fovInRadians / 2) * 2);
                if (isNaN(height) || height === 0) height = 100; // Fallback caso NaN
                let width = height * (this.camera.aspect || 1);
                if (isNaN(width) || width === 0) width = 100; // Fallback caso NaN
                return { width, height };
            }

            update(delta) {
                this.touchTexture.update();
                this.gradientBackground.update(delta);
            }

            render() {
                const delta = this.clock.getDelta();
                const clampedDelta = Math.min(delta, 0.1);
                this.renderer.render(this.scene, this.camera);
                this.update(clampedDelta);
            }

            tick() {
                this.render();
                requestAnimationFrame(() => this.tick());
            }

            onResize() {
                const w = window.innerWidth || 1;
                const h = window.innerHeight || 1;
                this.camera.aspect = w / h;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(w, h);
                this.gradientBackground.onResize(w, h);
            }
        }

        const app = new App();

        function rgbToHex(r, g, b) {
            const toHex = (n) => { const hex = Math.round(n * 255).toString(16); return hex.length === 1 ? "0" + hex : hex; };
            return "#" + toHex(r) + toHex(g) + toHex(b);
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? { r: parseInt(result[1], 16) / 255, g: parseInt(result[2], 16) / 255, b: parseInt(result[3], 16) / 255 } : null;
        }

        function updateColorPickersFromScheme() {
            const uniforms = app.gradientBackground.uniforms;
            const colors = [
                uniforms.uColor1.value, uniforms.uColor2.value, uniforms.uColor3.value,
                uniforms.uColor4.value, uniforms.uColor5.value, uniforms.uColor6.value
            ];
            colors.forEach((color, index) => {
                const picker = document.getElementById(`colorPicker${index + 1}`);
                const display = document.getElementById(`colorValue${index + 1}`);
                if (picker && display) {
                    const hex = rgbToHex(color.x, color.y, color.z);
                    picker.value = hex; display.value = hex.toUpperCase();
                }
            });
        }

        for (let i = 1; i <= 6; i++) {
            const picker = document.getElementById(`colorPicker${i}`);
            const display = document.getElementById(`colorValue${i}`);
            if (picker && display) {
                picker.addEventListener("input", (e) => {
                    const hex = e.target.value; const rgb = hexToRgb(hex);
                    if (rgb) {
                        const colorUniform = app.gradientBackground.uniforms[`uColor${i}`];
                        if (colorUniform) { colorUniform.value.set(rgb.r, rgb.g, rgb.b); display.value = hex.toUpperCase(); }
                    }
                });
            }
        }

        document.addEventListener("mousemove", (e) => { uiMouseX = e.clientX; uiMouseY = e.clientY; });

        let isCursorAnimating = false;
        function animateCursor() {

            cursor.style.left = cursorX + "px"; cursor.style.top = cursorY + "px";

        });

        toggleAdjusterBtn.addEventListener("mouseenter", () => { cursor.style.width = "50px"; cursor.style.height = "50px"; cursor.style.borderWidth = "3px"; });
        toggleAdjusterBtn.addEventListener("mouseleave", () => { cursor.style.width = "40px"; cursor.style.height = "40px"; cursor.style.borderWidth = "2px"; });

        let lastMouseMoveTime = 0, pulseFrame = null;
        function checkPulse() {
            if (Date.now() - lastMouseMoveTime > 100) { cursor.style.borderWidth = "2px"; pulseFrame = null; } 
            else { pulseFrame = requestAnimationFrame(checkPulse); }
        }
        document.addEventListener("mousemove", () => {
            lastMouseMoveTime = Date.now(); cursor.style.borderWidth = "2.5px";
            if (!pulseFrame) { pulseFrame = requestAnimationFrame(checkPulse); }
        });

        // ==========================================
        // PARTE 4: MOTOR DE TEMPESTADE E CARTÃO (CANVAS 2D)
        // ==========================================

    </script>
</body>
</html>
