<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- Configurações Gerais (Layout Original Noir Storm) --- */
        :root {
            --pure-white: #ffffff;
            --storm-gray: #4a4a4a;
            --void-black: #0a0a0a;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: #e5e5e5;
            background-color: var(--void-black);
            overflow-x: hidden;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; 
            overflow: hidden; /* Necessário para o Canvas */
            cursor: pointer; /* Indica que é clicável */
        }

        /* --- NOVO MOTOR DE FUNDO (CANVAS) --- */
        #storm-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* Atrás de tudo */
        }

        /* --- Overlays do Layout Original --- */
        
        /* Vignette (Suavizada) */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 45%, rgba(0,0,0,0.9) 110%);
            pointer-events: none;
            z-index: 2;
        }

        /* Scanline Chuvisco */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0.03));
            background-size: 100% 2px;
            z-index: 50;
            pointer-events: none;
            opacity: 0.15;
            animation: scanline-move 0.1s linear infinite;
        }

        @keyframes scanline-move {
            0% { transform: translateY(0); }
            100% { transform: translateY(2px); }
        }

        /* --- Layout Instável (Vento Forte) --- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 10;
            padding: 1rem;
            /* O JS vai adicionar a classe .thunder-shake aqui quando cair um raio */
            transition: transform 0.1s; 
        }

        /* Animação de tremor ativada pelo raio */
        .thunder-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* --- Tipografia Glitch (Design Original) --- */
        h1 { font-family: 'Audiowide', cursive; }
        
        .glitch-wrapper { position: relative; display: inline-block; white-space: nowrap; }

        .glitch-text {
            position: relative;
            font-size: clamp(3.5rem, 13vw, 7rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: glitch-storm 0.2s infinite alternate-reverse; 
        }

        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent; /* Alterado para transparente para não cobrir o fundo Canvas incorretamente */
            opacity: 1;
        }

        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 #777;
            clip: rect(44px, 9999px, 56px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 #bbb;
            clip: rect(44px, 9999px, 56px, 0);
            animation: glitch-anim-3 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-storm {
            0% { transform: translate(0); text-shadow: 2px 2px 0px #fff; }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(-1px, -1px); }
            60% { transform: translate(1px, 1px); }
            80% { transform: translate(1px, -1px); }
            100% { transform: translate(0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(12px, 9999px, 5px, 0); }
            100% { clip: rect(95px, 9999px, 100px, 0); }
        }
        @keyframes glitch-anim-3 {
            0% { clip: rect(5px, 9999px, 15px, 0); }
            100% { clip: rect(100px, 9999px, 95px, 0); }
        }

        /* --- Cartão Sólido (Design Original) --- */
        .profile-card {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            clip-path: polygon(
                20px 0, 
                100% 0, 
                100% calc(100% - 20px), 
                calc(100% - 20px) 100%, 
                0 100%, 
                0 20px
            );
            
            box-shadow: 
                inset 0 0 0 1px rgba(120, 120, 120, 0.3), 
                inset 0 0 80px rgba(10, 10, 10, 0.9);
            
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.05));
            
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            transition: all 0.1s ease;
        }

        .profile-card:hover {
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.15));
            box-shadow: 
                inset 0 0 0 1px rgba(255, 255, 255, 0.6), 
                inset 0 0 60px rgba(0, 0, 0, 1);
        }

        /* Ícones */
        .icon-container { display: flex; gap: 1.5rem; justify-content: center; align-items: center; }
        @media (min-width: 768px) { .icon-container { gap: 2.5rem; } }

        .icon-link {
            position: relative;
            color: rgba(180, 180, 180, 0.8);
            transition: all 0.2s ease;
            z-index: 10;
        }
        .icon-link:hover { color: #fff; transform: scale(1.1); text-shadow: 0 0 15px #fff; }
        
        .icon-link::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; width: 0; height: 2px;
            background: #fff; transform: translateX(-50%); transition: width 0.2s ease;
            box-shadow: 0 0 10px #fff;
        }
        .icon-link:hover::after { width: 100%; }

        .name-container { margin-bottom: 2rem; padding: 0 1rem; width: 100%; text-align: center; }
        @media (min-width: 768px) { .name-container { margin-bottom: 3rem; } }

    </style>
</head>
<body class="antialiased">

    <!-- Fundo de Tempestade (Canvas) -->
    <canvas id="storm-canvas"></canvas>
    
    <!-- Overlays -->
    <div class="scanlines"></div>

    <!-- Conteúdo Principal (Layout Original) -->
    <div class="main-content" id="main-content">
        <div class="name-container">
            <div class="glitch-wrapper">
                <h1 class="glitch-text" data-text="KZNYBS">KZNYBS</h1>
            </div>
        </div>

        <div class="w-full max-w-sm md:max-w-xl p-6 md:p-12 profile-card" 
             data-tilt data-tilt-max="5" data-tilt-speed="1000" data-tilt-glare="true" data-tilt-max-glare="0.2">
            
            <div class="icon-container transform-gpu" style="transform: translateZ(30px);">
                <a href="https://github.com/kznybs" target="_blank" class="icon-link" aria-label="GitHub">
                    <i class="fab fa-github text-4xl md:text-5xl"></i>
                </a>

                <a href="https://steamcommunity.com/id/kznybs/" target="_blank" class="icon-link" aria-label="Steam">
                    <i class="fab fa-steam text-4xl md:text-5xl"></i>
                </a>

                <a href="https://www.instagram.com/kznybs/" target="_blank" class="icon-link" aria-label="Instagram">
                    <i class="fab fa-instagram text-4xl md:text-5xl"></i>
                </a>
                <a href="https://www.linkedin.com/in/kznybs/" target="_blank" class="icon-link" aria-label="LinkedIn">
                    <i class="fab fa-linkedin text-4xl md:text-5xl"></i>
                </a>
            </div>

            <div class="absolute bottom-3 right-4 text-[9px] font-mono tracking-[0.2em] pointer-events-none text-white/50 animate-pulse">
            
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    
    <script>
        // --- MOTOR DE TEMPESTADE (CANVAS) ---
        const canvas = document.getElementById('storm-canvas');
        const ctx = canvas.getContext('2d');
        const mainContent = document.getElementById('main-content');
        const body = document.body;

        let width, height;
        let rain = [];
        let lightning = [];
        let flashOpacity = 0;

        // Variáveis do Holofote (Movimento do Background)
        let spotX, spotY;
        let spotVX, spotVY;

        // Configuração
        const rainCount = 400;
        const rainSpeed = 15;
        const rainAngle = 0.2; // Chuva diagonal

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            // Inicializar holofote se necessário
            if (spotX === undefined) {
                spotX = width / 2;
                spotY = height / 2;
                // Velocidade aleatória para o movimento
                spotVX = (Math.random() - 0.5) * 3;
                spotVY = (Math.random() - 0.5) * 3;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // Classe Gotas de Chuva
        class Drop {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -Math.random() * 100;
                this.z = Math.random() * 0.5 + 0.5; // Profundidade
                this.len = Math.random() * 20 + 10;
                this.speed = (Math.random() * 10 + 20) * this.z;
            }

            update() {
                this.x += rainAngle * 2;
                this.y += this.speed;

                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(180, 180, 180, ${0.15 * this.z})`; // Cor da chuva
                ctx.lineWidth = 1.5 * this.z;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + rainAngle * 5, this.y + this.len);
                ctx.stroke();
            }
        }

        // Criar gotas
        for (let i = 0; i < rainCount; i++) {
            rain.push(new Drop());
        }

        // Gerador de Raio Procedural
        function createLightning() {
            const x = Math.random() * width;
            const y = 0;
            const segments = [];
            let currentX = x;
            let currentY = y;

            while (currentY < height) {
                const nextX = currentX + (Math.random() - 0.5) * 100; // Ziguezague
                const nextY = currentY + Math.random() * 50 + 20;     // Descida
                segments.push({x1: currentX, y1: currentY, x2: nextX, y2: nextY});
                currentX = nextX;
                currentY = nextY;
            }
            
            lightning.push({
                segments: segments,
                life: 10,
                opacity: 1
            });

            // Flash e Tremor
            flashOpacity = 0.4; 
            triggerShake();
        }

        function triggerShake() {
            mainContent.classList.add('thunder-shake');
            setTimeout(() => {
                mainContent.classList.remove('thunder-shake');
            }, 500);
        }

        // Evento de clique na tela inteira
        window.addEventListener('click', () => {
            createLightning();
        });

        function loop() {
            // Atualizar posição do holofote (Spotlight)
            spotX += spotVX;
            spotY += spotVY;

            // Rebater nas bordas
            if (spotX < 0 || spotX > width) spotVX *= -1;
            if (spotY < 0 || spotY > height) spotVY *= -1;

            // Limpar tela desenhando o gradiente dinâmico
            // O centro do gradiente agora usa spotX e spotY
            const gradient = ctx.createRadialGradient(spotX, spotY, 0, spotX, spotY, Math.max(width, height) * 0.8);
            gradient.addColorStop(0, "#2a2a2a"); // Centro mais claro (cinza escuro)
            gradient.addColorStop(1, "#050505"); // Bordas pretas
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // 1. Desenhar Chuva
            rain.forEach(drop => {
                drop.update();
                drop.draw();
            });

            // 2. Controlar Raios
            if (Math.random() < 0.008) { // Frequência dos raios
                createLightning();
            }

            // 3. Desenhar Raios
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = "white";
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            
            for (let i = lightning.length - 1; i >= 0; i--) {
                const bolt = lightning[i];
                ctx.globalAlpha = bolt.opacity;
                
                ctx.beginPath();
                bolt.segments.forEach(seg => {
                    ctx.moveTo(seg.x1, seg.y1);
                    ctx.lineTo(seg.x2, seg.y2);
                });
                ctx.stroke();

                bolt.life--;
                bolt.opacity = Math.random(); 
                
                if (bolt.life <= 0) {
                    lightning.splice(i, 1);
                }
            }
            ctx.restore();

            // 4. Desenhar Flash Global
            if (flashOpacity > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${flashOpacity})`;
                ctx.fillRect(0, 0, width, height);
                flashOpacity *= 0.85; 
            }

            requestAnimationFrame(loop);
        }

        loop();

        // Vanilla Tilt
        VanillaTilt.init(document.querySelector(".profile-card"), {
            max: 5,
            speed: 1000, 
            glare: true,
            "max-glare": 0.2,
            scale: 1.02,
            perspective: 1000,
            gyroscope: true
        });
    </script>

</body>
</html>
