<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KZNYBS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- Configurações Gerais "Monster Storm" Theme --- */
        :root {
            --blood-red: #8a0000; 
            --bright-red: #ff0000;
            --void-black: #050000;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: #d1d5db;
            background-color: var(--void-black);
            overflow-x: hidden;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; 
        }

        /* --- Camada de Raios (Strobe Effect) --- */
        .lightning-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            z-index: 1; 
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: overlay;
            animation: lightning-flash 5s infinite;
        }

        @keyframes lightning-flash {
            0%, 90% { opacity: 0; background-color: rgba(255, 0, 0, 0.1); }
            92% { opacity: 0.6; background-color: rgba(255, 255, 255, 0.2); }
            93% { opacity: 0; }
            94% { opacity: 0.4; background-color: rgba(255, 0, 0, 0.3); }
            96% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* --- Fundo --- */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            background: radial-gradient(circle at center, #1a0000 0%, #000000 100%); 
        }

        /* Vignette Pulsante */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, #000 110%);
            pointer-events: none;
            z-index: 2;
            animation: vignette-pulse 3s infinite ease-in-out;
        }

        @keyframes vignette-pulse {
            0%, 100% { background: radial-gradient(circle, transparent 30%, #000 110%); }
            50% { background: radial-gradient(circle, transparent 40%, #000 100%); }
        }

        /* Scanline Rápido */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(20,0,0,0), rgba(20,0,0,0) 50%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.5));
            background-size: 100% 4px;
            z-index: 50;
            pointer-events: none;
            opacity: 0.15;
            animation: scanline-move 0.2s linear infinite;
        }

        @keyframes scanline-move {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

        /* --- Layout Instável --- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 10;
            padding: 1rem;
            animation: storm-shake 0.3s infinite;
        }

        @keyframes storm-shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, 0); }
            75% { transform: translate(0, -1px); }
            100% { transform: translate(0, 0); }
        }

        /* --- Tipografia Glitch --- */
        h1 { font-family: 'Audiowide', cursive; }
        
        .glitch-wrapper { position: relative; display: inline-block; white-space: nowrap; }

        .glitch-text {
            position: relative;
            font-size: clamp(3.5rem, 13vw, 7rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            color: #fff;
            text-shadow: 4px 4px 0px var(--blood-red);
            animation: glitch-anim 0.2s infinite alternate-reverse; 
        }

        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--void-black);
            opacity: 1;
        }

        .glitch-text::before {
            left: 3px;
            text-shadow: -2px 0 red;
            clip: rect(44px, 9999px, 56px, 0);
            animation: glitch-anim-2 2s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -3px;
            text-shadow: -2px 0 darkred;
            clip: rect(44px, 9999px, 56px, 0);
            animation: glitch-anim-3 1.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { text-shadow: 4px 4px 0px var(--blood-red); transform: skew(0deg); }
            20% { text-shadow: -4px -4px 0px var(--blood-red); transform: skew(-2deg); }
            40% { text-shadow: -4px 4px 0px var(--blood-red); transform: skew(0deg); }
            60% { text-shadow: 4px -4px 0px var(--blood-red); transform: skew(2deg); }
            80% { text-shadow: 4px 0px 0px var(--blood-red); transform: skew(0deg); }
            100% { text-shadow: 0px 4px 0px var(--blood-red); transform: skew(0deg); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(12px, 9999px, 5px, 0); }
            100% { clip: rect(95px, 9999px, 100px, 0); }
        }
        @keyframes glitch-anim-3 {
            0% { clip: rect(5px, 9999px, 15px, 0); }
            100% { clip: rect(100px, 9999px, 95px, 0); }
        }

        /* --- Cartão Cyberpunk Polygon --- */
        .profile-card {
            background: rgba(10, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            
            /* Recorte Polygon Agressivo */
            clip-path: polygon(
                30px 0, 
                100% 0, 
                100% calc(100% - 30px), 
                calc(100% - 30px) 100%, 
                0 100%, 
                0 30px
            );
            
            /* Bordas não funcionam bem com clip-path, usando box-shadow interno */
            box-shadow: 
                inset 0 0 0 1px rgba(138, 0, 0, 0.6), 
                inset 0 0 60px rgba(0, 0, 0, 1);
            
            /* Drop shadow aplicado via filtro para seguir o formato */
            filter: drop-shadow(0 0 20px rgba(138, 0, 0, 0.4));
            
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            transition: all 0.1s ease;
        }

        /* Ícones */
        .icon-container { display: flex; gap: 1.5rem; justify-content: center; align-items: center; }
        @media (min-width: 768px) { .icon-container { gap: 2.5rem; } }

        .icon-link {
            position: relative;
            color: rgba(200, 200, 200, 0.6);
            transition: all 0.2s ease;
            z-index: 10;
        }
        .icon-link:hover { color: #fff; transform: scale(1.1); text-shadow: 0 0 20px var(--bright-red); }
        .icon-link::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; width: 0; height: 2px;
            background: var(--bright-red); transform: translateX(-50%); transition: width 0.2s ease;
            box-shadow: 0 0 10px var(--blood-red);
        }
        .icon-link:hover::after { width: 100%; }

        .name-container { margin-bottom: 2rem; padding: 0 1rem; width: 100%; text-align: center; }
        @media (min-width: 768px) { .name-container { margin-bottom: 3rem; } }

    </style>
</head>
<body class="antialiased">

    <div class="lightning-overlay"></div>
    <div class="scanlines"></div>
    <div id="particles-js"></div>

    <div class="main-content">
        <div class="name-container">
            <div class="glitch-wrapper">
                <h1 class="glitch-text" data-text="KZNYBS">KZNYBS</h1>
            </div>
        </div>

        <!-- Removido 'rounded-sm' para usar o clip-path customizado -->
        <div class="w-full max-w-sm md:max-w-xl p-6 md:p-12 profile-card" 
             data-tilt data-tilt-max="5" data-tilt-speed="1000" data-tilt-glare="true" data-tilt-max-glare="0.2">
            
            <div class="icon-container transform-gpu" style="transform: translateZ(30px);">
                <a href="https://github.com/kznybs" target="_blank" class="icon-link" aria-label="GitHub">
                    <i class="fab fa-github text-4xl md:text-5xl"></i>
                </a>
                <a href="https://www.instagram.com/kznybs/" target="_blank" class="icon-link" aria-label="Instagram">
                    <i class="fab fa-instagram text-4xl md:text-5xl"></i>
                </a>
                <a href="https://www.linkedin.com/in/kznybs/" target="_blank" class="icon-link" aria-label="LinkedIn">
                    <i class="fab fa-linkedin text-4xl md:text-5xl"></i>
                </a>
            </div>

            <div class="absolute bottom-3 right-4 text-[9px] font-mono tracking-[0.2em] pointer-events-none text-red-600/60 animate-pulse">
                SYSTEM FAILURE // 666
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    
    <script>
        particlesJS('particles-js', {
            "particles": {
                // Tempestade de detritos
                "number": { "value": 150, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": ["#8a0000", "#550000", "#000000"] },
                "shape": { "type": "circle" },
                "opacity": { 
                    "value": 0.8, "random": true, 
                    "anim": { "enable": true, "speed": 5, "opacity_min": 0.1, "sync": false } 
                },
                "size": { 
                    "value": 4, "random": true, 
                    "anim": { "enable": false } 
                },
                "line_linked": { "enable": false },
                "move": { 
                    "enable": true, 
                    "speed": 25, 
                    "direction": "right", 
                    "random": true, 
                    "straight": false, 
                    "out_mode": "out", 
                    "attract": { "enable": false } 
                }
            },
            "interactivity": {
                "detect_on": "window",
                "events": { 
                    "onhover": { "enable": true, "mode": "repulse" }, 
                    "onclick": { "enable": true, "mode": "push" }, 
                    "resize": true 
                },
                "modes": {
                    "repulse": { "distance": 100, "duration": 0.4 },
                    "push": { "particles_nb": 4 }
                }
            },
            "retina_detect": true
        });

        VanillaTilt.init(document.querySelector(".profile-card"), {
            max: 5,
            speed: 1000, 
            glare: true,
            "max-glare": 0.3,
            scale: 1.02,
            perspective: 1000,
            gyroscope: true
        });
    </script>

</body>
</html>
