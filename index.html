<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KZNYBS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- Configurações Gerais "Monochrome Noir" Theme --- */
        :root {
            --pure-white: #ffffff;
            --mid-gray: #888888;
            --void-black: #050505;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: #e5e5e5;
            background-color: var(--void-black);
            overflow-x: hidden;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; 
        }

        /* --- Fundo Particles --- */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%); 
        }

        /* Vignette Escura */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, #000000 110%);
            pointer-events: none;
            z-index: 2;
        }

        /* Scanline Digital - Branco/Cinza */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(255,255,255,0.02) 50%, rgba(255,255,255,0.02));
            background-size: 100% 3px;
            z-index: 50;
            pointer-events: none;
            opacity: 0.3;
            animation: scanline-move 0.2s linear infinite;
        }

        @keyframes scanline-move {
            0% { transform: translateY(0); }
            100% { transform: translateY(3px); }
        }

        /* --- Layout Flutuante --- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 10;
            padding: 1rem;
            animation: levitate 8s ease-in-out infinite;
        }

        @keyframes levitate {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* --- Tipografia Glitch Monocromática --- */
        h1 { font-family: 'Audiowide', cursive; }
        
        .glitch-wrapper { position: relative; display: inline-block; white-space: nowrap; }

        .glitch-text {
            position: relative;
            font-size: clamp(3.5rem, 13vw, 7rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
            animation: glitch-anim 4s infinite step-end; 
        }

        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--void-black);
            opacity: 1;
        }

        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 #888;
            clip: rect(44px, 9999px, 56px, 0);
            animation: glitch-anim-2 5s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 #ccc;
            clip: rect(44px, 9999px, 56px, 0);
            animation: glitch-anim-3 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { text-shadow: 2px 2px 0px #fff; }
            20% { text-shadow: -2px -2px 0px #888; }
            40% { text-shadow: -2px 2px 0px #ccc; }
            60% { text-shadow: 2px -2px 0px #fff; }
            80% { text-shadow: 2px 0px 0px #888; }
            100% { text-shadow: 0px 2px 0px #ccc; }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(12px, 9999px, 5px, 0); }
            100% { clip: rect(95px, 9999px, 100px, 0); }
        }
        @keyframes glitch-anim-3 {
            0% { clip: rect(5px, 9999px, 15px, 0); }
            100% { clip: rect(100px, 9999px, 95px, 0); }
        }

        /* --- Cartão Noir --- */
        .profile-card {
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            /* Recorte poligonal */
            clip-path: polygon(
                30px 0, 
                100% 0, 
                100% calc(100% - 30px), 
                calc(100% - 30px) 100%, 
                0 100%, 
                0 30px
            );
            
            box-shadow: 
                inset 0 0 0 1px rgba(255, 255, 255, 0.2), 
                inset 0 0 50px rgba(0, 0, 0, 0.9);
            
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.1));
            
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .profile-card:hover {
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
            box-shadow: 
                inset 0 0 0 1px rgba(255, 255, 255, 0.5), 
                inset 0 0 60px rgba(0, 0, 0, 1);
        }

        /* Ícones */
        .icon-container { display: flex; gap: 1.5rem; justify-content: center; align-items: center; }
        @media (min-width: 768px) { .icon-container { gap: 2.5rem; } }

        .icon-link {
            position: relative;
            color: rgba(150, 150, 150, 0.6);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .icon-link:hover { color: #fff; transform: scale(1.1); text-shadow: 0 0 15px #fff; }
        
        .icon-link::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; width: 0; height: 2px;
            background: #fff; transform: translateX(-50%); transition: width 0.3s ease;
            box-shadow: 0 0 10px #fff;
        }
        .icon-link:hover::after { width: 100%; }

        .name-container { margin-bottom: 2rem; padding: 0 1rem; width: 100%; text-align: center; }
        @media (min-width: 768px) { .name-container { margin-bottom: 3rem; } }

    </style>
</head>
<body class="antialiased">

    <div class="scanlines"></div>
    <div id="particles-js"></div>

    <div class="main-content">
        <div class="name-container">
            <div class="glitch-wrapper">
                <h1 class="glitch-text" data-text="KZNYBS">KZNYBS</h1>
            </div>
        </div>

        <div class="w-full max-w-sm md:max-w-xl p-6 md:p-12 profile-card" 
             data-tilt data-tilt-max="5" data-tilt-speed="1000" data-tilt-glare="true" data-tilt-max-glare="0.2">
            
            <div class="icon-container transform-gpu" style="transform: translateZ(30px);">
                <a href="https://github.com/kznybs" target="_blank" class="icon-link" aria-label="GitHub">
                    <i class="fab fa-github text-4xl md:text-5xl"></i>
                </a>

                <a href="https://steamcommunity.com/id/kznybs/" target="_blank" class="icon-link" aria-label="Steam">
                    <i class="fab fa-steam text-4xl md:text-5xl"></i>
                </a>

                <a href="https://www.instagram.com/kznybs/" target="_blank" class="icon-link" aria-label="Instagram">
                    <i class="fab fa-instagram text-4xl md:text-5xl"></i>
                </a>
                <a href="https://www.linkedin.com/in/kznybs/" target="_blank" class="icon-link" aria-label="LinkedIn">
                    <i class="fab fa-linkedin text-4xl md:text-5xl"></i>
                </a>
            </div>

            <div class="absolute bottom-3 right-4 text-[9px] font-mono tracking-[0.2em] pointer-events-none text-white/40 animate-pulse">
              
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    
    <script>
        // Ícone "Z" em SVG convertido para Base64
        const zIcon = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJ3aGl0ZSI+PHBhdGggZD0iTTIxIDNIM3YzaDEzLjVMMyAxOC41VjIxaDE4di0zSDcuNUwyMSA1LjVWM3oiLz48L3N2Zz4=";

        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" }, 
                "shape": { 
                    "type": "image", 
                    "image": {
                        "src": zIcon,
                        "width": 100,
                        "height": 100
                    }
                },
                "opacity": { 
                    "value": 0.7, "random": true, 
                    "anim": { "enable": true, "speed": 1, "opacity_min": 0.2, "sync": false } 
                },
                "size": { 
                    "value": 12, /* Tamanho aumentado para o Z ficar legível */
                    "random": true, 
                    "anim": { "enable": false } 
                },
                "line_linked": { 
                    "enable": true, 
                    "distance": 150, 
                    "color": "#ffffff", 
                    "opacity": 0.1, 
                    "width": 1 
                },
                "move": { 
                    "enable": true, 
                    "speed": 2, 
                    "direction": "none", 
                    "random": true, 
                    "straight": false, 
                    "out_mode": "out", 
                    "attract": { "enable": false } 
                }
            },
            "interactivity": {
                "detect_on": "window",
                "events": { 
                    "onhover": { "enable": true, "mode": "repulse" }, 
                    "onclick": { "enable": true, "mode": "push" }, 
                    "resize": true 
                },
                "modes": {
                    "repulse": { "distance": 100, "duration": 0.4 },
                    "push": { "particles_nb": 4 }
                }
            },
            "retina_detect": true
        });

        VanillaTilt.init(document.querySelector(".profile-card"), {
            max: 5,
            speed: 1000, 
            glare: true,
            "max-glare": 0.1,
            scale: 1.02,
            perspective: 1000,
            gyroscope: true
        });
    </script>

</body>
</html>
