<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KZNYBS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- Configurações Gerais "Bio Forest" Theme --- */
        :root {
            --toxic-green: #2ecc71; /* Verde mais natural */
            --forest-green: #006400;
            --deep-dark: #010a01;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: #d1d5db;
            background-color: var(--deep-dark);
            overflow-x: hidden;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; 
        }

        /* --- Fundo com Bio-Fog (Neblina) --- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 120%, rgba(20, 90, 30, 0.2), transparent 70%);
            z-index: -1;
            pointer-events: none;
            animation: fog-pulse 8s infinite alternate;
        }

        @keyframes fog-pulse {
            0% { opacity: 0.4; }
            100% { opacity: 0.8; }
        }

        /* --- Fundo Particles --- */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            background: radial-gradient(circle at center, #051a05 0%, #000000 100%); 
        }

        /* Vignette Verde */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, #000500 110%);
            pointer-events: none;
            z-index: 2;
        }

        /* Scanline Digital - Mais sutil */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,20,0,0), rgba(0,20,0,0) 50%, rgba(0,20,0,0.1) 50%, rgba(0,20,0,0.1));
            background-size: 100% 4px;
            z-index: 50;
            pointer-events: none;
            opacity: 0.15;
            animation: scanline-move 0.2s linear infinite;
        }

        @keyframes scanline-move {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

        /* --- Layout Flutuante --- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 10;
            padding: 1rem;
            animation: levitate 6s ease-in-out infinite;
        }

        @keyframes levitate {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- Tipografia Glitch Verde --- */
        h1 { font-family: 'Audiowide', cursive; }
        
        .glitch-wrapper { position: relative; display: inline-block; white-space: nowrap; }

        .glitch-text {
            position: relative;
            font-size: clamp(3.5rem, 13vw, 7rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            color: #fff;
            text-shadow: 0 0 10px var(--toxic-green);
            animation: glitch-anim 3s infinite alternate-reverse; 
        }

        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--deep-dark);
            opacity: 0.8;
        }

        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 var(--forest-green);
            clip: rect(44px, 9999px, 56px, 0);
            animation: glitch-anim-2 4s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: -2px 0 var(--toxic-green);
            clip: rect(44px, 9999px, 56px, 0);
            animation: glitch-anim-3 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { text-shadow: 4px 4px 0px var(--forest-green); }
            20% { text-shadow: -4px -4px 0px var(--toxic-green); }
            40% { text-shadow: -4px 4px 0px var(--forest-green); }
            60% { text-shadow: 4px -4px 0px var(--toxic-green); }
            80% { text-shadow: 4px 0px 0px var(--forest-green); }
            100% { text-shadow: 0px 4px 0px var(--toxic-green); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(12px, 9999px, 5px, 0); }
            100% { clip: rect(95px, 9999px, 100px, 0); }
        }
        @keyframes glitch-anim-3 {
            0% { clip: rect(5px, 9999px, 15px, 0); }
            100% { clip: rect(100px, 9999px, 95px, 0); }
        }

        /* --- Cartão Bio-Tech --- */
        .profile-card {
            background: rgba(0, 20, 5, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            /* Recorte poligonal */
            clip-path: polygon(
                30px 0, 
                100% 0, 
                100% calc(100% - 30px), 
                calc(100% - 30px) 100%, 
                0 100%, 
                0 30px
            );
            
            box-shadow: 
                inset 0 0 0 1px rgba(46, 204, 113, 0.3), 
                inset 0 0 40px rgba(0, 20, 0, 0.8);
            
            filter: drop-shadow(0 0 15px rgba(46, 204, 113, 0.15));
            
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .profile-card:hover {
            filter: drop-shadow(0 0 25px rgba(46, 204, 113, 0.3));
            box-shadow: 
                inset 0 0 0 1px rgba(46, 204, 113, 0.6), 
                inset 0 0 50px rgba(0, 40, 0, 0.9);
        }

        /* Ícones */
        .icon-container { display: flex; gap: 1.5rem; justify-content: center; align-items: center; }
        @media (min-width: 768px) { .icon-container { gap: 2.5rem; } }

        .icon-link {
            position: relative;
            color: rgba(200, 255, 200, 0.6);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .icon-link:hover { color: #fff; transform: scale(1.1); text-shadow: 0 0 20px var(--toxic-green); }
        
        .icon-link::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; width: 0; height: 2px;
            background: var(--toxic-green); transform: translateX(-50%); transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--toxic-green);
        }
        .icon-link:hover::after { width: 100%; }

        .name-container { margin-bottom: 2rem; padding: 0 1rem; width: 100%; text-align: center; }
        @media (min-width: 768px) { .name-container { margin-bottom: 3rem; } }

    </style>
</head>
<body class="antialiased">

    <div class="scanlines"></div>
    <div id="particles-js"></div>

    <div class="main-content">
        <div class="name-container">
            <div class="glitch-wrapper">
                <h1 class="glitch-text" data-text="KZNYBS">KZNYBS</h1>
            </div>
        </div>

        <div class="w-full max-w-sm md:max-w-xl p-6 md:p-12 profile-card" 
             data-tilt data-tilt-max="5" data-tilt-speed="1000" data-tilt-glare="true" data-tilt-max-glare="0.2">
            
            <div class="icon-container transform-gpu" style="transform: translateZ(30px);">
                <a href="https://github.com/kznybs" target="_blank" class="icon-link" aria-label="GitHub">
                    <i class="fab fa-github text-4xl md:text-5xl"></i>
                </a>

                <a href="https://steamcommunity.com/id/kznybs/" target="_blank" class="icon-link" aria-label="Steam">
                    <i class="fab fa-steam text-4xl md:text-5xl"></i>
                </a>

                <a href="https://www.instagram.com/kznybs/" target="_blank" class="icon-link" aria-label="Instagram">
                    <i class="fab fa-instagram text-4xl md:text-5xl"></i>
                </a>
                <a href="https://www.linkedin.com/in/kznybs/" target="_blank" class="icon-link" aria-label="LinkedIn">
                    <i class="fab fa-linkedin text-4xl md:text-5xl"></i>
                </a>
            </div>

            <div class="absolute bottom-3 right-4 text-[9px] font-mono tracking-[0.2em] pointer-events-none text-green-500/60 animate-pulse">
                Z
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    
    <script>
        // Imagem de folha SVG codificada em Base64
        const leafImage = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzJlY2M3MSI+PHBhdGggZD0iTTEyLDJDMjAsMiw1LDIyLDUsMjJzNC02LDQtMTJjMC0yLDIuNS01LDUuNS01QzE2LDUuNSwxOSwzLjUsMjIsMUMyMiwxLDEyLDIgMTIsMnoiLz48cGF0aCBkPSJNMTIsMmMwLDAsOCw4LDgsMTRjMCw0LTQsNi04LDZDMjAsMjIsMTIsMiAxMiwyWiIgb3BhY2l0eT0iMC42Ii8+PC9zdmc+";

        particlesJS('particles-js', {
            "particles": {
                "number": { 
                    "value": 40, /* Menos partículas pois as folhas são maiores */
                    "density": { "enable": true, "value_area": 800 } 
                },
                "color": { "value": "#ffffff" }, /* A cor é definida no SVG */
                "shape": { 
                    "type": "image", 
                    "image": {
                        "src": leafImage,
                        "width": 100,
                        "height": 100
                    }
                },
                "opacity": { 
                    "value": 0.8, "random": true, 
                    "anim": { "enable": true, "speed": 1, "opacity_min": 0.4, "sync": false } 
                },
                "size": { 
                    "value": 20, /* Tamanho grande para ver o formato da folha */
                    "random": true, 
                    "anim": { "enable": false } 
                },
                "line_linked": { "enable": false }, 
                "move": { 
                    "enable": true, 
                    "speed": 2, 
                    "direction": "bottom", /* Caindo para baixo */
                    "random": false, 
                    "straight": false, 
                    "out_mode": "out", 
                    "attract": { "enable": false } 
                }
            },
            "interactivity": {
                "detect_on": "window",
                "events": { 
                    "onhover": { "enable": true, "mode": "bubble" }, 
                    "onclick": { "enable": true, "mode": "repulse" }, 
                    "resize": true 
                },
                "modes": {
                    "bubble": { "distance": 200, "size": 25, "duration": 2, "opacity": 1, "speed": 3 },
                    "repulse": { "distance": 150, "duration": 0.4 }
                }
            },
            "retina_detect": true
        });

        VanillaTilt.init(document.querySelector(".profile-card"), {
            max: 8,
            speed: 1000, 
            glare: true,
            "max-glare": 0.2,
            scale: 1.02,
            perspective: 1000,
            gyroscope: true
        });
    </script>

</body>
</html>
