<!DOCTYPE html>
<html lang="pt-PT">
<head>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        /* --- ESTILOS GERAIS UNIFICADOS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* --- HIGH-END CINEMATIC SETTINGS (BLUE/OCEAN) --- */
        :root {
            --void-black: #000414;
            --glass-base: rgba(10, 30, 60, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-glow: rgba(0, 150, 255, 0.05);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            background-color: var(--void-black);
            overflow: hidden; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; 
            perspective: 1000px;
            cursor: none; /* Cursor totalmente invisível */
        }

        /* Oculta todos os cursores interativos para garantir que não aparece nenhum */
        a, button, input {
            cursor: none !important;
        }

        /* --- WEBGL BACKGROUND --- */
        #webGLApp {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* --- IMMERSIVE OVERLAYS --- */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(0,2,8,0.8) 90%, #000 100%);
            pointer-events: none;
            z-index: 2;
        }

        .film-grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            z-index: 50;
            pointer-events: none;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0%,
                rgba(255, 255, 255, 0.02) 0.5%,
                transparent 1%
            );
            z-index: 49;
            pointer-events: none;
            animation: scanline-shift 10s linear infinite;
        }

        @keyframes scanline-shift {
            0% { background-position: 0 0; }
            100% { background-position: 0 100vh; }
        }

        /* --- PHYSICS & SHAKE FX --- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 10;
            padding: 1rem;
            transform-style: preserve-3d;
        }

        /* --- TYPOGRAPHY (NEXT-GEN GLITCH) --- */
        .name-container { 
            margin-bottom: 3rem; 
            perspective: 800px;
        }

        h1 { font-family: 'Audiowide', cursive; }
        
        .glitch-wrapper { 
            position: relative; 
            display: inline-block; 
            white-space: nowrap; 
        }

        .glitch-text {
            position: relative;
            font-size: clamp(4rem, 15vw, 8.5rem);
            font-weight: 900;
            letter-spacing: 0.05em;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.4);
            background: linear-gradient(180deg, #fff 0%, #777 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }

        /* --- ULTRA-PREMIUM GLASS CARD --- */
        .profile-card {
            background: linear-gradient(135deg, rgba(20, 50, 100, 0.4) 0%, rgba(5, 10, 20, 0.7) 100%);
            backdrop-filter: blur(35px) saturate(150%);
            -webkit-backdrop-filter: blur(35px) saturate(150%);
            border-radius: 40px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.2), 
                inset 0 -1px 2px rgba(0, 0, 0, 0.8), 
                0 40px 80px rgba(0, 0, 0, 0.95), 
                0 0 0 1px rgba(255, 255, 255, 0.02); 
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .profile-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.03) 40%,
                rgba(255,255,255,0.15) 50%,
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0) 100%
            );
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.6s ease-out;
            pointer-events: none;
            z-index: 1;
        }

        .profile-card:hover::before { transform: rotate(30deg) translateY(100%); }

        .profile-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- ICONS (NEO-MORPHIC) --- */
        .icon-container { 
            display: flex; gap: 2rem; justify-content: center; align-items: center; z-index: 2; position: relative;
        }
        @media (min-width: 768px) { .icon-container { gap: 3.5rem; } }

        .icon-link {
            position: relative;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
        }
        
        .icon-link:hover { 
            color: #fff; transform: translateY(-10px) scale(1.2); text-shadow: 0 0 25px rgba(255, 255, 255, 0.9); 
        }
        
        .icon-link::after {
            content: ''; position: absolute; bottom: -15px; width: 4px; height: 4px; border-radius: 50%;
            background: #fff; opacity: 0; transform: scale(0); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
        }
        .icon-link:hover::after { opacity: 1; transform: scale(1); }

        /* --- HUD ELEMENTS --- */
        .hud-text {
            position: absolute; font-family: 'Courier New', Courier, monospace; font-weight: 700;
            letter-spacing: 0.4em; font-size: 0.65rem; color: rgba(255, 255, 255, 0.2); pointer-events: none;
            z-index: 2;
        }

        .hud-bottom-right { bottom: 1.5rem; right: 2rem; }
        .hud-top-left { top: 1.5rem; left: 2rem; opacity: 0.5; }

        .footer {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 10; color: white; font-family: "Syne", sans-serif; font-size: clamp(0.875rem, 1.5vw, 1.125rem); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; text-align: center; pointer-events: auto;
        }
        .footer a { color: white; text-decoration: none; transition: opacity 0.3s ease; }
        .footer a:hover { opacity: 0.7; }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // ==========================================
        // PARTE 1: SISTEMA DE FUNDO FLUIDO (THREE.JS)
        // ==========================================

        // Classe TouchTexture (Textura Interativa)
        class TouchTexture {
            constructor() {
                this.size = 64;
                this.width = this.height = this.size;
                this.maxAge = 64;
                this.radius = 0.25 * this.size;
                this.speed = 1 / this.maxAge;
                this.trail = [];
                this.last = null;
                this.initTexture();
            }

            initTexture() {
                this.canvas = document.createElement("canvas");
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.ctx = this.canvas.getContext("2d");
                this.ctx.fillStyle = "black";
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.texture = new THREE.Texture(this.canvas);
            }

            update() {
                this.clear();
                let speed = this.speed;
                for (let i = this.trail.length - 1; i >= 0; i--) {
                    const point = this.trail[i];
                    let f = point.force * speed * (1 - point.age / this.maxAge);
                    point.x += point.vx * f;
                    point.y += point.vy * f;
                    point.age++;
                    if (point.age > this.maxAge) {
                        this.trail.splice(i, 1);
                    } else {
                        this.drawPoint(point);
                    }
                }
                this.texture.needsUpdate = true;
            }

            clear() {
                this.ctx.fillStyle = "black";
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }

            addTouch(point) {
                let force = 0;
                let vx = 0;
                let vy = 0;
                const last = this.last;
                if (last) {
                    const dx = point.x - last.x;
                    const dy = point.y - last.y;
                    if (dx === 0 && dy === 0) return;
                    const dd = dx * dx + dy * dy;
                    let d = Math.sqrt(dd);
                    vx = dx / d;
                    vy = dy / d;
                    force = Math.min(dd * 20000, 2.0);
                }
                this.last = { x: point.x, y: point.y };
                this.trail.push({ x: point.x, y: point.y, age: 0, force, vx, vy });
            }

            drawPoint(point) {
                const pos = { x: point.x * this.width, y: (1 - point.y) * this.height };
                let intensity = 1;
                
                if (point.age < this.maxAge * 0.3) {
                    intensity = Math.sin((point.age / (this.maxAge * 0.3)) * (Math.PI / 2));
                } else {
                    const t = 1 - (point.age - this.maxAge * 0.3) / (this.maxAge * 0.7);
                    intensity = -t * (t - 2);
                }
                intensity *= point.force;

                const radius = this.radius;
                let color = `${((point.vx + 1) / 2) * 255}, ${((point.vy + 1) / 2) * 255}, ${intensity * 255}`;
                let offset = this.size * 5;
                
                this.ctx.shadowOffsetX = offset;
                this.ctx.shadowOffsetY = offset;
                this.ctx.shadowBlur = radius * 1;
                this.ctx.shadowColor = `rgba(${color},${0.2 * intensity})`;

                this.ctx.beginPath();
                this.ctx.fillStyle = "rgba(255,0,0,1)";
                this.ctx.arc(pos.x - offset, pos.y - offset, radius, 0, Math.PI * 2);
                this.ctx.fill();
            }
        }

        // Classe GradientBackground
        class GradientBackground {
            constructor(sceneManager) {
                this.sceneManager = sceneManager;
                this.mesh = null;
                const w = window.innerWidth || 1;
                const h = window.innerHeight || 1;
                
                // Uniforms fixos para o Esquema 1
                this.uniforms = {
                    uTime: { value: 0 },
                    uResolution: { value: new THREE.Vector2(w, h) },
                    uColor1: { value: new THREE.Vector3(0.945, 0.353, 0.133) }, 
                    uColor2: { value: new THREE.Vector3(0.039, 0.055, 0.153) }, 
                    uColor3: { value: new THREE.Vector3(0.945, 0.353, 0.133) }, 
                    uColor4: { value: new THREE.Vector3(0.039, 0.055, 0.153) }, 
                    uColor5: { value: new THREE.Vector3(0.945, 0.353, 0.133) }, 
                    uColor6: { value: new THREE.Vector3(0.039, 0.055, 0.153) }, 
                    uSpeed: { value: 1.5 }, 
                    uIntensity: { value: 1.8 },
                    uTouchTexture: { value: null },
                    uGrainIntensity: { value: 0.08 },
                    uZoom: { value: 1.0 }, 
                    uDarkNavy: { value: new THREE.Vector3(0.039, 0.055, 0.153) }, 
                    uGradientSize: { value: 0.45 }, 
                    uGradientCount: { value: 12.0 }, 
                    uColor1Weight: { value: 0.5 }, 
                    uColor2Weight: { value: 1.8 } 
                };
            }

            init() {
                const viewSize = this.sceneManager.getViewSize();
                const geometry = new THREE.PlaneGeometry(viewSize.width, viewSize.height, 1, 1);

                const material = new THREE.ShaderMaterial({
                    uniforms: this.uniforms,
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vec3 pos = position.xyz;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.);
                            vUv = uv;
                        }
                    `,
                    fragmentShader: `
                        uniform float uTime;
                        uniform vec2 uResolution;
                        uniform vec3 uColor1;
                        uniform vec3 uColor2;
                        uniform vec3 uColor3;
                        uniform vec3 uColor4;
                        uniform vec3 uColor5;
                        uniform vec3 uColor6;
                        uniform float uSpeed;
                        uniform float uIntensity;
                        uniform sampler2D uTouchTexture;
                        uniform float uGrainIntensity;
                        uniform float uZoom;
                        uniform vec3 uDarkNavy;
                        uniform float uGradientSize;
                        uniform float uGradientCount;
                        uniform float uColor1Weight;
                        uniform float uColor2Weight;
                        
                        varying vec2 vUv;
                        
                        #define PI 3.14159265359
                        
                        float grain(vec2 uv, float time) {
                            vec2 grainUv = uv * uResolution * 0.5;
                            float grainValue = fract(sin(dot(grainUv + time, vec2(12.9898, 78.233))) * 43758.5453);
                            return grainValue * 2.0 - 1.0;
                        }
                        
                        vec3 getGradientColor(vec2 uv, float time) {
                            float gradientRadius = uGradientSize;
                            
                            vec2 center1 = vec2(0.5 + sin(time * uSpeed * 0.4) * 0.4, 0.5 + cos(time * uSpeed * 0.5) * 0.4);
                            vec2 center2 = vec2(0.5 + cos(time * uSpeed * 0.6) * 0.5, 0.5 + sin(time * uSpeed * 0.45) * 0.5);
                            vec2 center3 = vec2(0.5 + sin(time * uSpeed * 0.35) * 0.45, 0.5 + cos(time * uSpeed * 0.55) * 0.45);
                            vec2 center4 = vec2(0.5 + cos(time * uSpeed * 0.5) * 0.4, 0.5 + sin(time * uSpeed * 0.4) * 0.4);
                            vec2 center5 = vec2(0.5 + sin(time * uSpeed * 0.7) * 0.35, 0.5 + cos(time * uSpeed * 0.6) * 0.35);
                            vec2 center6 = vec2(0.5 + cos(time * uSpeed * 0.45) * 0.5, 0.5 + sin(time * uSpeed * 0.65) * 0.5);
                            
                            vec2 center7 = vec2(0.5 + sin(time * uSpeed * 0.55) * 0.38, 0.5 + cos(time * uSpeed * 0.48) * 0.42);
                            vec2 center8 = vec2(0.5 + cos(time * uSpeed * 0.65) * 0.36, 0.5 + sin(time * uSpeed * 0.52) * 0.44);
                            vec2 center9 = vec2(0.5 + sin(time * uSpeed * 0.42) * 0.41, 0.5 + cos(time * uSpeed * 0.58) * 0.39);
                            vec2 center10 = vec2(0.5 + cos(time * uSpeed * 0.48) * 0.37, 0.5 + sin(time * uSpeed * 0.62) * 0.43);
                            vec2 center11 = vec2(0.5 + sin(time * uSpeed * 0.68) * 0.33, 0.5 + cos(time * uSpeed * 0.44) * 0.46);
                            vec2 center12 = vec2(0.5 + cos(time * uSpeed * 0.38) * 0.39, 0.5 + sin(time * uSpeed * 0.56) * 0.41);
                            
                            float dist1 = length(uv - center1); float dist2 = length(uv - center2); float dist3 = length(uv - center3);
                            float dist4 = length(uv - center4); float dist5 = length(uv - center5); float dist6 = length(uv - center6);
                            float dist7 = length(uv - center7); float dist8 = length(uv - center8); float dist9 = length(uv - center9);
                            float dist10 = length(uv - center10); float dist11 = length(uv - center11); float dist12 = length(uv - center12);
                            
                            float influence1 = 1.0 - smoothstep(0.0, gradientRadius, dist1); float influence2 = 1.0 - smoothstep(0.0, gradientRadius, dist2);
                            float influence3 = 1.0 - smoothstep(0.0, gradientRadius, dist3); float influence4 = 1.0 - smoothstep(0.0, gradientRadius, dist4);
                            float influence5 = 1.0 - smoothstep(0.0, gradientRadius, dist5); float influence6 = 1.0 - smoothstep(0.0, gradientRadius, dist6);
                            float influence7 = 1.0 - smoothstep(0.0, gradientRadius, dist7); float influence8 = 1.0 - smoothstep(0.0, gradientRadius, dist8);
                            float influence9 = 1.0 - smoothstep(0.0, gradientRadius, dist9); float influence10 = 1.0 - smoothstep(0.0, gradientRadius, dist10);
                            float influence11 = 1.0 - smoothstep(0.0, gradientRadius, dist11); float influence12 = 1.0 - smoothstep(0.0, gradientRadius, dist12);
                            
                            vec2 rotatedUv1 = uv - 0.5;
                            float angle1 = time * uSpeed * 0.15;
                            rotatedUv1 = vec2(rotatedUv1.x * cos(angle1) - rotatedUv1.y * sin(angle1), rotatedUv1.x * sin(angle1) + rotatedUv1.y * cos(angle1)) + 0.5;
                            
                            vec2 rotatedUv2 = uv - 0.5;
                            float angle2 = -time * uSpeed * 0.12;
                            rotatedUv2 = vec2(rotatedUv2.x * cos(angle2) - rotatedUv2.y * sin(angle2), rotatedUv2.x * sin(angle2) + rotatedUv2.y * cos(angle2)) + 0.5;
                            
                            float radialGradient1 = length(rotatedUv1 - 0.5); float radialGradient2 = length(rotatedUv2 - 0.5);
                            float radialInfluence1 = 1.0 - smoothstep(0.0, 0.8, radialGradient1); float radialInfluence2 = 1.0 - smoothstep(0.0, 0.8, radialGradient2);
                            
                            vec3 color = vec3(0.0);
                            color += uColor1 * influence1 * (0.55 + 0.45 * sin(time * uSpeed)) * uColor1Weight;
                            color += uColor2 * influence2 * (0.55 + 0.45 * cos(time * uSpeed * 1.2)) * uColor2Weight;
                            color += uColor3 * influence3 * (0.55 + 0.45 * sin(time * uSpeed * 0.8)) * uColor1Weight;
                            color += uColor4 * influence4 * (0.55 + 0.45 * cos(time * uSpeed * 1.3)) * uColor2Weight;
                            color += uColor5 * influence5 * (0.55 + 0.45 * sin(time * uSpeed * 1.1)) * uColor1Weight;
                            color += uColor6 * influence6 * (0.55 + 0.45 * cos(time * uSpeed * 0.9)) * uColor2Weight;
                            
                            if (uGradientCount > 6.0) {
                                color += uColor1 * influence7 * (0.55 + 0.45 * sin(time * uSpeed * 1.4)) * uColor1Weight;
                                color += uColor2 * influence8 * (0.55 + 0.45 * cos(time * uSpeed * 1.5)) * uColor2Weight;
                                color += uColor3 * influence9 * (0.55 + 0.45 * sin(time * uSpeed * 1.6)) * uColor1Weight;
                                color += uColor4 * influence10 * (0.55 + 0.45 * cos(time * uSpeed * 1.7)) * uColor2Weight;
                            }
                            if (uGradientCount > 10.0) {
                                color += uColor5 * influence11 * (0.55 + 0.45 * sin(time * uSpeed * 1.8)) * uColor1Weight;
                                color += uColor6 * influence12 * (0.55 + 0.45 * cos(time * uSpeed * 1.9)) * uColor2Weight;
                            }
                            
                            color += mix(uColor1, uColor3, radialInfluence1) * 0.45 * uColor1Weight;
                            color += mix(uColor2, uColor4, radialInfluence2) * 0.4 * uColor2Weight;
                            
                            color = clamp(color, vec3(0.0), vec3(1.0)) * uIntensity;
                            
                            float luminance = dot(color, vec3(0.299, 0.587, 0.114));
                            color = mix(vec3(luminance), color, 1.35);
                            color = pow(color, vec3(0.92));
                            
                            float brightness1 = length(color);
                            float mixFactor1 = max(brightness1 * 1.2, 0.15);
                            color = mix(uDarkNavy, color, mixFactor1);
                            
                            float maxBrightness = 1.0;
                            float brightness = length(color);
                            if (brightness > maxBrightness) {
                                color = color * (maxBrightness / brightness);
                            }
                            return color;
                        }
                        
                        void main() {
                            vec2 uv = vUv;
                            
                            vec4 touchTex = texture2D(uTouchTexture, uv);
                            float vx = -(touchTex.r * 2.0 - 1.0);
                            float vy = -(touchTex.g * 2.0 - 1.0);
                            float intensity = touchTex.b;
                            
                            uv.x += vx * 0.8 * intensity;
                            uv.y += vy * 0.8 * intensity;
                            
                            vec2 center = vec2(0.5);
                            float dist = length(uv - center);
                            float ripple = sin(dist * 20.0 - uTime * 3.0) * 0.04 * intensity;
                            float wave = sin(dist * 15.0 - uTime * 2.0) * 0.03 * intensity;
                            uv += vec2(ripple + wave);
                            
                            vec3 color = getGradientColor(uv, uTime);
                            
                            float grainValue = grain(uv, uTime);
                            color += grainValue * uGrainIntensity;
                            
                            float timeShift = uTime * 0.5;
                            color.r += sin(timeShift) * 0.02;
                            color.g += cos(timeShift * 1.4) * 0.02;
                            color.b += sin(timeShift * 1.2) * 0.02;
                            
                            float brightness2 = length(color);
                            float mixFactor2 = max(brightness2 * 1.2, 0.15);
                            color = mix(uDarkNavy, color, mixFactor2);
                            
                            color = clamp(color, vec3(0.0), vec3(1.0));
                            
                            float maxBrightness = 1.0;
                            float brightness = length(color);
                            if (brightness > maxBrightness) {
                                color = color * (maxBrightness / brightness);
                            }
                            
                            gl_FragColor = vec4(color, 1.0);
                        }
                    `
                });

                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.z = 0;
                this.sceneManager.scene.add(this.mesh);
            }

            update(delta) {
                if (this.uniforms.uTime) {
                    this.uniforms.uTime.value += delta;
                }
            }

            onResize(width, height) {
                const viewSize = this.sceneManager.getViewSize();
                if (this.mesh) {
                    this.mesh.geometry.dispose();
                    this.mesh.geometry = new THREE.PlaneGeometry(viewSize.width, viewSize.height, 1, 1);
                }
                if (this.uniforms.uResolution) {
                    this.uniforms.uResolution.value.set(width, height);
                }
            }
        }

        // Classe Principal da Aplicação
        class App {
            constructor() {
                const w = window.innerWidth || 1;
                const h = window.innerHeight || 1;
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", alpha: false, stencil: false, depth: false });
                this.renderer.setSize(w, h);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.setAnimationLoop(null);
                document.body.appendChild(this.renderer.domElement);
                this.renderer.domElement.id = "webGLApp"; 

                this.camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 10000);
                this.camera.position.z = 50;
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0e27);
                this.clock = new THREE.Clock();

                this.touchTexture = new TouchTexture();
                this.gradientBackground = new GradientBackground(this);
                this.gradientBackground.uniforms.uTouchTexture.value = this.touchTexture.texture;

                this.init();
            }

            init() {
                this.gradientBackground.init();
                this.render();
                this.tick();

                window.addEventListener("resize", () => this.onResize());
                window.addEventListener("mousemove", (ev) => this.onMouseMove(ev));
                window.addEventListener("touchmove", (ev) => this.onTouchMove(ev));
                document.addEventListener("visibilitychange", () => { if (!document.hidden) this.render(); });

                const wakeUpAnimation = () => {
                    this.render();
                    window.removeEventListener("click", wakeUpAnimation);
                    window.removeEventListener("touchstart", wakeUpAnimation);
                    window.removeEventListener("mousemove", wakeUpAnimation);
                };
                window.addEventListener("click", wakeUpAnimation, { once: true });
                window.addEventListener("touchstart", wakeUpAnimation, { once: true });
                window.addEventListener("mousemove", wakeUpAnimation, { once: true });
            }

            onTouchMove(ev) {
                const touch = ev.touches[0];
                this.onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
            }

            onMouseMove(ev) {
                this.mouse = { x: ev.clientX / window.innerWidth, y: 1 - ev.clientY / window.innerHeight };
                this.touchTexture.addTouch(this.mouse);
            }

            getViewSize() {
                const fovInRadians = (this.camera.fov * Math.PI) / 180;
                let height = Math.abs(this.camera.position.z * Math.tan(fovInRadians / 2) * 2);
                if (isNaN(height) || height === 0) height = 100; 
                let width = height * (this.camera.aspect || 1);
                if (isNaN(width) || width === 0) width = 100; 
                return { width, height };
            }

            update(delta) {
                this.touchTexture.update();
                this.gradientBackground.update(delta);
            }

            render() {
                const delta = this.clock.getDelta();
                const clampedDelta = Math.min(delta, 0.1);
                this.renderer.render(this.scene, this.camera);
                this.update(clampedDelta);
            }

            tick() {
                this.render();
                requestAnimationFrame(() => this.tick());
            }

            onResize() {
                const w = window.innerWidth || 1;
                const h = window.innerHeight || 1;
                this.camera.aspect = w / h;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(w, h);
                this.gradientBackground.onResize(w, h);
            }
        }

        const app = new App();
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", () => { app.render(); });
        } else {
            setTimeout(() => app.render(), 0);
        }

        // ==========================================
        // TILT EFFECT DO CARTÃO
        // ==========================================

        VanillaTilt.init(document.querySelector(".profile-card"), { 
            max: 12, 
            speed: 800, 
            glare: true, 
            "max-glare": 0.15, 
            scale: 1.03, 
            perspective: 1000, 
            gyroscope: true, 
            easing: "cubic-bezier(.03,.98,.52,.99)" 
        });

    </script>
</body>
