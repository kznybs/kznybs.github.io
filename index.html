<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kznybs - Gabriel Olímpio</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Audiowide&display=swap');

        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg-dark: #020617;
            --glass-bg: rgba(10, 25, 47, 0.65);
            --glass-border: rgba(0, 210, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(45deg, #020617, #0a1930, #050b14);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 10s infinite ease-in-out alternate;
        }

        .orb:nth-child(1) { width: 300px; height: 300px; background: var(--primary); top: -50px; left: -50px; }
        .orb:nth-child(2) { width: 400px; height: 400px; background: var(--secondary); bottom: -100px; right: -100px; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(50px) translateX(50px); }
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 1000px;
            padding: 3rem;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            transform: translateY(50px);
            opacity: 0;
            animation: slideUp 1s ease forwards 0.3s;
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        /* Profile Visuals */
        .profile-visual {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-video {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
            z-index: 2;
        }

        .profile-video:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.5);
        }

        /* Content */
        .content h1 {
            font-family: 'Audiowide', cursive;
            font-size: 3.5rem;
            margin-bottom: 0.2rem;
            background: linear-gradient(to right, var(--primary), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 191, 255, 0.3);
        }

        .content h2 {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }

        .content p {
            font-size: 1rem;
            color: #a8b2d1;
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        /* Skills Tags */
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 2rem;
        }

        .skill-tag {
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .skill-tag:hover {
            background: var(--primary);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        /* Social Links */
        .social-links {
            display: flex;
            gap: 1.5rem;
        }

        .social-links a {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .social-links a:hover {
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary);
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .container {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 2.5rem 1.5rem;
            }
            .profile-visual { margin-bottom: 1rem; }
            .skills { justify-content: center; }
            .social-links { justify-content: center; }
            .content h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="container">
        <!-- Vídeo de Perfil Original -->
        <div class="profile-visual">
            <video src="https://i.imgur.com/dQ9TMyH.mp4" class="profile-video" autoplay loop muted playsinline></video>
        </div>
        
        <div class="content">
            <h1>kznybs</h1>
            <h2>Gabriel Olímpio</h2>
            <p>Estudante de Ciência da Computação na UNEMAT. Apaixonado por inovação, educação e soluções que funcionam de verdade. Sempre aprendendo, sempre compartilhando.</p>
            
            <div class="skills">
                <span class="skill-tag">HTML</span>
                <span class="skill-tag">CSS</span>
                <span class="skill-tag">PHP</span>
                <span class="skill-tag">MySQL</span>
            </div>

            <!-- Links Sociais Originais -->
            <div class="social-links">
                <a href="https://github.com/kznybs" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://kznybs.github.io/codes_web/" target="_blank" aria-label="Projetos"><i class="fas fa-laptop-code"></i></a>
                <a href="https://www.instagram.com/kznybs/" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.linkedin.com/in/kznybs/" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </div>

    <script>
        // Interação 3D ativada no movimento do mouse
        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 992) {
                const container = document.querySelector('.container');
                const xAxis = (window.innerWidth / 2 - e.pageX) / 60;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 60;
                container.style.transform = `translateY(0) perspective(1000px) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });

        // Retorno suave à posição original
        document.addEventListener('mouseleave', () => {
            const container = document.querySelector('.container');
            container.style.transition = 'transform 0.5s ease';
            container.style.transform = `translateY(0) perspective(1000px) rotateY(0deg) rotateX(0deg)`;
            setTimeout(() => container.style.transition = 'none', 500);
        });
    </script>
</body>
</html>
