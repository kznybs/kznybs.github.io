<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KZ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Montserrat:wght@300;400;700;900&family=Syne:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- ESTILOS GERAIS UNIFICADOS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- DEATH NOTE THEME SETTINGS --- */
        :root {
            --kira-red: #ff0000;
            --kira-dark-red: #8b0000;
            --kira-black: #050505;
            --kira-white: #f0f0f0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--kira-white);
            background-color: var(--kira-black);
            overflow: hidden; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Fix para altura real no mobile */
            height: 100dvh; 
            perspective: 1000px;
        }

        /* --- TYPOGRAPHY CANVAS BACKGROUND --- */
        #typo-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-color: #000000;
        }

        /* --- IMMERSIVE OVERLAYS --- */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 5%, rgba(0,0,0,0.85) 75%, #000 100%);
            pointer-events: none;
            z-index: 2;
        }

        .film-grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.12; 
            z-index: 50;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0%,
                rgba(255, 255, 255, 0.02) 0.5%, 
                transparent 1%
            );
            z-index: 49;
            pointer-events: none;
            animation: scanline-shift 10s linear infinite;
        }

        @keyframes scanline-shift {
            0% { background-position: 0 0; }
            100% { background-position: 0 100vh; }
        }

        /* --- PHYSICS & LAYOUT --- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            z-index: 10;
            padding: 1rem;
            transform-style: preserve-3d;
        }

        /* --- TYPOGRAPHY (KIRA GLITCH) --- */
        .name-container { 
            margin-bottom: 2rem; 
            perspective: 800px;
            width: 100%;
            text-align: center;
        }
        @media (min-width: 768px) {
            .name-container { margin-bottom: 3rem; }
        }

        h1 { font-family: 'Audiowide', cursive; }
        
        .glitch-wrapper { 
            position: relative; 
            display: inline-block; 
            white-space: nowrap; 
        }

        .glitch-text {
            position: relative;
            /* Ajuste fino para mobile e desktop */
            font-size: clamp(3.2rem, 12vw, 8.5rem);
            font-weight: 900;
            letter-spacing: 0.02em;
            color: var(--kira-white); 
            -webkit-text-stroke: 1px rgba(255,255,255,0.2); 
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        
        /* Destaque para o 'Z' Vermelho */
        .highlight-z {
            color: var(--kira-red) !important;
            -webkit-text-stroke: 1px var(--kira-dark-red) !important;
            text-shadow: 0 0 15px var(--kira-red), 0 0 30px var(--kira-dark-red) !important;
            display: inline-block; 
        }
        @media (min-width: 768px) {
            .highlight-z {
                text-shadow: 0 0 20px var(--kira-red), 0 0 40px var(--kira-dark-red) !important;
            }
        }

        /* --- ULTRA-PREMIUM DEATH NOTE CARD (DARK/NOIR) --- */
        .profile-card {
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.85) 0%, rgba(5, 5, 5, 0.98) 100%); 
            backdrop-filter: blur(25px) saturate(120%);
            -webkit-backdrop-filter: blur(25px) saturate(120%);
            
            /* Bordas adaptáveis para mobile */
            border-radius: 24px;
            clip-path: polygon(
                15px 0, 100% 0, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                0 100%, 0 15px
            );
            
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 
                inset 0 0 15px rgba(255, 255, 255, 0.02), 
                0 20px 40px rgba(0, 0, 0, 0.9), 
                0 0 0 1px rgba(255, 255, 255, 0.02); 
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            
            /* Largura fluida perfeita para mobile */
            width: 92%;
            max-width: 380px;
            padding: 2rem 1.5rem;
        }

        @media (min-width: 768px) {
            .profile-card {
                border-radius: 40px;
                clip-path: polygon(
                    30px 0, 100% 0, 
                    100% calc(100% - 30px), calc(100% - 30px) 100%, 
                    0 100%, 0 30px
                );
                width: 100%;
                max-width: 42rem; /* 672px */
                padding: 3.5rem;
                box-shadow: 
                    inset 0 0 15px rgba(255, 255, 255, 0.03), 
                    0 20px 50px rgba(0, 0, 0, 0.95), 
                    0 0 0 1px rgba(255, 255, 255, 0.02);
            }
        }

        /* Reflexo Metálico/Vidro (Sweep) */
        .profile-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.01) 40%,
                rgba(255,255,255,0.08) 50%, 
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0) 100%
            );
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.8s ease-out;
            pointer-events: none;
            z-index: 1;
        }

        .profile-card:hover::before, .profile-card:active::before { 
            transform: rotate(30deg) translateY(100%); 
        }

        /* Iluminação Interna Cinza/Branca */
        .profile-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05) 0%, transparent 60%); 
            pointer-events: none;
            z-index: 1;
        }

        /* --- ICONS --- */
        .icon-container { 
            display: flex; 
            gap: 1.25rem; /* Gap menor no mobile */
            justify-content: center; 
            align-items: center; 
            z-index: 2; 
            position: relative;
            flex-wrap: wrap; /* Evita quebrar o layout em telas minúsculas */
        }
        @media (min-width: 380px) {
            .icon-container { gap: 1.75rem; }
        }
        @media (min-width: 768px) { 
            .icon-container { gap: 3.5rem; flex-wrap: nowrap; } 
        }

        .icon-link {
            position: relative;
            color: rgba(255, 255, 255, 0.4); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; 
            justify-content: center; 
            align-items: center;
            padding: 0.5rem; /* Aumenta área de toque no mobile */
        }
        
        .icon-link i {
            font-size: 2.25rem; /* Tamanho base mobile */
            transition: inherit;
        }
        @media (min-width: 380px) {
            .icon-link i { font-size: 2.5rem; }
        }
        @media (min-width: 768px) {
            .icon-link i { font-size: 3.75rem; }
            .icon-link { padding: 0; }
        }
        
        .icon-link:hover, .icon-link:active { 
            color: var(--kira-white); 
            transform: translateY(-8px) scale(1.15); 
            text-shadow: 0 0 20px rgba(255,255,255,0.8); 
        }
        
        .icon-link::after {
            content: ''; position: absolute; bottom: -5px; width: 4px; height: 4px; border-radius: 50%;
            background: var(--kira-white); opacity: 0; transform: scale(0); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px 2px rgba(255,255,255,0.5);
        }
        @media (min-width: 768px) {
            .icon-link::after { bottom: -15px; }
        }
        .icon-link:hover::after, .icon-link:active::after { 
            opacity: 1; transform: scale(1); 
        }

        /* --- HUD ELEMENTS --- */
        .hud-text {
            position: absolute; 
            font-family: 'Courier New', Courier, monospace; 
            font-weight: 700;
            letter-spacing: 0.2em; 
            font-size: 0.55rem; 
            color: rgba(255, 255, 255, 0.3); 
            pointer-events: none;
            z-index: 2;
        }
        @media (min-width: 768px) {
            .hud-text {
                letter-spacing: 0.4em; 
                font-size: 0.65rem;
            }
        }

        /* Ajustes de posicionamento mobile para não encostar nas bordas */
        .hud-bottom-right { bottom: 1rem; right: 1.25rem; }
        .hud-top-left { top: 1rem; left: 1.25rem; opacity: 0.5; }
        
        @media (min-width: 768px) {
            .hud-bottom-right { bottom: 1.5rem; right: 2rem; }
            .hud-top-left { top: 1.5rem; left: 2rem; }
        }

    </style>
</head>
<body class="antialiased">
    
    <!-- Sopa de Letras (Typographic Canvas Background) -->
    <canvas id="typo-canvas"></canvas>

    <!-- Overlays Cinemáticos -->
    <div class="vignette"></div>
    <div class="film-grain"></div>
    <div class="scanlines"></div>

    <!-- Interface Principal (Cartão) -->
    <div class="main-content" id="main-content">
        <div class="name-container">
            <div class="glitch-wrapper">
                <!-- Z destacado em vermelho -->
                <h1 class="glitch-text" data-text="KZNYBS">K<span class="highlight-z">Z</span>NYBS</h1>
            </div>
        </div>

        <div class="profile-card" 
             data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-glare="true" data-tilt-max-glare="0.1" data-tilt-gyroscope="true">
            
            <div class="hud-text hud-top-left transform-gpu" style="transform: translateZ(10px);">
                
            </div>

            <div class="icon-container transform-gpu" style="transform: translateZ(30px);">
                <a href="https://github.com/kznybs" target="_blank" class="icon-link" aria-label="GitHub">
                    <i class="fab fa-github"></i>
                </a>

                <a href="https://steamcommunity.com/id/kznybs/" target="_blank" class="icon-link" aria-label="Steam">
                    <i class="fab fa-steam"></i>
                </a>

                <a href="https://www.instagram.com/kznybs/" target="_blank" class="icon-link" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                
                <a href="https://www.linkedin.com/in/kznybs/" target="_blank" class="icon-link" aria-label="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
            </div>

            <div class="hud-text hud-bottom-right transform-gpu" style="transform: translateZ(20px);">
              
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    
    <script>
        // ==========================================
        // MOTOR DE FUNDO: Sopa de Letras Tech
        // ==========================================
        const canvas = document.getElementById('typo-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let wordsArray = [];
        let mouseX = 0, mouseY = 0;
        let targetMouseX = 0, targetMouseY = 0;

        // Dicionário Tech/Computação
        const phrases = [
            "SYSTEM", "DATA", "ALGORITHM", "NEURAL NETWORK", "PROTOCOL", "BINARY", "CODE",
            "OVERRIDE", "ROOT", "MATRIX", "CIPHER", "SYNTAX", "TERMINAL", "KERNEL", "EXECUTE",
            "NULL", "UNDEFINED", "CYBER", "ENCRYPT", "DECRYPT", "MAINFRAME", "NODE",
            "QUANTUM", "CACHE", "BUFFER", "BYTE", "01010100", "11001011", "SYS.ADMIN", "HACK",
            "FIREWALL", "PROXY", "LATENCY", "BANDWIDTH", "SERVER", "CLIENT", "A.I."
        ];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            mouseX = targetMouseX = width / 2;
            mouseY = targetMouseY = height / 2;
            createWords();
        }

        // Criar a densa sopa de letras menores
        function createWords() {
            wordsArray = [];
            // Otimização de performance para mobile: Menos elementos em telas pequenas
            const isMobile = window.innerWidth < 768;
            const count = isMobile ? 120 : 350; 
            
            for (let i = 0; i < count; i++) {
                // Tamanhos responsivos
                const baseSize = isMobile ? 6 : 8;
                const sizeMult = isMobile ? 15 : 25;
                const size = Math.random() * sizeMult + baseSize;
                
                // Cores em tons de cinza/branco com baixa opacidade
                const alpha = Math.random() * (isMobile ? 0.25 : 0.3) + 0.05;
                const color = `rgba(255, 255, 255, ${alpha})`;
                
                wordsArray.push({
                    text: phrases[Math.floor(Math.random() * phrases.length)],
                    x: (Math.random() * 2 - 0.5) * width, // Espalhar amplamente
                    y: (Math.random() * 1.5 - 0.25) * height,
                    z: Math.random() * 2 + 0.5, // Parallax depth
                    size: size,
                    color: color,
                    vertical: Math.random() > 0.85, 
                    weight: Math.random() > 0.5 ? 900 : 700 
                });
            }
        }

        // Otimização: Debounce no resize
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(initCanvas, 200);
        });
        
        // Interação de Mouse & Touch para o Parallax
        window.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });

        // Suporte suave ao giroscópio (mobile) para o Parallax do Canvas
        window.addEventListener('deviceorientation', (e) => {
            if(!e.gamma || !e.beta) return;
            // Gamma (esquerda/direita) -90 a 90
            // Beta (frente/trás) -180 a 180
            const x = (e.gamma / 45) * (width / 2) + (width / 2);
            const y = (e.beta / 45) * (height / 2) + (height / 2);
            
            targetMouseX = Math.max(0, Math.min(width, x));
            targetMouseY = Math.max(0, Math.min(height, y));
        }, true);

        function loop() {
            // Suavizar movimento do mouse/giroscópio
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;

            // Fundo Preto Profundo (sem degradê avermelhado)
            const bgGrad = ctx.createRadialGradient(mouseX, mouseY, 0, width/2, height/2, width);
            bgGrad.addColorStop(0, "#0c0c0c"); 
            bgGrad.addColorStop(1, "#000000");
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // 1. Desenhar Sopa de Letras (Parallax Baseado no Mouse/Touch)
            const offsetX = (mouseX - width / 2) * 0.06;
            const offsetY = (mouseY - height / 2) * 0.06;

            wordsArray.forEach(w => {
                // Movimento contínuo para a esquerda
                w.x -= 0.4 * w.z; 

                // Lógica de Wrap-around (quando sair da tela)
                if (w.x < -width * 0.3) {
                    w.x = width * 1.3;
                    w.y = (Math.random() * 1.5 - 0.25) * height; 
                }

                ctx.save();
                ctx.fillStyle = w.color;
                ctx.font = `${w.weight} ${w.size}px 'Arial Black', Impact, sans-serif`;
                ctx.textBaseline = 'middle';
                ctx.textAlign = 'center';

                // Aplica o Parallax com o Mouse + a Posição X em movimento
                const px = w.x - (offsetX * w.z);
                const py = w.y - (offsetY * w.z);

                ctx.translate(px, py);
                if (w.vertical) ctx.rotate(-Math.PI / 2);

                ctx.fillText(w.text, 0, 0);
                ctx.restore();
            });

            requestAnimationFrame(loop);
        }

        // Iniciar
        initCanvas();
        loop();

        // ==========================================
        // TILT EFFECT DO CARTÃO (Otimizado p/ Mobile)
        // ==========================================
        VanillaTilt.init(document.querySelector(".profile-card"), { 
            max: window.innerWidth < 768 ? 8 : 12, // Menos tilt em mobile para não bugar
            speed: 600, 
            glare: true, 
            "max-glare": 0.1,
            scale: window.innerWidth < 768 ? 1.02 : 1.03, 
            perspective: 1000, 
            gyroscope: true, 
            gyroscopeMinAngleX: -45, 
            gyroscopeMaxAngleX:  45, 
            gyroscopeMinAngleY: -45, 
            gyroscopeMaxAngleY:  45, 
            easing: "cubic-bezier(.03,.98,.52,.99)" 
        });

    </script>
</body>
</html>
