<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KZNYBS - Profile</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Importmap para o Three.js do Fundo Fractal -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Montserrat:wght@300;400;700;900&family=Syne:wght@500;600;700&family=Inter:wght@500&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* --- ESTILOS GERAIS UNIFICADOS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --void-black: #0b1016; /* Ajustado para o tema do fractal */
            --glass-base: rgba(10, 30, 60, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-glow: rgba(0, 150, 255, 0.05);
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            background-color: var(--void-black);
            overflow: hidden; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; 
            perspective: 1000px;
            cursor: crosshair;
        }

        /* Oculta cursores em elementos interativos caso queira manter o aspecto limpo */
        a, button, input {
            cursor: pointer !important;
        }

        /* --- FRACTAL WEBGL BACKGROUND --- */
        .webgl { 
            display: block; 
            position: fixed; 
            inset: 0; 
            z-index: -1; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; /* Deixa os eventos de mouse passarem para o Tilt */
        }

        /* --- IMMERSIVE OVERLAYS --- */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(0,2,8,0.8) 90%, #000 100%);
            pointer-events: none;
            z-index: 2;
        }

        .film-grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            z-index: 50;
            pointer-events: none;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0%,
                rgba(255, 255, 255, 0.02) 0.5%,
                transparent 1%
            );
            z-index: 49;
            pointer-events: none;
            animation: scanline-shift 10s linear infinite;
        }

        @keyframes scanline-shift {
            0% { background-position: 0 0; }
            100% { background-position: 0 100vh; }
        }

        /* --- PHYSICS & MAIN LAYOUT --- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 10;
            padding: 1rem;
            transform-style: preserve-3d;
        }

        /* --- TYPOGRAPHY (NEXT-GEN GLITCH) --- */
        .name-container { 
            margin-bottom: 3rem; 
            perspective: 800px;
        }

        h1 { font-family: 'Audiowide', cursive; }
        
        .glitch-wrapper { 
            position: relative; 
            display: inline-block; 
            white-space: nowrap; 
        }

        .glitch-text {
            position: relative;
            font-size: clamp(4rem, 15vw, 8.5rem);
            font-weight: 900;
            letter-spacing: 0.05em;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.4);
            background: linear-gradient(180deg, #fff 0%, #777 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }

        /* --- ULTRA-PREMIUM GLASS CARD --- */
        .profile-card {
            background: linear-gradient(135deg, rgba(20, 50, 100, 0.4) 0%, rgba(5, 10, 20, 0.7) 100%);
            backdrop-filter: blur(25px) saturate(150%); /* Ajustado levemente para não ofuscar os círculos */
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border-radius: 40px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.2), 
                inset 0 -1px 2px rgba(0, 0, 0, 0.8), 
                0 40px 80px rgba(0, 0, 0, 0.95), 
                0 0 0 1px rgba(255, 255, 255, 0.02); 
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .profile-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.03) 40%,
                rgba(255,255,255,0.15) 50%,
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0) 100%
            );
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.6s ease-out;
            pointer-events: none;
            z-index: 1;
        }

        .profile-card:hover::before { transform: rotate(30deg) translateY(100%); }

        .profile-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- ICONS (NEO-MORPHIC) --- */
        .icon-container { 
            display: flex; gap: 2rem; justify-content: center; align-items: center; z-index: 2; position: relative;
        }
        @media (min-width: 768px) { .icon-container { gap: 3.5rem; } }

        .icon-link {
            position: relative;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
            text-decoration: none;
        }
        
        .icon-link:hover { 
            color: #fff; transform: translateY(-10px) scale(1.2); text-shadow: 0 0 25px rgba(255, 255, 255, 0.9); 
        }
        
        .icon-link::after {
            content: ''; position: absolute; bottom: -15px; width: 4px; height: 4px; border-radius: 50%;
            background: #fff; opacity: 0; transform: scale(0); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
        }
        .icon-link:hover::after { opacity: 1; transform: scale(1); }

        /* --- HUD ELEMENTS --- */
        .hud-text {
            position: absolute; font-family: 'Courier New', Courier, monospace; font-weight: 700;
            letter-spacing: 0.4em; font-size: 0.65rem; color: rgba(255, 255, 255, 0.2); pointer-events: none;
            z-index: 2;
        }

        .hud-bottom-right { bottom: 1.5rem; right: 2rem; }
        .hud-top-left { top: 1.5rem; left: 2rem; opacity: 0.5; }

        .footer {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 10; color: white; font-family: "Syne", sans-serif; font-size: clamp(0.875rem, 1.5vw, 1.125rem); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; text-align: center; pointer-events: auto;
        }
        .footer a { color: white; text-decoration: none; transition: opacity 0.3s ease; }
        .footer a:hover { opacity: 0.7; }
    </style>
</head>
<body class="antialiased">
    
    <!-- Fundo WebGL Fractal -->
    <canvas class="webgl"></canvas>

    <!-- Overlays Cinemáticos -->
    <div class="vignette"></div>
    <div class="film-grain"></div>
    <div class="scanlines"></div>

    <!-- Interface Principal (Cartão) -->
    <div class="main-content" id="main-content">
        <div class="name-container">
            <div class="glitch-wrapper">
                <h1 class="glitch-text" data-text="KZNYBS">KZNYBS</h1>
            </div>
        </div>

        <div class="w-full max-w-sm md:max-w-2xl p-8 md:p-14 profile-card" 
             data-tilt data-tilt-max="8" data-tilt-speed="600" data-tilt-glare="true" data-tilt-max-glare="0.15">
            
            <div class="hud-text hud-top-left transform-gpu" style="transform: translateZ(10px);">
               
            </div>

            <div class="icon-container transform-gpu" style="transform: translateZ(40px);">
                <a href="https://github.com/kznybs" target="_blank" class="icon-link" aria-label="GitHub">
                    <i class="fab fa-github text-4xl md:text-6xl"></i>
                </a>

                <a href="https://steamcommunity.com/id/kznybs/" target="_blank" class="icon-link" aria-label="Steam">
                    <i class="fab fa-steam text-4xl md:text-6xl"></i>
                </a>

                <a href="https://www.instagram.com/kznybs/" target="_blank" class="icon-link" aria-label="Instagram">
                    <i class="fab fa-instagram text-4xl md:text-6xl"></i>
                </a>
                
                <a href="https://www.linkedin.com/in/kznybs/" target="_blank" class="icon-link" aria-label="LinkedIn">
                    <i class="fab fa-linkedin text-4xl md:text-6xl"></i>
                </a>
            </div>

            </div>
        </div>
    </div>

    <!-- Elemento Oculto para Link do Rodapé do Script -->
    <div class="footer"><a href="#" style="opacity: 0; pointer-events: none;">.</a></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    
    <script>
        /* ==========================================
           TILT EFFECT DO CARTÃO
           ========================================== */
        VanillaTilt.init(document.querySelector(".profile-card"), { 
            max: 12, 
            speed: 800, 
            glare: true, 
            "max-glare": 0.15, 
            scale: 1.03, 
            perspective: 1000, 
            gyroscope: true, 
            easing: "cubic-bezier(.03,.98,.52,.99)" 
        });
    </script>

    <!-- Script do Fundo Fractal (Module) -->
    <script type="module">
        import * as THREE from "three";

        const canvas = document.querySelector("canvas.webgl");

        const sizes = {
            width: window.innerWidth,
            height: window.innerHeight,
            dpr: Math.min(window.devicePixelRatio, 1.25),
        };

        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setPixelRatio(sizes.dpr);
        renderer.setSize(sizes.width, sizes.height);

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const uniforms = {
            uTime: { value: 0 },
            uResolution: {
                value: new THREE.Vector2(sizes.width * sizes.dpr, sizes.height * sizes.dpr),
            },
            uMouse: { value: new THREE.Vector2(0, 0) },
        };

        const vertexShader = `
            void main() {
              gl_Position = vec4(position.xy, 0.0, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform vec2 uResolution;
            uniform vec2 uMouse;

            #define MAX_STEPS 64
            #define MAX_DIST 28.0
            #define SECTORS 6.0
            #define Z_PERIOD 4.0

            mat2 rot(float a) {
              float c = cos(a), s = sin(a);
              return mat2(c, -s, s, c);
            }

            float hash3(vec3 p) {
              p = fract(p * 0.3183099 + 0.1);
              p *= 17.0;
              return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
            }

            float vnoise(vec3 x) {
              vec3 i = floor(x);
              vec3 f = fract(x);
              f = f * f * (3.0 - 2.0 * f);
              return mix(
                mix(mix(hash3(i + vec3(0.0, 0.0, 0.0)), hash3(i + vec3(1.0, 0.0, 0.0)), f.x),
                    mix(hash3(i + vec3(0.0, 1.0, 0.0)), hash3(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
                mix(mix(hash3(i + vec3(0.0, 0.0, 1.0)), hash3(i + vec3(1.0, 0.0, 1.0)), f.x),
                    mix(hash3(i + vec3(0.0, 1.0, 1.0)), hash3(i + vec3(1.0, 1.0, 1.0)), f.x), f.y),
                f.z
              );
            }

            float smin(float a, float b, float k) {
              float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
              return mix(b, a, h) - k * h * (1.0 - h);
            }

            float smax(float a, float b, float k) {
              return -smin(-a, -b, k);
            }

            float map(vec3 p, out float orbit, float rt) {
              float axialR = length(p.xy);
              float zEvo = p.z * 0.11;

              float ang = 6.2831853 / SECTORS;
              float a = atan(p.y, p.x + 1e-4);
              a = abs(mod(a, ang) - ang * 0.5);
              p.xy = vec2(cos(a), sin(a)) * length(p.xy);

              p.z = mod(p.z, Z_PERIOD) - Z_PERIOD * 0.5;
              p.x -= 2.0;

              float lod = clamp((20.0 - rt) / 14.0, 0.0, 1.0);

              if (lod > 0.01) {
                vec3 wp = p * 1.6 + vec3(0.0, 0.0, uTime * 0.15);
                float w1 = vnoise(wp) - 0.5;
                float w2 = vnoise(wp + 11.3) - 0.5;
                p.xy += vec2(w1, w2) * (0.085 * lod);
                float w3 = vnoise(p * 0.6 + vec3(0.0, 0.0, uTime * 0.08)) - 0.5;
                p.xy += w3 * (0.06 * lod);
              }

              float kz = 3.0 * 6.2831853 / Z_PERIOD;
              p.x += sin(p.z * kz - uTime * 1.0) * 0.04;

              vec3 texP = p;
              float scale = 1.0;
              orbit = 1e9;
              float dCoarse = 1e9;
              float dMid = 1e9;
              float dFine = 1e9;
              float dVein = 1e9;
              float dUltra = 1e9;
              mat2 rYZ = rot(0.42 + 0.22 * sin(zEvo));
              mat2 rXZ = rot(-0.23 + 0.22 * cos(zEvo * 1.1));
              vec3 ifsOff = vec3(2.1 + 0.22 * sin(zEvo * 0.7), 1.35, 0.95 + 0.18 * cos(zEvo));
              for (int i = 0; i < 9; i++) {
                p = abs(p);
                if (p.x < p.y) p.xy = p.yx;
                if (p.x < p.z) p.xz = p.zx;
                p.yz *= rYZ;
                p.xz *= rXZ;
                p = p * 2.0 - ifsOff;
                scale *= 2.0;
                orbit = min(orbit, length(p));
                if (i == 2) dCoarse = (length(p.xy) - (0.34 + 0.10 * sin(zEvo * 0.8))) / scale;
                if (i == 4) dMid = (length(p.xy) - (0.22 + 0.07 * sin(zEvo * 1.3 + 1.0))) / scale;
                if (i == 6) dFine = (length(p.xy) - (0.12 + 0.04 * sin(zEvo * 2.1))) / scale;
                if (i == 7) dVein = (length(p.xy) - (0.10 + 0.03 * sin(zEvo * 2.4))) / scale;
                if (i == 8) dUltra = (length(p.xy) - (0.09 + 0.03 * sin(zEvo * 2.7))) / scale;
              }
              float d = smin(dCoarse, dMid, 0.20);
              d = smin(d, dFine, 0.11);
              d = smin(d, dVein, 0.08);
              d = smin(d, dUltra, 0.06);

              if (lod > 0.01) d -= (vnoise(texP * 7.0 + vec3(0.0, 0.0, uTime * 0.1)) - 0.5) * (0.008 * lod);

              d = smax(d, 0.5 - axialR, 0.3);
              return d;
            }

            void main() {
              vec2 uv = (gl_FragCoord.xy * 2.0 - uResolution) / uResolution.y;

              float glide = uTime * 0.42 + 0.15 * sin(uTime * 0.20);
              vec3 ro = vec3(0.0, 0.0, glide);
              vec3 rd = normalize(vec3(uv + uMouse * 0.35, 1.5));
              rd.xy *= rot(uTime * 0.012);

              float t = 0.0;
              float steps = 0.0;
              float orbit = 0.0;
              float o;
              for (int i = 0; i < MAX_STEPS; i++) {
                vec3 pos = ro + rd * t;
                float d = map(pos, o, t);
                orbit = o;
                if (d < 0.0012 * (1.0 + t) || t > MAX_DIST) { break; }
                t += d * 0.78;
                steps += 1.0;
              }

              float ao = 1.0 - steps / float(MAX_STEPS);

              vec3 frost = vec3(0.88, 0.93, 0.965);
              vec3 ink   = vec3(0.20, 0.26, 0.34);

              float breath = 0.85 + 0.15 * sin(uTime * 0.63);

              vec3 col = mix(ink, frost, pow(ao, 2.2));
              col += vec3(0.35, 0.55, 0.75) * exp(-orbit * 1.5) * 0.25 * breath;
              col += frost * 0.18 * exp(-orbit * 7.0);

              float fog = 1.0 - exp(-t * 0.075);
              col = mix(col, frost, fog * 0.5);

              vec2 axisUV = uv + uMouse * 0.35;
              float shaft = exp(-abs(axisUV.x) * 9.0) * exp(-abs(axisUV.y) * 0.9);
              float axis = length(axisUV);
              col += frost * 0.16 * exp(-axis * 4.0) * breath;
              col += frost * 0.85 * shaft * (0.3 + 0.7 * fog) * breath;

              col = max(col, ink * 0.55);

              float core = exp(-axis * 9.0);
              col = mix(col, frost, core);

              col = clamp(col, vec3(0.0), vec3(0.92, 0.955, 0.985));
              gl_FragColor = vec4(col, 1.0);
            }
        `;

        const material = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader });
        scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

        const mouseTarget = new THREE.Vector2(0, 0);
        window.addEventListener("pointermove", (e) => {
            mouseTarget.x = (e.clientX / sizes.width) * 2 - 1;
            mouseTarget.y = -((e.clientY / sizes.height) * 2 - 1);
        });

        window.addEventListener("resize", () => {
            sizes.width = window.innerWidth;
            sizes.height = window.innerHeight;
            sizes.dpr = Math.min(window.devicePixelRatio, 1.25);
            renderer.setPixelRatio(sizes.dpr);
            renderer.setSize(sizes.width, sizes.height);
            uniforms.uResolution.value.set(sizes.width * sizes.dpr, sizes.height * sizes.dpr);
        });

        const clock = new THREE.Clock();
        function tick() {
            uniforms.uTime.value = reducedMotion ? 12.0 : clock.getElapsedTime();
            uniforms.uMouse.value.lerp(mouseTarget, 0.05);
            renderer.render(scene, camera);
            requestAnimationFrame(tick);
        }
        
        // Inicia a animação assim que a janela carrega
        window.onload = () => {
            tick();
        };

    </script>
</body>
</html>
