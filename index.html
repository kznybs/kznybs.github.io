<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KZNYBS - Profile</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Montserrat:wght@300;400;700;900&family=Syne:wght@500;600;700&family=Inter:wght@500&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* --- ESTILOS GERAIS UNIFICADOS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Definição de propriedades para a animação do fundo */
        @property --amplitude {
            syntax: "<length>";
            initial-value: 0;
            inherits: false;
        }

        @property --scale {
            syntax: "<number>";
            initial-value: 1;
            inherits: false;
        }

        :root {
            --void-black: #0d0f1e; /* Adaptado para combinar com o novo fundo */
            --glass-base: rgba(10, 30, 60, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-glow: rgba(0, 150, 255, 0.05);
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            background-color: var(--void-black);
            overflow: hidden; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; 
            perspective: 1000px;
            cursor: crosshair; /* Mudado sutilmente para facilitar a interação com os círculos */
        }

        /* Oculta cursores em elementos interativos caso queira manter o aspecto limpo */
        a, button, input {
            cursor: pointer !important; /* Retornado para pointer para usabilidade */
        }

        /* --- NEW CIRCLE PATTERN BACKGROUND --- */
        .background-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            height: 100px;
            width: 100px;
            border-radius: 9999999px;
            background: radial-gradient(
                circle at 50% 0%,
                oklch(0.1186 0.0248 260.66),
                oklch(0.3133 0.1419 260.73),
                oklch(0.6061 0.2122 260.66)
            );
            --angle: 90deg;
            --amplitude: 175px;
            --scale: 1.5;
            --offset: 30deg;
            transform: translate(
                calc(cos(var(--angle)) * var(--amplitude)),
                calc(sin(var(--angle)) * var(--amplitude) * -1)
            )
            scale(var(--scale)) rotate(calc(-1 * var(--angle) + 17deg));
            mix-blend-mode: lighten;
            animation: expand 4.01s cubic-bezier(0.8, 0, 0.2, 1) infinite alternate;
        }

        .circle:nth-child(1) { --angle: calc(0deg + var(--offset)); }
        .circle:nth-child(2) { --angle: calc(60deg + var(--offset)); }
        .circle:nth-child(3) { --angle: calc(120deg + var(--offset)); }
        .circle:nth-child(4) { --angle: calc(180deg + var(--offset)); }
        .circle:nth-child(5) { --angle: calc(240deg + var(--offset)); }
        .circle:nth-child(6) { --angle: calc(300deg + var(--offset)); }

        @keyframes expand {
            0% { --amplitude: 150px; --scale: 1; }
            50% { --amplitude: 100px; --scale: 3; }
            100% { --amplitude: 150px; --scale: 3; }
        }

        /* --- IMMERSIVE OVERLAYS --- */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(0,2,8,0.8) 90%, #000 100%);
            pointer-events: none;
            z-index: 2;
        }

        .film-grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            z-index: 50;
            pointer-events: none;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0%,
                rgba(255, 255, 255, 0.02) 0.5%,
                transparent 1%
            );
            z-index: 49;
            pointer-events: none;
            animation: scanline-shift 10s linear infinite;
        }

        @keyframes scanline-shift {
            0% { background-position: 0 0; }
            100% { background-position: 0 100vh; }
        }

        /* --- PHYSICS & MAIN LAYOUT --- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 10;
            padding: 1rem;
            transform-style: preserve-3d;
        }

        /* --- TYPOGRAPHY (NEXT-GEN GLITCH) --- */
        .name-container { 
            margin-bottom: 3rem; 
            perspective: 800px;
        }

        h1 { font-family: 'Audiowide', cursive; }
        
        .glitch-wrapper { 
            position: relative; 
            display: inline-block; 
            white-space: nowrap; 
        }

        .glitch-text {
            position: relative;
            font-size: clamp(4rem, 15vw, 8.5rem);
            font-weight: 900;
            letter-spacing: 0.05em;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.4);
            background: linear-gradient(180deg, #fff 0%, #777 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }

        /* --- ULTRA-PREMIUM GLASS CARD --- */
        .profile-card {
            background: linear-gradient(135deg, rgba(20, 50, 100, 0.4) 0%, rgba(5, 10, 20, 0.7) 100%);
            backdrop-filter: blur(25px) saturate(150%); /* Ajustado levemente para não ofuscar os círculos */
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border-radius: 40px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.2), 
                inset 0 -1px 2px rgba(0, 0, 0, 0.8), 
                0 40px 80px rgba(0, 0, 0, 0.95), 
                0 0 0 1px rgba(255, 255, 255, 0.02); 
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .profile-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.03) 40%,
                rgba(255,255,255,0.15) 50%,
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0) 100%
            );
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.6s ease-out;
            pointer-events: none;
            z-index: 1;
        }

        .profile-card:hover::before { transform: rotate(30deg) translateY(100%); }

        .profile-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- ICONS (NEO-MORPHIC) --- */
        .icon-container { 
            display: flex; gap: 2rem; justify-content: center; align-items: center; z-index: 2; position: relative;
        }
        @media (min-width: 768px) { .icon-container { gap: 3.5rem; } }

        .icon-link {
            position: relative;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
            text-decoration: none;
        }
        
        .icon-link:hover { 
            color: #fff; transform: translateY(-10px) scale(1.2); text-shadow: 0 0 25px rgba(255, 255, 255, 0.9); 
        }
        
        .icon-link::after {
            content: ''; position: absolute; bottom: -15px; width: 4px; height: 4px; border-radius: 50%;
            background: #fff; opacity: 0; transform: scale(0); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
        }
        .icon-link:hover::after { opacity: 1; transform: scale(1); }

        /* --- HUD ELEMENTS --- */
        .hud-text {
            position: absolute; font-family: 'Courier New', Courier, monospace; font-weight: 700;
            letter-spacing: 0.4em; font-size: 0.65rem; color: rgba(255, 255, 255, 0.2); pointer-events: none;
            z-index: 2;
        }

        .hud-bottom-right { bottom: 1.5rem; right: 2rem; }
        .hud-top-left { top: 1.5rem; left: 2rem; opacity: 0.5; }

        .footer {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 10; color: white; font-family: "Syne", sans-serif; font-size: clamp(0.875rem, 1.5vw, 1.125rem); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; text-align: center; pointer-events: auto;
        }
        .footer a { color: white; text-decoration: none; transition: opacity 0.3s ease; }
        .footer a:hover { opacity: 0.7; }
    </style>
</head>
<body class="antialiased">
    
    <!-- Novo Fundo de Círculos Animados -->
    <div class="background-wrapper">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Overlays Cinemáticos -->
    <div class="vignette"></div>
    <div class="film-grain"></div>
    <div class="scanlines"></div>

    <!-- Interface Principal (Cartão) -->
    <div class="main-content" id="main-content">
        <div class="name-container">
            <div class="glitch-wrapper">
                <h1 class="glitch-text" data-text="KZNYBS">K<span style="color: #0096ff; -webkit-text-fill-color: #0096ff;">Z</span>NYBS</h1>
            </div>
        </div>

        <div class="w-full max-w-sm md:max-w-2xl p-8 md:p-14 profile-card" 
             data-tilt data-tilt-max="8" data-tilt-speed="600" data-tilt-glare="true" data-tilt-max-glare="0.15">
            
            <div class="hud-text hud-top-left transform-gpu" style="transform: translateZ(10px);">
                SYSTEM.ONLINE
            </div>

            <div class="icon-container transform-gpu" style="transform: translateZ(40px);">
                <a href="https://github.com/kznybs" target="_blank" class="icon-link" aria-label="GitHub">
                    <i class="fab fa-github text-4xl md:text-6xl"></i>
                </a>

                <a href="https://steamcommunity.com/id/kznybs/" target="_blank" class="icon-link" aria-label="Steam">
                    <i class="fab fa-steam text-4xl md:text-6xl"></i>
                </a>

                <a href="https://www.instagram.com/kznybs/" target="_blank" class="icon-link" aria-label="Instagram">
                    <i class="fab fa-instagram text-4xl md:text-6xl"></i>
                </a>
                
                <a href="https://www.linkedin.com/in/kznybs/" target="_blank" class="icon-link" aria-label="LinkedIn">
                    <i class="fab fa-linkedin text-4xl md:text-6xl"></i>
                </a>
            </div>

            <div class="hud-text hud-bottom-right transform-gpu" style="transform: translateZ(20px);">
                V. 2.0.4
            </div>
        </div>
    </div>

    <!-- Elemento Oculto para Link do Rodapé do Script -->
    <div class="footer"><a href="#" style="opacity: 0; pointer-events: none;">.</a></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    
    <script>
        /* ==========================================
           LÓGICA DO NOVO FUNDO DE CÍRCULOS
           ========================================== */
        const circleElements = document.querySelectorAll(".circle");

        // Animação reagindo ao movimento do mouse
        document.body.addEventListener("mousemove", (e) => {
            const percentX = e.clientX / window.innerWidth;
            const percentY = e.clientY / window.innerHeight;
            const amplitude = 0 + 500 * percentX + "px";
            const scale = 0 + 10 * percentY;
            
            Array.from(circleElements).forEach((element) => {
                element.setAttribute(
                    "style",
                    `animation: none; --amplitude: ${amplitude}; --scale: ${scale};`
                );
            });
        });

        // Animação reagindo ao toque em telas móveis
        document.body.addEventListener("touchmove", (e) => {
            const percentX = e.touches[0].clientX / window.innerWidth;
            const percentY = e.touches[0].clientY / window.innerHeight;
            const amplitude = 0 + 500 * percentX + "px";
            const scale = 0 + 10 * percentY;
            
            Array.from(circleElements).forEach((element) => {
                element.setAttribute(
                    "style",
                    `animation: none; --amplitude: ${amplitude}; --scale: ${scale};`
                );
            });
        });

        // Retorna à animação CSS nativa se o mouse sair da tela
        document.body.addEventListener("mouseleave", (e) => {
            Array.from(circleElements).forEach((element) => {
                element.removeAttribute("style");
            });
        });

        /* ==========================================
           TILT EFFECT DO CARTÃO
           ========================================== */
        VanillaTilt.init(document.querySelector(".profile-card"), { 
            max: 12, 
            speed: 800, 
            glare: true, 
            "max-glare": 0.15, 
            scale: 1.03, 
            perspective: 1000, 
            gyroscope: true, 
            easing: "cubic-bezier(.03,.98,.52,.99)" 
        });

    </script>
</body>
</html>
