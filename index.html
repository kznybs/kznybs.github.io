<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KZNYBS | CINEMATIC NOIR</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- HIGH-END CINEMATIC SETTINGS --- */
        :root {
            --void-black: #000414; /* Azul oceano profundo */
            --glass-base: rgba(10, 30, 60, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-glow: rgba(0, 150, 255, 0.05);
            --thunder-glow: rgba(100, 200, 255, 0.8); /* Brilho cyan elétrico */
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            background-color: var(--void-black);
            overflow: hidden; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; 
            cursor: crosshair;
            perspective: 1000px;
        }

        /* --- CANVAS ENGINE --- */
        #storm-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            filter: contrast(1.1);
        }

        /* --- IMMERSIVE OVERLAYS --- */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(0,0,0,0.8) 90%, #000 100%);
            pointer-events: none;
            z-index: 2;
        }

        .film-grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            z-index: 50;
            pointer-events: none;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0%,
                rgba(255, 255, 255, 0.02) 0.5%,
                transparent 1%
            );
            z-index: 49;
            pointer-events: none;
            animation: scanline-shift 10s linear infinite;
        }

        @keyframes scanline-shift {
            0% { background-position: 0 0; }
            100% { background-position: 0 100vh; }
        }

        /* --- PHYSICS & SHAKE FX --- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 10;
            padding: 1rem;
            transition: transform 0.05s ease-out; 
            transform-style: preserve-3d;
        }

        .thunder-active .main-content {
            animation: cinematic-shake 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes cinematic-shake {
            0% { transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
            10% { transform: translate3d(-8px, 4px, 0) scale(1.02); filter: blur(1px); }
            20% { transform: translate3d(6px, -4px, 0) scale(0.98); filter: blur(0); }
            30% { transform: translate3d(-4px, 2px, 0) scale(1.01); }
            40% { transform: translate3d(2px, -2px, 0) scale(0.99); }
            100% { transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
        }

        /* --- TYPOGRAPHY (NEXT-GEN GLITCH) --- */
        .name-container { 
            margin-bottom: 3rem; 
            perspective: 800px;
        }

        h1 { 
            font-family: 'Audiowide', cursive; 
        }
        
        .glitch-wrapper { 
            position: relative; 
            display: inline-block; 
            white-space: nowrap; 
        }

        .glitch-text {
            position: relative;
            font-size: clamp(4rem, 15vw, 8.5rem);
            font-weight: 900;
            letter-spacing: 0.05em;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.4);
            background: linear-gradient(180deg, #fff 0%, #777 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
            transition: all 0.2s ease;
        }

        .thunder-active .glitch-text {
            color: #fff;
            -webkit-text-stroke: 0;
            text-shadow: 
                -4px 0 rgba(0, 255, 255, 0.8),
                4px 0 rgba(0, 100, 255, 0.8),
                0 0 30px var(--thunder-glow);
        }

        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .thunder-active .glitch-text::before {
            opacity: 1;
            left: 3px;
            text-shadow: -2px 0 rgba(0, 255, 255, 0.9);
            clip: rect(44px, 9999px, 56px, 0);
            animation: hardcore-glitch 0.3s steps(2) infinite alternate-reverse;
        }

        .thunder-active .glitch-text::after {
            opacity: 1;
            left: -3px;
            text-shadow: 2px 0 rgba(0, 100, 255, 0.9);
            clip: rect(44px, 9999px, 56px, 0);
            animation: hardcore-glitch 0.2s steps(3) infinite alternate;
        }

        @keyframes hardcore-glitch {
            0% { clip-path: inset(10% 0 80% 0); transform: translateX(-2px); }
            20% { clip-path: inset(80% 0 5% 0); transform: translateX(2px); }
            40% { clip-path: inset(30% 0 40% 0); transform: translateX(-1px); }
            60% { clip-path: inset(60% 0 10% 0); transform: translateX(3px); }
            80% { clip-path: inset(5% 0 70% 0); transform: translateX(-3px); }
            100% { clip-path: inset(40% 0 30% 0); transform: translateX(1px); }
        }

        /* --- ULTRA-PREMIUM GLASS CARD --- */
        .profile-card {
            background: linear-gradient(135deg, rgba(20, 50, 100, 0.4) 0%, rgba(5, 10, 20, 0.7) 100%);
            backdrop-filter: blur(35px) saturate(150%);
            -webkit-backdrop-filter: blur(35px) saturate(150%);
            
            /* Bordas perfeitamente redondas e suaves (Qualidade Extrema) */
            border-radius: 40px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.2), /* Reflexo de luz na borda superior */
                inset 0 -1px 2px rgba(0, 0, 0, 0.8), /* Sombra profunda na base interna */
                0 40px 80px rgba(0, 0, 0, 0.95), /* Sombra projetada massiva em 3D */
                0 0 0 1px rgba(255, 255, 255, 0.02); /* Halo microscópico ao redor */
            
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Reflexo de Vidro (Sweep) */
        .profile-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.03) 40%,
                rgba(255,255,255,0.15) 50%,
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0) 100%
            );
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.6s ease-out;
            pointer-events: none;
            z-index: 1;
        }

        .profile-card:hover::before {
            transform: rotate(30deg) translateY(100%);
        }

        /* Iluminação Interna Volumétrica */
        .profile-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        /* Reação do Cartão ao Trovão */
        .thunder-active .profile-card {
            background: linear-gradient(135deg, rgba(40, 80, 150, 0.6) 0%, rgba(10, 20, 40, 0.9) 100%);
            border-color: rgba(100, 200, 255, 0.5);
            box-shadow: 
                inset 0 2px 5px rgba(255, 255, 255, 0.7), 
                inset 0 -1px 2px rgba(0, 0, 0, 0.8),
                0 40px 80px rgba(0, 0, 0, 1),
                0 0 80px rgba(0, 150, 255, 0.3); /* Brilho azul elétrico ao redor do cartão */
        }

        /* --- ICONS (NEO-MORPHIC) --- */
        .icon-container { 
            display: flex; 
            gap: 2rem; 
            justify-content: center; 
            align-items: center; 
            z-index: 2;
            position: relative;
        }
        @media (min-width: 768px) { .icon-container { gap: 3.5rem; } }

        .icon-link {
            position: relative;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .icon-link:hover { 
            color: #fff; 
            transform: translateY(-10px) scale(1.2); 
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.9); 
        }
        
        /* Ponto de mira (Target) sob o ícone no hover */
        .icon-link::after {
            content: ''; 
            position: absolute; 
            bottom: -15px; 
            width: 4px; 
            height: 4px;
            border-radius: 50%;
            background: #fff; 
            opacity: 0;
            transform: scale(0); 
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
        }
        .icon-link:hover::after { 
            opacity: 1; 
            transform: scale(1);
        }

        /* --- HUD ELEMENTS --- */
        .hud-text {
            position: absolute;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            letter-spacing: 0.4em;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.2);
            pointer-events: none;
            transition: color 0.2s;
            z-index: 2;
        }

        .thunder-active .hud-text {
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 8px #fff;
        }

        .hud-bottom-right { bottom: 1.5rem; right: 2rem; }
        .hud-top-left { top: 1.5rem; left: 2rem; opacity: 0.5; }

    </style>
</head>
<body class="antialiased">

    <!-- Fundo de Tempestade Avançado (Canvas) -->
    <canvas id="storm-canvas"></canvas>
    
    <!-- Overlays Cinemáticos -->
    <div class="vignette"></div>
    <div class="film-grain"></div>
    <div class="scanlines"></div>

    <!-- Interface Principal -->
    <div class="main-content" id="main-content">
        <div class="name-container">
            <div class="glitch-wrapper">
                <h1 class="glitch-text" data-text="KZNYBS">KZNYBS</h1>
            </div>
        </div>

        <div class="w-full max-w-sm md:max-w-2xl p-8 md:p-14 profile-card" 
             data-tilt data-tilt-max="8" data-tilt-speed="600" data-tilt-glare="true" data-tilt-max-glare="0.15">
            
            <div class="hud-text hud-top-left transform-gpu" style="transform: translateZ(10px);">
                SEC // 01
            </div>

            <div class="icon-container transform-gpu" style="transform: translateZ(40px);">
                <a href="https://github.com/kznybs" target="_blank" class="icon-link" aria-label="GitHub">
                    <i class="fab fa-github text-4xl md:text-6xl"></i>
                </a>

                <a href="https://steamcommunity.com/id/kznybs/" target="_blank" class="icon-link" aria-label="Steam">
                    <i class="fab fa-steam text-4xl md:text-6xl"></i>
                </a>

                <a href="https://www.instagram.com/kznybs/" target="_blank" class="icon-link" aria-label="Instagram">
                    <i class="fab fa-instagram text-4xl md:text-6xl"></i>
                </a>
                
                <a href="https://www.linkedin.com/in/kznybs/" target="_blank" class="icon-link" aria-label="LinkedIn">
                    <i class="fab fa-linkedin text-4xl md:text-6xl"></i>
                </a>
            </div>

            <div class="hud-text hud-bottom-right transform-gpu" style="transform: translateZ(20px);">
                NEXUS_LINK // ACTIVE
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    
    <script>
        // --- NEXT-GEN STORM ENGINE (CANVAS) ---
        const canvas = document.getElementById('storm-canvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Otimização de performance
        const body = document.body;

        let width, height;
        let rain = [];
        let splashes = [];
        let lightning = [];
        let flashOpacity = 0;

        // Mouse Parallax & Spotlight Tracking
        let mouseX = 0, mouseY = 0;
        let spotX = 0, spotY = 0;

        // Configurações Físicas
        const RAIN_COUNT = window.innerWidth > 768 ? 600 : 300; // Responsivo
        const BASE_ANGLE = 0.15;
        let currentAngle = BASE_ANGLE;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (spotX === 0) {
                spotX = width / 2;
                spotY = height / 2;
                mouseX = width / 2;
                mouseY = height / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            // O ângulo da chuva muda levemente com o mouse (Parallax 3D fake)
            currentAngle = BASE_ANGLE + ((mouseX / width) - 0.5) * 0.2;
        });

        // Clique para invocar trovão
        window.addEventListener('click', createLightning);

        // --- CLASSES DE PARTÍCULAS ---

        class Drop {
            constructor() {
                this.reset(true);
            }

            reset(randomY = false) {
                // Espalha a chuva além das bordas para compensar o ângulo
                this.x = (Math.random() * (width + 400)) - 200;
                this.y = randomY ? Math.random() * height : -Math.random() * 100 - 10;
                
                // Z define profundidade: afeta tamanho, velocidade e opacidade
                this.z = Math.random() * 0.7 + 0.3; 
                this.len = (Math.random() * 30 + 15) * this.z;
                this.speed = (Math.random() * 15 + 25) * this.z;
            }

            update() {
                this.x += currentAngle * this.speed;
                this.y += this.speed;

                if (this.y > height) {
                    // Criar splash quando atinge o chão (apenas as mais próximas)
                    if (this.z > 0.6 && Math.random() > 0.5) {
                        createSplash(this.x, height);
                    }
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                // Gradiente linear cinemático na gota de chuva (Motion Blur Realista)
                const grad = ctx.createLinearGradient(this.x, this.y, this.x + currentAngle * this.len, this.y + this.len);
                grad.addColorStop(0, `rgba(150, 200, 255, 0)`);
                grad.addColorStop(1, `rgba(150, 200, 255, ${0.4 * this.z})`);
                
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.5 * this.z;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + currentAngle * this.len, this.y + this.len);
                ctx.stroke();
            }
        }

        class Splash {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = -Math.random() * 3 - 2;
                this.life = 1;
                this.decay = Math.random() * 0.05 + 0.05;
                this.size = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; // Gravidade
                this.life -= this.decay;
            }
            draw() {
                ctx.fillStyle = `rgba(200, 200, 200, ${this.life * 0.5})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function createSplash(x, y) {
            let count = Math.floor(Math.random() * 3) + 1;
            for (let i = 0; i < count; i++) {
                splashes.push(new Splash(x, y));
            }
        }

        for (let i = 0; i < RAIN_COUNT; i++) {
            rain.push(new Drop());
        }

        // --- SISTEMA DE RAIOS (GERAÇÃO PROCEDURAL AVANÇADA) ---

        function createLightning() {
            const startX = Math.random() * width;
            const segments = [];
            
            // Função recursiva para criar ramificações
            function generateBranch(x, y, targetY, isMain) {
                let currentX = x;
                let currentY = y;
                const branchSegments = [];

                while (currentY < targetY) {
                    const stepY = Math.random() * 40 + 10;
                    const stepX = (Math.random() - 0.5) * 80;
                    const nextX = currentX + stepX;
                    const nextY = currentY + stepY;
                    
                    branchSegments.push({x1: currentX, y1: currentY, x2: nextX, y2: nextY, isMain: isMain});
                    
                    // Chance de criar um galho secundário
                    if (isMain && Math.random() > 0.8) {
                        segments.push(...generateBranch(nextX, nextY, targetY - (Math.random() * 200), false));
                    }

                    currentX = nextX;
                    currentY = nextY;
                }
                return branchSegments;
            }

            segments.push(...generateBranch(startX, 0, height, true));
            
            lightning.push({
                segments: segments,
                life: 12, // Duração
                opacity: 1
            });

            // Efeitos Globais
            flashOpacity = 0.6; 
            body.classList.add('thunder-active');
            
            // Limpa a classe após a animação CSS (600ms)
            clearTimeout(window.thunderTimeout);
            window.thunderTimeout = setTimeout(() => {
                body.classList.remove('thunder-active');
            }, 600);
        }

        // --- LOOP PRINCIPAL ---

        function loop() {
            // Suavização do movimento do mouse (Lerp) para o Spotlight
            spotX += (mouseX - spotX) * 0.05;
            spotY += (mouseY - spotY) * 0.05;

            // Fundo Dinâmico (Azul Vivo e Profundo)
            const gradient = ctx.createRadialGradient(spotX, spotY, 0, spotX, spotY, Math.max(width, height) * 0.9);
            gradient.addColorStop(0, "#005c97"); // Centro iluminado (azul vibrante)
            gradient.addColorStop(1, "#000814"); // Bordas oceano profundo
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Desenhar Chuva
            ctx.lineCap = 'round';
            rain.forEach(drop => {
                drop.update();
                drop.draw();
            });

            // Desenhar Splashes
            for (let i = splashes.length - 1; i >= 0; i--) {
                let s = splashes[i];
                s.update();
                s.draw();
                if (s.life <= 0) splashes.splice(i, 1);
            }

            // Invocar Raio Aleatório (Baixa probabilidade, alta tensão)
            if (Math.random() < 0.004) { 
                createLightning();
            }

            // Desenhar Raios (Com Bloom/Glow intenso)
            if (lightning.length > 0) {
                ctx.save();
                ctx.globalCompositeOperation = 'screen'; // Faz a luz "estourar"
                
                for (let i = lightning.length - 1; i >= 0; i--) {
                    const bolt = lightning[i];
                    
                    // Flickering caótico
                    ctx.globalAlpha = Math.random() > 0.2 ? bolt.opacity : 0; 
                    
                    // Configuração do Glow
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = "rgba(0, 195, 255, 1)"; // Glow cyan elétrico
                    ctx.strokeStyle = "#ffffff";
                    
                    ctx.beginPath();
                    bolt.segments.forEach(seg => {
                        ctx.lineWidth = seg.isMain ? 3 : 1; // Galho principal mais grosso
                        ctx.moveTo(seg.x1, seg.y1);
                        ctx.lineTo(seg.x2, seg.y2);
                    });
                    ctx.stroke();

                    // Núcleo branco puro (re-desenhar sem sombra para ficar nítido)
                    ctx.shadowBlur = 0;
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    bolt.life--;
                    if (bolt.life <= 0) {
                        lightning.splice(i, 1);
                    }
                }
                ctx.restore();
            }

            // Desenhar Flash Global (Ilumina a tela inteira)
            if (flashOpacity > 0) {
                ctx.fillStyle = `rgba(180, 230, 255, ${flashOpacity})`; // Branco levemente azulado
                ctx.fillRect(0, 0, width, height);
                flashOpacity *= 0.8; // Decaimento exponencial
            }

            requestAnimationFrame(loop);
        }

        // Iniciar Loop
        requestAnimationFrame(loop);

        // --- INIT VANILLA TILT ---
        VanillaTilt.init(document.querySelector(".profile-card"), {
            max: 12,
            speed: 800, 
            glare: true,
            "max-glare": 0.15,
            scale: 1.03,
            perspective: 1000,
            gyroscope: true,
            easing: "cubic-bezier(.03,.98,.52,.99)" // Movimento hiper suave
        });
    </script>

</body>
</html>
