<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Árvore AVL (Estrutura de Dados II)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .handwritten {
            font-family: 'Kalam', cursive;
        }
        #tree-container {
            cursor: grab;
            overflow: hidden; 
            position: relative;
        }
        #tree-canvas {
            position: absolute;
            transform-origin: 0 0;
            transition: transform 0.2s ease-out, width 0.5s ease-in-out, height 0.5s ease-in-out;
        }
        .node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            border: 3px solid;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            background-color: white;
            color: #1e293b; /* slate-800 */
            transition: all 0.5s ease-in-out;
            z-index: 10;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .node-value {
            font-weight: 600;
            font-size: 1.1rem;
        }
        .node-bf {
            position: absolute;
            top: -20px;
            right: -20px;
            color: white;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid white;
        }
        .line {
            position: absolute;
            background-color: #94a3b8; /* slate-400 */
            height: 3px;
            transform-origin: 0 0;
            transition: all 0.5s ease-in-out;
            z-index: 5;
        }
        .node.new {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-screen-2xl bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6 border-2 border-slate-200">
        <!-- Cabeçalho -->
        <div class="text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-teal-600 handwritten">Visualizador de Árvore AVL</h1>
            <p class="text-slate-500 mt-2">Implementação visual para o trabalho de Estrutura de Dados II.</p>
        </div>

        <!-- Controles -->
        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
            <div class="flex items-center space-x-3">
                <input type="text" id="keys-input" class="bg-white border-2 border-slate-300 focus:border-teal-500 focus:ring-teal-500 rounded-lg px-4 py-2 text-slate-900 w-full" placeholder="Digite as chaves separadas por vírgula...">
            </div>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                 <button id="next-step-btn" class="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 px-4 rounded-lg transition-transform transform hover:scale-105">Próximo Passo</button>
                 <button id="build-all-btn" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-4 rounded-lg transition-transform transform hover:scale-105">Construir Tudo</button>
                 <button id="reset-btn" class="bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2 px-4 rounded-lg transition-transform transform hover:scale-105">Reiniciar Árvore</button>
                 <button id="reset-view-btn" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2 px-4 rounded-lg transition-transform transform hover:scale-105">Centralizar Vista</button>
            </div>
             <div class="pt-4 border-t border-slate-200 text-center">
                 <p class="text-slate-500 mb-2 handwritten text-lg">Carregar exercícios do PDF</p>
                 <div class="flex justify-center gap-4">
                     <button id="ex1-btn" class="bg-slate-600 hover:bg-slate-700 text-white text-sm py-1 px-4 rounded-lg">Exercício 1 (Números)</button>
                     <button id="ex2-btn" class="bg-slate-600 hover:bg-slate-700 text-white text-sm py-1 px-4 rounded-lg">Exercício 2 (Texto)</button>
                 </div>
             </div>
        </div>
        
        <!-- Área de Visualização -->
        <div class="relative bg-slate-100 rounded-lg p-4 min-h-[50vh] flex flex-col border-2 border-dashed border-slate-300">
             <div id="status-message" class="w-full text-center mb-4 flex-shrink-0">
                <p class="text-slate-600 handwritten text-2xl">Pronto para começar. Use o scroll para zoom e arraste para mover.</p>
            </div>
            <div id="tree-container" class="w-full h-full flex-grow">
                <div id="tree-canvas"></div>
            </div>
        </div>

        <!-- Informações do Aluno -->
        <div class="text-center pt-4 border-t border-slate-200">
            <p class="text-slate-600 font-semibold">Acadêmico: Gabriel Olímpio Carvalho de Oliveira</p>
            <p class="text-slate-500 text-sm">Estrutura de Dados II - Prof. Luciano Z. Wolski</p>
        </div>
    </div>

    <script>
        // --- Lógica da Árvore AVL (sem alterações) ---
        class Node {
            constructor(key) { this.key = key; this.left = null; this.right = null; this.height = 1; }
        }
        class AVLTree {
            constructor() { this.root = null; }
            getHeight(node) { return node ? node.height : 0; }
            getBalanceFactor(node) { if (!node) return 0; return this.getHeight(node.left) - this.getHeight(node.right); }
            updateHeight(node) { node.height = Math.max(this.getHeight(node.left), this.getHeight(node.right)) + 1; }
            rightRotate(y) { const x = y.left; const T2 = x.right; x.right = y; y.left = T2; this.updateHeight(y); this.updateHeight(x); return x; }
            leftRotate(x) { const y = x.right; const T2 = y.left; y.left = x; x.right = T2; this.updateHeight(x); this.updateHeight(y); return y; }
            insert(node, key) {
                if (!node) return new Node(key);
                if (key < node.key) node.left = this.insert(node.left, key);
                else if (key > node.key) node.right = this.insert(node.right, key);
                else return node;
                this.updateHeight(node);
                const balance = this.getBalanceFactor(node);
                if (balance > 1 && key < node.left.key) { setStatus(`Desbalanceamento em '${node.key}'. Rotação Simples à Direita.`); return this.rightRotate(node); }
                if (balance < -1 && key > node.right.key) { setStatus(`Desbalanceamento em '${node.key}'. Rotação Simples à Esquerda.`); return this.leftRotate(node); }
                if (balance > 1 && key > node.left.key) { setStatus(`Desbalanceamento em '${node.key}'. Rotação Dupla (Esquerda-Direita).`); node.left = this.leftRotate(node.left); return this.rightRotate(node); }
                if (balance < -1 && key < node.right.key) { setStatus(`Desbalanceamento em '${node.key}'. Rotação Dupla (Direita-Esquerda).`); node.right = this.rightRotate(node.right); return this.leftRotate(node); }
                return node;
            }
            add(key) {
                let parsedKey = isNaN(key) ? key.trim().toUpperCase() : parseFloat(key);
                if ((typeof parsedKey === 'string' && parsedKey === '') || (typeof parsedKey === 'number' && isNaN(parsedKey))) return;
                setStatus(`Inserindo '${parsedKey}'...`);
                this.root = this.insert(this.root, parsedKey);
            }
        }

        // --- Lógica da Interface e Visualização ---
        const keysInput = document.getElementById('keys-input');
        const nextStepBtn = document.getElementById('next-step-btn');
        const buildAllBtn = document.getElementById('build-all-btn');
        const resetBtn = document.getElementById('reset-btn');
        const resetViewBtn = document.getElementById('reset-view-btn');
        const treeContainer = document.getElementById('tree-container');
        const treeCanvas = document.getElementById('tree-canvas');
        const statusMessage = document.getElementById('status-message').querySelector('p');
        const ex1Btn = document.getElementById('ex1-btn');
        const ex2Btn = document.getElementById('ex2-btn');

        let avl = new AVLTree();
        let keysToInsert = [];
        let currentIndex = 0;
        let scale = 1, panX = 0, panY = 0, isPanning = false, startPanX = 0, startPanY = 0;

        function setStatus(message) {
            statusMessage.textContent = message;
        }
        
        function resetTree() {
            avl = new AVLTree(); keysToInsert = []; currentIndex = 0; keysInput.value = '';
            treeCanvas.innerHTML = '';
            setStatus('Pronto para começar. Use o scroll para zoom e arraste para mover.');
            nextStepBtn.disabled = false; buildAllBtn.disabled = false;
            resetView();
        }

        function handleNextStep() {
            if (keysToInsert.length === 0) {
                 const keys = keysInput.value.split(',').map(k => k.trim()).filter(Boolean);
                 if (keys.length > 0) { keysToInsert = keys; currentIndex = 0; } 
                 else { setStatus("Nenhuma chave para inserir."); return; }
            }
            if (currentIndex < keysToInsert.length) {
                avl.add(keysToInsert[currentIndex]);
                drawTree(); resetView(); currentIndex++;
            }
            if (currentIndex >= keysToInsert.length) {
                setStatus("Construção da árvore concluída!");
                nextStepBtn.disabled = true; buildAllBtn.disabled = true;
            }
        }
        
        async function handleBuildAll() {
             const keys = keysInput.value.split(',').map(k => k.trim()).filter(Boolean);
             if (keys.length === 0) { setStatus("Nenhuma chave para inserir."); return; }
             resetTree(); keysToInsert = keys;
             nextStepBtn.disabled = true; buildAllBtn.disabled = true;
             for (const key of keysToInsert) {
                 avl.add(key);
                 drawTree(key); resetView();
                 await new Promise(resolve => setTimeout(resolve, 800));
             }
             setStatus("Construção da árvore concluída!");
        }

        function getTreeBounds(node, x, xOffset, y, yOffset) {
            if (!node) return { minX: Infinity, maxX: -Infinity, maxY: -Infinity };
            const leftBounds = getTreeBounds(node.left, x - xOffset, xOffset / 1.8, y + yOffset, yOffset);
            const rightBounds = getTreeBounds(node.right, x + xOffset, xOffset / 1.8, y + yOffset, yOffset);
            return {
                minX: Math.min(x, leftBounds.minX, rightBounds.minX),
                maxX: Math.max(x, leftBounds.maxX, rightBounds.maxX),
                maxY: Math.max(y, leftBounds.maxY, rightBounds.maxY),
            };
        }
        
        function drawTree(newKey = null) {
            treeCanvas.innerHTML = ''; if (!avl.root) return;
            const nodePositions = new Map(); const yOffset = 110;
            const initialXOffset = Math.max(200, Math.pow(2, avl.root.height) * 35);
            const bounds = getTreeBounds(avl.root, 0, initialXOffset, yOffset, yOffset);
            const treeWidth = bounds.maxX - bounds.minX; const treeHeight = bounds.maxY;
            const padding = 130;
            treeCanvas.style.width = `${treeWidth + padding}px`;
            treeCanvas.style.height = `${treeHeight + padding}px`;
            const startX = -bounds.minX + padding / 2;
            function calculatePositions(node, x, xOffset, y) {
                if (!node) return;
                nodePositions.set(node, { x, y });
                if (node.left) calculatePositions(node.left, x - xOffset, xOffset / 1.8, y + yOffset);
                if (node.right) calculatePositions(node.right, x + xOffset, xOffset / 1.8, y + yOffset);
            }
            calculatePositions(avl.root, startX, initialXOffset, yOffset);
            nodePositions.forEach((pos, node) => {
                if (node.left) drawLine(pos.x, pos.y, nodePositions.get(node.left).x, nodePositions.get(node.left).y);
                if (node.right) drawLine(pos.x, pos.y, nodePositions.get(node.right).x, nodePositions.get(node.right).y);
            });
            nodePositions.forEach((pos, node) => drawNode(node, pos.x, pos.y, newKey));
        }
        
        function drawNode(node, x, y, newKey) {
            const nodeEl = document.createElement('div');
            nodeEl.className = 'node';
            if (node.key === newKey) nodeEl.classList.add('new');
            const balanceFactor = avl.getBalanceFactor(node);
            let bfColor = 'bg-teal-500';
            if(balanceFactor > 0) bfColor = 'bg-sky-500'; if(balanceFactor < 0) bfColor = 'bg-amber-500';
            nodeEl.innerHTML = `<span class="node-value">${node.key}</span><div class="node-bf ${bfColor}">${balanceFactor}</div>`;
            nodeEl.style.left = `${x}px`; nodeEl.style.top = `${y}px`;
            const nodeColor = balanceFactor > 1 || balanceFactor < -1 ? 'border-rose-500' : 'border-slate-400';
            nodeEl.classList.add(nodeColor);
            treeCanvas.appendChild(nodeEl);
        }
        
        function drawLine(x1, y1, x2, y2) {
            const line = document.createElement('div'); line.className = 'line';
            const length = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
            const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
            line.style.width = `${length}px`; line.style.left = `${x1}px`; line.style.top = `${y1}px`;
            line.style.transform = `rotate(${angle}deg)`;
            treeCanvas.appendChild(line);
        }

        function applyTransform() {
            treeCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function resetView() {
            if (!avl.root) { scale = 1; panX = 0; panY = 0; } 
            else {
                const canvasWidth = parseFloat(treeCanvas.style.width);
                const canvasHeight = parseFloat(treeCanvas.style.height);
                const containerWidth = treeContainer.offsetWidth;
                const containerHeight = treeContainer.offsetHeight;
                scale = Math.min(containerWidth / canvasWidth, containerHeight / canvasHeight) * 0.95;
                panX = (containerWidth - canvasWidth * scale) / 2;
                panY = (containerHeight - canvasHeight * scale) / 2;
            }
            applyTransform();
        }

        treeContainer.addEventListener('mousedown', (e) => { e.preventDefault(); isPanning = true; startPanX = e.clientX - panX; startPanY = e.clientY - panY; treeContainer.style.cursor = 'grabbing'; });
        treeContainer.addEventListener('mousemove', (e) => { if (!isPanning) return; e.preventDefault(); panX = e.clientX - startPanX; panY = e.clientY - startPanY; applyTransform(); });
        treeContainer.addEventListener('mouseup', () => { isPanning = false; treeContainer.style.cursor = 'grab'; });
        treeContainer.addEventListener('mouseleave', () => { isPanning = false; treeContainer.style.cursor = 'grab'; });
        treeContainer.addEventListener('wheel', (e) => {
            e.preventDefault(); const zoomSpeed = 0.1; const oldScale = scale;
            scale += e.deltaY * -0.01 * zoomSpeed * scale;
            scale = Math.min(Math.max(0.1, scale), 5);
            const rect = treeContainer.getBoundingClientRect();
            const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top;
            panX = mouseX - (mouseX - panX) * (scale / oldScale);
            panY = mouseY - (mouseY - panY) * (scale / oldScale);
            applyTransform();
        });
        
        nextStepBtn.addEventListener('click', handleNextStep);
        buildAllBtn.addEventListener('click', handleBuildAll);
        resetBtn.addEventListener('click', resetTree);
        resetViewBtn.addEventListener('click', resetView);
        ex1Btn.addEventListener('click', () => { resetTree(); keysInput.value = '10, 20, 30, 5, 3, 50, 40, 70, 60, 90'; });
        ex2Btn.addEventListener('click', () => { resetTree(); keysInput.value = 'PSC, INF, ENG, QUI, MAT, LET, MED, ECO, ADM'; });
        window.addEventListener('resize', resetView);
        
        resetTree();
    </script>
</body>
</html>
