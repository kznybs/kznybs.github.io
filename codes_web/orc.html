<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento Mensal Centros de Custo Geral</title>
    <!-- Incluindo Tailwind CSS para um design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos para as células editáveis e placeholders */
        [contenteditable]:empty:before {
            content: attr(placeholder);
            color: #a0aec0; /* Cor do placeholder (cinza) */
            pointer-events: none;
            display: block; /* Garante que o placeholder seja exibido */
        }
        /* Foco suave nas células */
        td[contenteditable="true"]:focus {
            outline: 2px solid #3b82f6; /* Borda azul ao focar */
            background-color: #eff6ff; /* Fundo azul claro */
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans p-4">

    <div class="w-full max-w-5xl bg-white rounded-xl shadow-2xl p-6">
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6">
            <h1 id="main-title" class="text-3xl font-bold text-gray-800 mb-4 sm:mb-0"></h1>
            <button id="add-main-row" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-md transition-transform transform hover:scale-105">
                Adicionar Linha Principal
            </button>
        </div>

        <!-- Container da Tabela com scroll horizontal em telas pequenas -->
        <div class="overflow-x-auto border border-gray-200 rounded-lg">
            <table id="spreadsheet" class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="w-12 px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Conta</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descrição</th>
                    </tr>
                </thead>
                <tbody id="spreadsheet-body" class="bg-white divide-y divide-gray-200">
                    <!-- Linhas são carregadas ou adicionadas dinamicamente aqui -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Aguarda o DOM ser totalmente carregado
        document.addEventListener('DOMContentLoaded', () => {
            const mainTitle = document.getElementById('main-title');
            const months = [
                'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
            ];
            const date = new Date();
            // Ao definir o dia como 0, a data retrocede para o último dia do mês anterior
            date.setDate(0);
            const previousMonthName = months[date.getMonth()];
            mainTitle.innerText = `Justificativas Orçamentárias de ${previousMonthName}`;

            // Carrega os dados salvos ao iniciar
            loadData();
        });

        const addMainRowBtn = document.getElementById('add-main-row');
        const tableBody = document.getElementById('spreadsheet-body');

        // Função para salvar o estado da tabela no localStorage
        const saveData = () => {
            const rows = Array.from(tableBody.querySelectorAll('tr'));
            const data = rows.map(row => ({
                isMain: row.classList.contains('bg-gray-50'),
                conta: row.cells[1].innerText,
                descricao: row.cells[2].innerText,
            }));
            localStorage.setItem('spreadsheetData', JSON.stringify(data));
        };

        // Função para atualizar a cor da linha com base no texto da descrição
        const updateRowColor = (row, descriptionText) => {
            row.classList.remove('bg-green-100', 'hover:bg-green-200', 'bg-red-100', 'hover:bg-red-200');
            const text = descriptionText.trim().toLowerCase();
            if (text === 'meta atingida') {
                row.classList.add('bg-green-100', 'hover:bg-green-200');
            } else if (text === '') {
                row.classList.add('bg-red-100', 'hover:bg-red-200');
            }
        };

        // Função para criar uma nova linha (principal ou sub-linha), opcionalmente com dados pré-existentes
        const createRow = (isMain = true, rowData = null) => {
            const tr = document.createElement('tr');
            if (isMain) {
                tr.classList.add('bg-gray-50'); // Estilo para linha principal
            }

            // Célula de Ações
            const actionsCell = document.createElement('td');
            actionsCell.classList.add('px-4', 'py-2', 'whitespace-nowrap', 'text-sm', 'font-medium', 'text-center');

            const deleteBtn = document.createElement('button');
            deleteBtn.innerHTML = '&#x1F5D1;'; // Ícone de lixeira
            deleteBtn.title = "Remover linha";
            deleteBtn.classList.add('text-red-500', 'hover:text-red-700', 'mx-1');
            deleteBtn.onclick = () => {
                tr.remove();
                saveData(); // Salva após deletar
            };
            actionsCell.appendChild(deleteBtn);

            if (isMain) {
                const addSubRowBtn = document.createElement('button');
                addSubRowBtn.innerHTML = '&#x2795;'; // Ícone de mais
                addSubRowBtn.title = "Adicionar sub-linha";
                addSubRowBtn.classList.add('text-green-500', 'hover:text-green-700', 'mx-1');
                addSubRowBtn.onclick = () => {
                    const subRow = createRow(false);
                    tr.parentNode.insertBefore(subRow, tr.nextSibling);
                    saveData(); // Salva após adicionar sub-linha
                };
                actionsCell.appendChild(addSubRowBtn);
            }

            // Célula de Conta
            const contaCell = document.createElement('td');
            contaCell.contentEditable = true;
            contaCell.classList.add('px-6', 'py-4', 'whitespace-nowrap', 'text-sm', 'text-gray-800');
            if (isMain) {
                contaCell.classList.add('font-bold');
            } else {
                contaCell.classList.add('pl-12'); // Indentação para sub-linha
            }
            contaCell.innerText = rowData ? rowData.conta : '';
            contaCell.addEventListener('input', saveData); // Salva ao editar

            // Célula de Descrição
            const descricaoCell = document.createElement('td');
            descricaoCell.contentEditable = true;
            descricaoCell.setAttribute('placeholder', 'Digite a descrição...');
            descricaoCell.classList.add('px-6', 'py-4', 'whitespace-nowrap', 'text-sm', 'text-gray-500');
            descricaoCell.innerText = rowData ? rowData.descricao : '';
            descricaoCell.addEventListener('input', () => {
                updateRowColor(tr, descricaoCell.innerText);
                saveData(); // Salva ao editar
            });

            // Monta a linha
            tr.appendChild(actionsCell);
            tr.appendChild(contaCell);
            tr.appendChild(descricaoCell);

            // Define a cor inicial da linha
            updateRowColor(tr, descricaoCell.innerText);

            return tr;
        };

        // Evento do botão principal para adicionar linha
        addMainRowBtn.addEventListener('click', () => {
            const mainRow = createRow(true);
            tableBody.appendChild(mainRow);
            saveData(); // Salva após adicionar linha principal
        });

        // Função para carregar dados do localStorage e reconstruir a tabela
        const loadData = () => {
            const savedData = localStorage.getItem('spreadsheetData');
            if (savedData) {
                const data = JSON.parse(savedData);
                data.forEach(rowData => {
                    const row = createRow(rowData.isMain, rowData);
                    tableBody.appendChild(row);
                });
            }
        };
    </script>

</body>
</html>
