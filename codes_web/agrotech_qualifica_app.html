<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroTech Qualifica | Gestão Operacional</title>
    
    <!-- Tailwind CSS (Framework CSS Utilizado em Larga Escala) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons (Ícones modernos e leves) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Configuração do Tailwind (Tema AgroTech) -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        agro: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e', // Brand Principal
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        dark: {
                            bg: '#0f172a',
                            surface: '#1e293b',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Base de Performance e Customizações Nativas */
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; /* Evita pull-to-refresh indesejado em apps mobile */
        }
        
        /* Scrollbar elegante */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Animações e Transições UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.95);
        }
        
        .slide-up-enter { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in { animation: fadeIn 0.2s ease-in forwards; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Checkbox Customizado */
        .agro-checkbox:checked + div {
            background-color: #22c55e;
            border-color: #22c55e;
        }
        .agro-checkbox:checked + div svg { display: block; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-dark-bg text-slate-800 dark:text-slate-200 transition-colors duration-300 antialiased overflow-hidden selection:bg-agro-500 selection:text-white">

    <div id="app-container" class="flex h-screen w-full relative">
        
        <!-- SIDEBAR (Navegação de Workspaces) - Desktop & Mobile Drawer -->
        <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 dark:bg-slate-900/80 z-40 hidden backdrop-blur-sm transition-opacity"></div>
        
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white dark:bg-dark-surface border-r border-slate-200 dark:border-dark-border transform -translate-x-full md:translate-x-0 md:relative transition-transform duration-300 ease-in-out flex flex-col shadow-xl md:shadow-none">

                <div class="flex items-center gap-3 md:gap-5">

    <!-- MODAL NOVA TAREFA / CHECKLIST -->

    <!-- TOAST NOTIFICATIONS CONTAINER -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[70] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        /**
         * AgroTech Qualifica - Sistema de Gestão Operacional
         * Arquitetura: Vanilla JS Enterprise (Store Pattern / PubSub / Controllers)
         */

        // --- 1. UTILS & HELPERS ---
        const Utils = {
            generateId: () => Date.now().toString(36) + Math.random().toString(36).substr(2),
            formatDate: (dateString) => {
                if (!dateString) return '';
                const [year, month, day] = dateString.split('-');
                return `${day}/${month}/${year}`;
            },
            getTodayString: () => {
                const options = { weekday: 'long', day: 'numeric', month: 'long' };
                let str = new Date().toLocaleDateString('pt-BR', options);
                return str.charAt(0).toUpperCase() + str.slice(1);
            },
            debounce: (func, wait) => {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => { clearTimeout(timeout); func(...args); };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            },
            escapeHTML: (str) => {
                if (!str) return '';
                const div = document.createElement('div');
                div.innerText = str;
                return div.innerHTML;
            }
        };

        // --- 2. STATE MANAGEMENT (STORE PATTERN) ---
        // Implementação "Hard" de controle reativo de estado.
        class Store {
            constructor(initialState = {}) {
                this.state = {
                    workspaces: [
                        { id: 'w1', name: 'Tratos Culturais', icon: 'ph-plant' },
                        { id: 'w2', name: 'Inspeção de Maquinário', icon: 'ph-tractor' },
                        { id: 'w3', name: 'Segurança e EPIs', icon: 'ph-shield-check' },
                        { id: 'w4', name: 'Logística de Colheita', icon: 'ph-truck' }
                    ],
                    activeWorkspace: 'w1',
                    tasks: [], 
                    filter: 'all', // all, pending, completed
                    searchQuery: '',
                    theme: 'light',
                    ...initialState
                };
                this.listeners = [];
            }

            subscribe(listener) {
                this.listeners.push(listener);
                return () => { this.listeners = this.listeners.filter(l => l !== listener); };
            }

            getState() { return this.state; }

            setState(partialState) {
                this.state = { ...this.state, ...partialState };
                this.notify();
            }

            notify() {
                this.listeners.forEach(listener => listener(this.state));
            }
        }

        // --- 3. STORAGE LAYER ---
        // Lida com a persistência no LocalStorage (Substitui banco de dados neste mock)
        class StorageManager {
            static KEY = 'agrotech_qualifica_data';

            static load() {
                try {
                    const data = localStorage.getItem(this.KEY);
                    return data ? JSON.parse(data) : null;
                } catch (e) {
                    console.error("Erro ao carregar dados", e);
                    return null;
                }
            }

            static save(state) {
                try {
                    // Salvamos apenas os dados essenciais, não o estado de UI (como pesquisa)
                    const dataToSave = {
                        tasks: state.tasks,
                        theme: state.theme,
                        activeWorkspace: state.activeWorkspace
                    };
                    localStorage.setItem(this.KEY, JSON.stringify(dataToSave));
                } catch (e) {
                    console.error("Erro ao salvar dados", e);
                }
            }

            static exportData(state) {
                const data = { tasks: state.tasks };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `agrotech_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            }

            static importData(file, callback) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.tasks && Array.isArray(data.tasks)) {
                            callback(data.tasks);
                        } else {
                            throw new Error("Formato inválido");
                        }
                    } catch (err) {
                        alert("Arquivo inválido. Por favor, use um arquivo JSON gerado por este aplicativo.");
                    }
                };
                reader.readAsText(file);
            }
        }

        // --- STREAMING_CHUNK:Controladores da Interface de Usuário (UI)... ---
        // --- 4. UI COMPONENTS RENDERING ---
        class UIRenderer {
            constructor() {
                this.DOM = {
                    body: document.body,
                    date: document.getElementById('current-date'),
                    workspaceTitle: document.getElementById('current-workspace-title'),
                    workspacesList: document.getElementById('workspaces-list'),
                    tasksContainer: document.getElementById('tasks-container'),
                    emptyState: document.getElementById('empty-state'),
                    statTotal: document.getElementById('stat-total'),
                    statCompleted: document.getElementById('stat-completed'),
                    statProgressText: document.getElementById('stat-progress-text'),
                    statProgressBar: document.getElementById('stat-progress-bar'),
                    themeIcon: document.getElementById('theme-icon'),
                    filterBtns: document.querySelectorAll('.filter-btn'),
                    toastContainer: document.getElementById('toast-container')
                };
                
                this.DOM.date.textContent = Utils.getTodayString();
                
                // Configuração de cores de prioridade
                this.priorityConfig = {
                    low: { label: 'Rotina', classes: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400', icon: 'ph-arrow-down' },
                    medium: { label: 'Atenção', classes: 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-500', icon: 'ph-warning' },
                    high: { label: 'Crítico', classes: 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-500', icon: 'ph-warning-circle' }
                };
            }

            render(state) {
                this.applyTheme(state.theme);
                this.renderWorkspaces(state);
                
                // Filtera tarefas pelo workspace atual, termo de busca e filtro de status
                const currentTasks = state.tasks.filter(t => t.workspaceId === state.activeWorkspace);
                const filteredTasks = this.applyFilters(currentTasks, state.filter, state.searchQuery);
                
                this.renderTasks(filteredTasks);
                this.renderStats(currentTasks);
                this.updateFilterUI(state.filter);
            }

            applyTheme(theme) {
                const root = document.documentElement;
                if (theme === 'dark') {
                    root.classList.add('dark');
                    this.DOM.themeIcon.className = 'ph ph-sun text-xl text-amber-400';
                } else {
                    root.classList.remove('dark');
                    this.DOM.themeIcon.className = 'ph ph-moon text-xl';
                }
            }

            applyFilters(tasks, filterStr, searchStr) {
                let result = tasks;
                if (filterStr === 'pending') result = result.filter(t => !t.completed);
                if (filterStr === 'completed') result = result.filter(t => t.completed);
                
                if (searchStr.trim()) {
                    const query = searchStr.toLowerCase();
                    result = result.filter(t => t.title.toLowerCase().includes(query));
                }
                return result;
            }

            renderWorkspaces(state) {
                const activeWs = state.workspaces.find(w => w.id === state.activeWorkspace);
                if (activeWs) this.DOM.workspaceTitle.textContent = activeWs.name;

                this.DOM.workspacesList.innerHTML = state.workspaces.map(ws => {
                    const isActive = ws.id === state.activeWorkspace;
                    const activeClasses = isActive 
                        ? 'bg-agro-50 text-agro-700 dark:bg-agro-900/20 dark:text-agro-400 font-medium' 
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:text-slate-900 dark:hover:text-white transition-colors';
                    
                    // Conta tarefas pendentes no workspace
                    const pendingCount = state.tasks.filter(t => t.workspaceId === ws.id && !t.completed).length;
                    const badge = pendingCount > 0 ? `<span class="ml-auto bg-agro-100 dark:bg-agro-900/50 text-agro-700 dark:text-agro-400 py-0.5 px-2 rounded-full text-[10px] font-bold">${pendingCount}</span>` : '';

                    return `
                        <button data-ws-id="${ws.id}" class="workspace-btn flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-sm ${activeClasses} group">
                            <i class="ph ${ws.icon} text-lg ${isActive ? 'text-agro-500' : 'text-slate-400 group-hover:text-slate-600 dark:group-hover:text-slate-300'}"></i>
                            <span class="truncate">${ws.name}</span>
                            ${badge}
                        </button>
                    `;
                }).join('');
            }

            renderStats(workspaceTasks) {
                const total = workspaceTasks.length;
                const completed = workspaceTasks.filter(t => t.completed).length;
                const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

                this.DOM.statTotal.textContent = total;
                this.DOM.statCompleted.textContent = completed;
                this.DOM.statProgressText.textContent = `${percentage}%`;
                this.DOM.statProgressBar.style.width = `${percentage}%`;
            }

            updateFilterUI(currentFilter) {
                this.DOM.filterBtns.forEach(btn => {
                    if (btn.dataset.filter === currentFilter) {
                        btn.className = 'filter-btn active bg-white dark:bg-dark-surface shadow-sm px-4 py-1.5 rounded-lg text-sm font-medium text-slate-800 dark:text-white transition-colors';
                    } else {
                        btn.className = 'filter-btn px-4 py-1.5 rounded-lg text-sm font-medium transition-colors text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200';
                    }
                });
            }

            renderTasks(tasks) {
                if (tasks.length === 0) {
                    this.DOM.tasksContainer.innerHTML = '';
                    this.DOM.emptyState.classList.remove('hidden');
                    this.DOM.emptyState.classList.add('flex');
                    return;
                }

                this.DOM.emptyState.classList.add('hidden');
                this.DOM.emptyState.classList.remove('flex');

                this.DOM.tasksContainer.innerHTML = tasks.map(task => {
                    const prConf = this.priorityConfig[task.priority];
                    
                    // Cálculo de Subtarefas
                    const totalSubs = task.subtasks.length;
                    const completedSubs = task.subtasks.filter(s => s.completed).length;
                    const subProg = totalSubs === 0 ? 0 : Math.round((completedSubs / totalSubs) * 100);
                    
                    // Alerta de Atraso
                    let dateWarning = '';
                    if (task.dueDate && !task.completed) {
                        const due = new Date(task.dueDate);
                        due.setHours(23,59,59);
                        if (due < new Date()) {
                            dateWarning = `<span class="text-xs font-semibold text-red-500 bg-red-50 dark:bg-red-900/20 px-2 py-0.5 rounded-md flex items-center gap-1"><i class="ph ph-clock-warning"></i> Atrasado</span>`;
                        } else {
                            dateWarning = `<span class="text-xs text-slate-400 dark:text-slate-500 flex items-center gap-1"><i class="ph ph-calendar-blank"></i> ${Utils.formatDate(task.dueDate)}</span>`;
                        }
                    }

                    // Renderização das Subtarefas
                    const subtasksHtml = totalSubs > 0 ? `
                        <div class="mt-4 pt-3 border-t border-slate-100 dark:border-dark-border pl-9">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-medium text-slate-500">Progresso do Checklist</span>
                                <span class="text-xs font-bold text-agro-600 dark:text-agro-400">${completedSubs}/${totalSubs}</span>
                            </div>
                            <div class="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-1.5 mb-3">
                                <div class="bg-agro-500 h-1.5 rounded-full transition-all" style="width: ${subProg}%"></div>
                            </div>
                            <ul class="space-y-2">
                                ${task.subtasks.map(sub => `
                                    <li class="flex items-start gap-2 group">
                                        <label class="flex items-center gap-2 cursor-pointer w-full">
                                            <div class="relative flex items-center justify-center">
                                                <input type="checkbox" class="agro-checkbox opacity-0 absolute w-full h-full cursor-pointer z-10" 
                                                    onchange="app.toggleSubtask('${task.id}', '${sub.id}')" ${sub.completed ? 'checked' : ''} ${task.completed ? 'disabled' : ''}>
                                                <div class="w-4 h-4 border border-slate-300 dark:border-slate-600 rounded flex items-center justify-center bg-white dark:bg-dark-surface transition-colors">
                                                    <svg class="w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                                                </div>
                                            </div>
                                            <span class="text-sm ${sub.completed ? 'text-slate-400 line-through' : 'text-slate-700 dark:text-slate-300'} transition-all">${Utils.escapeHTML(sub.title)}</span>
                                        </label>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    ` : '';

                    return `
                        <div class="bg-white dark:bg-dark-surface p-4 md:p-5 rounded-2xl border ${task.completed ? 'border-slate-100 dark:border-dark-border/50 opacity-70' : 'border-slate-200 dark:border-dark-border shadow-sm'} transition-all fade-in">
                            <div class="flex items-start gap-4">
                                <!-- Main Checkbox -->
                                <div class="mt-0.5 relative flex items-center justify-center flex-shrink-0">
                                    <input type="checkbox" class="agro-checkbox opacity-0 absolute w-full h-full cursor-pointer z-10" 
                                        onchange="app.toggleTask('${task.id}')" ${task.completed ? 'checked' : ''}>
                                    <div class="w-6 h-6 border-2 border-slate-300 dark:border-slate-600 rounded-full flex items-center justify-center bg-white dark:bg-dark-surface transition-colors shadow-sm">
                                        <svg class="w-4 h-4 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                                    </div>
                                </div>
                                
                                <div class="flex-1 min-w-0">
                                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-2 mb-1">
                                        <h4 class="text-base font-semibold ${task.completed ? 'text-slate-400 line-through' : 'text-slate-800 dark:text-white'} truncate pr-4">
                                            ${Utils.escapeHTML(task.title)}
                                        </h4>
                                        <div class="flex items-center gap-2 flex-shrink-0">
                                            ${dateWarning}
                                            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md flex items-center gap-1 ${prConf.classes}">
                                                <i class="ph ${prConf.icon}"></i> ${prConf.label}
                                            </span>
                                        </div>
                                    </div>
                                    ${subtasksHtml}
                                </div>

                                <!-- Actions -->
                                <div class="flex flex-col gap-1 ml-2 flex-shrink-0">
                                    <button onclick="app.deleteTask('${task.id}')" class="p-2 text-slate-300 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors" title="Excluir">
                                        <i class="ph ph-trash text-lg"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            showToast(message, type = 'success') {
                const toast = document.createElement('div');
                const colors = type === 'success' 
                    ? 'bg-agro-600 text-white shadow-agro-500/30' 
                    : 'bg-red-600 text-white shadow-red-500/30';
                const icon = type === 'success' ? 'ph-check-circle' : 'ph-info';

                toast.className = `flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg text-sm font-medium slide-up-enter ${colors}`;
                toast.innerHTML = `<i class="ph ${icon} text-lg"></i> ${message}`;
                
                this.DOM.toastContainer.appendChild(toast);
                
                // Fade out após 3s
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-10px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        }

        // --- STREAMING_CHUNK:Lógica da Aplicação (Controller) e Eventos... ---
        // --- 5. APP CONTROLLER ---
        class AppController {
            constructor(store, ui) {
                this.store = store;
                this.ui = ui;
                
                // Variável auxiliar para o formulário de subtarefas no modal
                this.tempSubtasks = [];

                this.bindEvents();
                
                // Sincroniza LocalStorage quando a Store muda
                this.store.subscribe((state) => StorageManager.save(state));
                
                // Trigger renderização inicial
                this.store.notify();
            }

            bindEvents() {
                // Sidebar e Navegação
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('mobile-overlay');
                
                const toggleSidebar = () => {
                    const isClosed = sidebar.classList.contains('-translate-x-full');
                    if (isClosed) {
                        sidebar.classList.remove('-translate-x-full');
                        overlay.classList.remove('hidden');
                        setTimeout(() => overlay.classList.add('opacity-100'), 10);
                    } else {
                        sidebar.classList.add('-translate-x-full');
                        overlay.classList.remove('opacity-100');
                        setTimeout(() => overlay.classList.add('hidden'), 300);
                    }
                };

                document.getElementById('open-sidebar-btn').addEventListener('click', toggleSidebar);
                document.getElementById('close-sidebar-btn').addEventListener('click', toggleSidebar);
                overlay.addEventListener('click', toggleSidebar);

                // Mudança de Workspace (Delegação de Eventos)
                document.getElementById('workspaces-list').addEventListener('click', (e) => {
                    const btn = e.target.closest('.workspace-btn');
                    if (btn) {
                        this.store.setState({ activeWorkspace: btn.dataset.wsId, filter: 'all', searchQuery: '' });
                        document.getElementById('search-input').value = ''; // Limpa busca UI
                        if (window.innerWidth < 768) toggleSidebar(); // Fecha menu no mobile
                    }
                });

                // Filtros
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.store.setState({ filter: e.target.dataset.filter });
                    });
                });

                // Busca (Debounced)
                const searchInput = document.getElementById('search-input');
                searchInput.addEventListener('input', Utils.debounce((e) => {
                    this.store.setState({ searchQuery: e.target.value });
                }, 300));

                // Tema
                document.getElementById('theme-toggle').addEventListener('click', () => {
                    const current = this.store.getState().theme;
                    this.store.setState({ theme: current === 'light' ? 'dark' : 'light' });
                });

                // --- Lógica do Modal de Nova Tarefa ---
                const modal = document.getElementById('task-modal');
                const form = document.getElementById('task-form');
                
                const openModal = () => {
                    this.tempSubtasks = [];
                    this.renderTempSubtasks();
                    form.reset();
                    modal.classList.remove('hidden');
                    document.getElementById('task-title-input').focus();
                };
                
                const closeModal = () => {
                    modal.classList.add('hidden');
                };

                document.getElementById('fab-add-task').addEventListener('click', openModal);
                document.querySelectorAll('.close-modal-btn, .modal-backdrop').forEach(el => {
                    el.addEventListener('click', closeModal);
                });

                // Adicionar Subtarefa no Modal
                const addSubBtn = document.getElementById('add-subtask-btn');
                const subInput = document.getElementById('subtask-input');
                
                const pushSubtask = () => {
                    const val = subInput.value.trim();
                    if (val) {
                        this.tempSubtasks.push({ id: Utils.generateId(), title: val, completed: false });
                        subInput.value = '';
                        this.renderTempSubtasks();
                        subInput.focus();
                    }
                };
                
                addSubBtn.addEventListener('click', pushSubtask);
                subInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); pushSubtask(); }
                });

                // Salvar Tarefa Principal
                document.getElementById('save-task-btn').addEventListener('click', () => {
                    const title = document.getElementById('task-title-input').value.trim();
                    if (!title) {
                        this.ui.showToast('Preencha o título da inspeção', 'error');
                        return;
                    }

                    const newTask = {
                        id: Utils.generateId(),
                        workspaceId: this.store.getState().activeWorkspace,
                        title: title,
                        priority: document.getElementById('task-priority-input').value,
                        dueDate: document.getElementById('task-date-input').value || null,
                        completed: false,
                        subtasks: [...this.tempSubtasks],
                        createdAt: new Date().toISOString()
                    };

                    const tasks = [newTask, ...this.store.getState().tasks];
                    this.store.setState({ tasks });
                    this.ui.showToast('Item de inspeção adicionado com sucesso!');
                    closeModal();
                    
                    // Rola pro topo
                    document.getElementById('main-scroll-area').scrollTop = 0;
                });

                // Excluir Subtarefa temporária no Modal (Delegação)
                document.getElementById('modal-subtasks-list').addEventListener('click', (e) => {
                    const btn = e.target.closest('.del-temp-sub-btn');
                    if (btn) {
                        this.tempSubtasks = this.tempSubtasks.filter(s => s.id !== btn.dataset.id);
                        this.renderTempSubtasks();
                    }
                });

                // Backup de Dados
                document.getElementById('export-btn').addEventListener('click', () => {
                    StorageManager.exportData(this.store.getState());
                    this.ui.showToast('Backup exportado com sucesso!');
                });

                document.getElementById('import-input').addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    StorageManager.importData(file, (importedTasks) => {
                        this.store.setState({ tasks: importedTasks });
                        this.ui.showToast('Dados importados com sucesso!');
                        e.target.value = ''; // reseta input
                    });
                });
            }

            renderTempSubtasks() {
                const list = document.getElementById('modal-subtasks-list');
                if (this.tempSubtasks.length === 0) {
                    list.innerHTML = '<li class="text-xs text-slate-400 italic py-2">Nenhum item adicionado.</li>';
                    return;
                }
                list.innerHTML = this.tempSubtasks.map(s => `
                    <li class="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-2 rounded border border-slate-100 dark:border-slate-700">
                        <span class="text-sm text-slate-700 dark:text-slate-300 truncate">${Utils.escapeHTML(s.title)}</span>
                        <button type="button" data-id="${s.id}" class="del-temp-sub-btn text-slate-400 hover:text-red-500 transition-colors p-1"><i class="ph ph-trash"></i></button>
                    </li>
                `).join('');
            }

            // Ações globais exportadas para o contexto da UI (chamadas via onclick no HTML)
            toggleTask(id) {
                const tasks = this.store.getState().tasks.map(t => {
                    if (t.id === id) {
                        const newCompletedStatus = !t.completed;
                        // Se completou a mãe, completa as filhas opcionalmente (aqui optamos por manter o status individual)
                        return { ...t, completed: newCompletedStatus };
                    }
                    return t;
                });
                this.store.setState({ tasks });
            }

            toggleSubtask(taskId, subtaskId) {
                const tasks = this.store.getState().tasks.map(t => {
                    if (t.id === taskId) {
                        const newSubtasks = t.subtasks.map(s => 
                            s.id === subtaskId ? { ...s, completed: !s.completed } : s
                        );
                        // Verifica se todas sub-tarefas foram concluídas e não marcadas, auto-marca a principal
                        const allCompleted = newSubtasks.length > 0 && newSubtasks.every(s => s.completed);
                        return { ...t, subtasks: newSubtasks, completed: allCompleted ? true : t.completed };
                    }
                    return t;
                });
                this.store.setState({ tasks });
            }

            deleteTask(id) {
                const tasks = this.store.getState().tasks.filter(t => t.id !== id);
                this.store.setState({ tasks });
                this.ui.showToast('Inspeção excluída.', 'success');
            }
        }

        // --- STREAMING_CHUNK:Inicialização da Aplicação... ---
        // --- 6. INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            // Carrega estado salvo ou usa o initial state
            const savedData = StorageManager.load();
            const store = new Store(savedData || {});
            
            // Instancia renderizador passando o store
            const ui = new UIRenderer();
            store.subscribe(state => ui.render(state));
            
            // Inicializa Controlador
            window.app = new AppController(store, ui);
        });

    </script>
</body>
