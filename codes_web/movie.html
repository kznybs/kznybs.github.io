<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Mode</title>
    <style>
        /* Reset e Base */
        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Remove barras de rolagem da página */
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Botão Flutuante Discreto */
        .float-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            font-size: 14px;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .float-btn:hover {
            background: #00d2ff;
            color: #000;
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }

        /* Modal de Input (Escondido por padrão) */
        .modal-overlay {
            display: none; /* JS vai mudar isso para flex */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #0f0f0f;
            color: white;
            outline: none;
            font-size: 16px;
        }

        input:focus { border-color: #00d2ff; }

        button.action-btn {
            padding: 12px 25px;
            background-color: #00d2ff;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }

        button.action-btn:hover { background-color: #00a0c4; }
        
        button.close-btn {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            align-self: flex-end;
            margin-bottom: -10px;
        }
        button.close-btn:hover { color: #fff; }

        /* Container do Vídeo Full Screen */
        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Botão para abrir o menu -->
    <button class="float-btn" onclick="toggleModal()">+ Link / Trocar Vídeo</button>

    <!-- Modal para colar o link -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleModal()">✕</button>
            <h2 style="margin:0; font-weight: 300;">Colar Link</h2>
            <div class="input-group">
                <input type="text" id="linkInput" placeholder="Cole o link do vídeo aqui..." autofocus>
                <button class="action-btn" onclick="carregarVideo()">Play</button>
            </div>
            <p style="font-size: 12px; color: #666; margin:0;">Suporta YouTube (Playlists/Shorts), Links Diretos e Embeds.</p>
        </div>
    </div>

    <!-- Área do Vídeo -->
    <div class="video-container">
        <iframe id="tela" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const input = document.getElementById('linkInput');

        function toggleModal() {
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                input.focus(); // Foca no input assim que abrir
            }
        }

        // Fecha modal ao clicar fora
        modal.addEventListener('click', function(e) {
            if (e.target === modal) toggleModal();
        });

        function carregarVideo() {
            const url = input.value.trim();
            const iframe = document.getElementById('tela');

            if (!url) return;

            // --- Lógica Nova (Mais Robusta) ---
            
            // 1. Tenta encontrar um ID de vídeo do YouTube (funciona para watch?v=, youtu.be, shorts, embed)
            // Regex explicada: procura por (v= OU /v/ OU /embed/ OU youtu.be/) e pega os próximos 11 caracteres
            const youtubeIdMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|.*\/|embed\/|v\/))([^?&"'>]{11})/);
            
            // 2. Tenta encontrar um ID de Playlist (list=...)
            const listMatch = url.match(/[?&]list=([^#\&\?]+)/);

            if (youtubeIdMatch && youtubeIdMatch[1]) {
                const videoId = youtubeIdMatch[1];
                let finalUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                
                // Se o link original tinha playlist, adiciona ela no player para você poder navegar
                if (listMatch && listMatch[1]) {
                    finalUrl += `&list=${listMatch[1]}`;
                }

                iframe.src = finalUrl;
            } 
            // 3. Se não for YouTube, assume que é link direto
            else {
                iframe.src = url;
            }

            // Fecha o modal após carregar
            toggleModal();
        }
        
        // Enter para carregar
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                carregarVideo();
            }
        });
    </script>

</body>
</html>
