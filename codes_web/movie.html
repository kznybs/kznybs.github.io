<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Mode</title>
    <style>
        /* Reset e Base */
        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Remove barras de rolagem da página */
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- ZONA DE CONTROLE (Barra do Topo) --- */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px; /* Altura da área sensível */
            z-index: 150;
            display: flex;
            justify-content: space-between; /* Um botão na esq, outro na dir */
            align-items: flex-start;
            padding: 20px;
            box-sizing: border-box;
            
            /* Lógica de Aparecer/Desaparecer */
            opacity: 0; 
            transition: opacity 0.4s ease-in-out;
            
            /* Gradiente suave para o fundo dos botões quando visível */
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }

        /* Quando passar o mouse ou tocar na área, fica visível */
        .top-bar:hover {
            opacity: 1;
        }

        /* Estilo Comum dos Botões */
        .float-btn {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .float-btn:hover {
            background: #00d2ff;
            color: #000;
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }

        /* Botão da Direita (Escondido por padrão até ter link) */
        #btnOriginal {
            display: none;
        }

        /* Estilo Vermelho (YouTube) */
        .yt-mode:hover {
            background: #ff0000;
            color: #fff;
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        /* Estilo Verde (Download) */
        .dl-mode:hover {
            background: #25D366;
            color: #fff;
            border-color: #25D366;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.5);
        }

        /* Modal de Input */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #0f0f0f;
            color: white;
            outline: none;
            font-size: 16px;
        }

        input:focus { border-color: #00d2ff; }

        button.action-btn {
            padding: 12px 25px;
            background-color: #00d2ff;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }

        button.action-btn:hover { background-color: #00a0c4; }
        
        button.close-btn {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            align-self: flex-end;
            margin-bottom: -10px;
        }
        button.close-btn:hover { color: #fff; }

        /* Container do Vídeo Full Screen */
        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- ZONA DE CONTROLE (Invisível até passar o mouse) -->
    <div class="top-bar">
        <button class="float-btn" onclick="toggleModal()">+ Link / Trocar Vídeo</button>
        
        <a id="btnOriginal" class="float-btn" href="#" target="_blank">Abrir Link ↗</a>
    </div>

    <!-- Modal para colar o link -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleModal()">✕</button>
            <h2 style="margin:0; font-weight: 300;">Colar Link</h2>
            <div class="input-group">
                <input type="text" id="linkInput" placeholder="Cole o link do vídeo aqui..." autofocus>
                <button class="action-btn" onclick="carregarVideo()">Play</button>
            </div>
            <p style="font-size: 12px; color: #666; margin:0;">Suporta: YouTube, Streams (com API Key), MP4 e Embeds.</p>
        </div>
    </div>

    <!-- Área do Vídeo -->
    <div class="video-container">
        <!-- Player para sites e YouTube -->
        <iframe id="tela" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
        
        <!-- Player Nativo para arquivos diretos -->
        <video id="nativePlayer" controls autoplay style="display: none;"></video>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const input = document.getElementById('linkInput');
        const btnOriginal = document.getElementById('btnOriginal');
        const iframe = document.getElementById('tela');
        const nativePlayer = document.getElementById('nativePlayer');
        let currentUrl = "";

        // --- SISTEMA DE ERRO INTELIGENTE ---
        nativePlayer.onerror = function() {
            console.log("Erro no Player Nativo. Tentando carregar como Iframe/Site...");
            nativePlayer.style.display = 'none';
            iframe.style.display = 'block';
            iframe.src = currentUrl;
            
            btnOriginal.innerHTML = "Abrir Original ↗";
            btnOriginal.classList.remove('dl-mode');
        };

        function toggleModal() {
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                input.focus(); 
            }
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal) toggleModal();
        });

        function carregarVideo() {
            const url = input.value.trim();
            if (!url) return;
            currentUrl = url;

            // Configura botão
            btnOriginal.href = url;
            btnOriginal.style.display = 'block';
            btnOriginal.classList.remove('yt-mode', 'dl-mode');
            btnOriginal.removeAttribute('download');

            // Reseta players
            iframe.src = "";
            nativePlayer.pause();
            nativePlayer.src = "";

            // --- DETECÇÃO ---
            const isVideoFile = /\.(mp4|webm|ogg|mov|mkv)($|\?)/i.test(url);
            const isStreamApi = /api_key=|stream|vod\//i.test(url);

            if (isVideoFile || isStreamApi) {
                iframe.style.display = 'none';
                nativePlayer.style.display = 'block';
                nativePlayer.src = url;
                nativePlayer.play().catch(e => console.log("Autoplay bloqueado pelo navegador"));

                btnOriginal.innerHTML = "Tentar Baixar ⬇";
                btnOriginal.classList.add('dl-mode');
            }
            else if (url.match(/(?:youtu\.be\/|youtube\.com\/)/)) {
                nativePlayer.style.display = 'none';
                iframe.style.display = 'block';

                const youtubeIdMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|.*\/|embed\/|v\/))([^?&"'>]{11})/);
                const listMatch = url.match(/[?&]list=([^#\&\?]+)/);

                if (youtubeIdMatch && youtubeIdMatch[1]) {
                    const videoId = youtubeIdMatch[1];
                    let finalUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
                    if (listMatch && listMatch[1]) {
                        finalUrl += `&list=${listMatch[1]}`;
                    }
                    iframe.src = finalUrl;
                } else {
                    iframe.src = url;
                }

                btnOriginal.innerHTML = "Abrir no YouTube ↗";
                btnOriginal.classList.add('yt-mode');
            } 
            else {
                nativePlayer.style.display = 'none';
                iframe.style.display = 'block';
                iframe.src = url;
                btnOriginal.innerHTML = "Abrir Original ↗";
            }

            toggleModal();
        }
        
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                carregarVideo();
            }
        });
    </script>

</body>
</html>
