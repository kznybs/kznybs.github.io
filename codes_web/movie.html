<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Mode</title>
    <style>
        /* Reset e Base */
        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Remove barras de rolagem da página */
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Botão Flutuante Discreto (Esquerda) */
        .float-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            font-size: 14px;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none; /* Para links */
        }

        .float-btn:hover {
            background: #00d2ff;
            color: #000;
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }

        /* Botão Flutuante (Direita - Para abrir original) */
        .right-btn {
            left: auto; /* Anula o left */
            right: 20px;
            background: rgba(255, 0, 0, 0.15);
            border-color: rgba(255, 0, 0, 0.25);
            display: none; /* Escondido até carregar um vídeo */
        }

        .right-btn:hover {
            background: #ff0000;
            color: #fff;
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        /* Modal de Input (Escondido por padrão) */
        .modal-overlay {
            display: none; /* JS vai mudar isso para flex */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #0f0f0f;
            color: white;
            outline: none;
            font-size: 16px;
        }

        input:focus { border-color: #00d2ff; }

        button.action-btn {
            padding: 12px 25px;
            background-color: #00d2ff;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }

        button.action-btn:hover { background-color: #00a0c4; }
        
        button.close-btn {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            align-self: flex-end;
            margin-bottom: -10px;
        }
        button.close-btn:hover { color: #fff; }

        /* Container do Vídeo Full Screen */
        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain; /* Garante que mp4 não estique errado */
        }
    </style>
</head>
<body>

    <!-- Botão para abrir o menu -->
    <button class="float-btn" onclick="toggleModal()">+ Link / Trocar Vídeo</button>

    <!-- Botão de emergência para abrir no YouTube -->
    <a id="btnOriginal" class="float-btn right-btn" href="#" target="_blank">Abrir no YouTube ↗</a>

    <!-- Modal para colar o link -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleModal()">✕</button>
            <h2 style="margin:0; font-weight: 300;">Colar Link</h2>
            <div class="input-group">
                <input type="text" id="linkInput" placeholder="Cole o link do vídeo aqui..." autofocus>
                <button class="action-btn" onclick="carregarVideo()">Play</button>
            </div>
            <p style="font-size: 12px; color: #666; margin:0;">Suporta: YouTube (Playlist/Shorts), MP4, MKV, WebM e Embeds.</p>
        </div>
    </div>

    <!-- Área do Vídeo -->
    <div class="video-container">
        <!-- Player para sites e YouTube -->
        <iframe id="tela" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
        
        <!-- Player Nativo para arquivos diretos (.mp4, .mkv, etc) -->
        <video id="nativePlayer" controls autoplay style="display: none;"></video>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const input = document.getElementById('linkInput');
        const btnOriginal = document.getElementById('btnOriginal');
        const iframe = document.getElementById('tela');
        const nativePlayer = document.getElementById('nativePlayer');

        function toggleModal() {
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                input.focus(); 
            }
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal) toggleModal();
        });

        function carregarVideo() {
            const url = input.value.trim();
            if (!url) return;

            // Configura botão de emergência
            btnOriginal.href = url;
            btnOriginal.style.display = 'block';

            // Reseta os players (para o som do anterior não continuar tocando)
            iframe.src = "";
            nativePlayer.pause();
            nativePlayer.src = "";

            // --- DETECÇÃO INTELIGENTE ---

            // 1. É arquivo de vídeo direto? (MP4, WEBM, OGG, MOV, MKV)
            // Regex procura extensões comuns no final da url ou antes de parâmetros (?)
            if (url.match(/\.(mp4|webm|ogg|mov|mkv)($|\?)/i)) {
                iframe.style.display = 'none';
                nativePlayer.style.display = 'block';
                nativePlayer.src = url;
                nativePlayer.play().catch(e => console.log("Autoplay bloqueado pelo navegador"));
            }
            
            // 2. É YouTube?
            else if (url.match(/(?:youtu\.be\/|youtube\.com\/)/)) {
                nativePlayer.style.display = 'none';
                iframe.style.display = 'block';

                const youtubeIdMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|.*\/|embed\/|v\/))([^?&"'>]{11})/);
                const listMatch = url.match(/[?&]list=([^#\&\?]+)/);

                if (youtubeIdMatch && youtubeIdMatch[1]) {
                    const videoId = youtubeIdMatch[1];
                    let finalUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
                    if (listMatch && listMatch[1]) {
                        finalUrl += `&list=${listMatch[1]}`;
                    }
                    iframe.src = finalUrl;
                } else {
                    // Fallback se não achar ID, tenta embed direto
                    iframe.src = url;
                }
            } 
            
            // 3. Qualquer outra coisa (Links de streaming, embeds genéricos)
            else {
                nativePlayer.style.display = 'none';
                iframe.style.display = 'block';
                iframe.src = url;
            }

            toggleModal();
        }
        
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                carregarVideo();
            }
        });
    </script>

</body>
</html>
