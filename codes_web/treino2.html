        tailwind.config = {
            darkMode: 'class',

                extend: {
                    colors: {
                        bg: { 
                            main: '#09090b', 
                            surface: '#18181b', 
                            highlight: '#27272a', 
                            elevated: '#3f3f46'

                            400: 'var(--color-primary-light)',
                            500: 'var(--color-primary)', 
                            600: 'var(--color-primary-dark)', 
                            900: 'var(--color-primary-fade)' 
                        },
                        accent: {
                            gold: '#fbbf24',
                            purple: '#a855f7',
                            rose: '#f43f5e'
                        },
                        status: {
                            success: '#10b981',
                            warning: '#f59e0b',
                            danger: '#ef4444',
                            info: '#3b82f6'
                        },
                        text: { 
                            main: '#f4f4f5', 
                            muted: '#a1a1aa', 
                            dim: '#71717a' 
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        display: ['Lexend', 'sans-serif']
                    },
                    animation: {
                        'enter': 'enter 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'exit': 'exit 0.2s ease-in',
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        enter: { '0%': { transform: 'scale(0.98)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        exit: { '0%': { opacity: '1' }, '100%': { opacity: '0' } },
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-5px)' } }
                    },
                    boxShadow: {
                        'glow': '0 0 20px -5px var(--color-primary)',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&family=Lexend:wght@700;900&display=swap');

        :root {
            --color-primary-light: #60a5fa;
            --color-primary: #3b82f6; 
            --color-primary-dark: #2563eb;
            --color-primary-fade: #172554;
            --safe-area-top: env(safe-area-inset-top);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        /* THEME VARIABLES */
        .theme-blue { --color-primary-light: #60a5fa; --color-primary: #3b82f6; --color-primary-dark: #2563eb; --color-primary-fade: #172554; }
        .theme-purple { --color-primary-light: #a78bfa; --color-primary: #8b5cf6; --color-primary-dark: #7c3aed; --color-primary-fade: #2e1065; }
        .theme-emerald { --color-primary-light: #34d399; --color-primary: #10b981; --color-primary-dark: #059669; --color-primary-fade: #022c22; }
        .theme-crimson { --color-primary-light: #fb7185; --color-primary: #f43f5e; --color-primary-dark: #e11d48; --color-primary-fade: #4c0519; }
        .theme-gold { --color-primary-light: #fbbf24; --color-primary: #f59e0b; --color-primary-dark: #d97706; --color-primary-fade: #451a03; }

        /* CORE STYLES */
        body { 
            background-color: #09090b; 
            color: #f4f4f5; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-panel {

            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255,255,255,0.08); 
        }

        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, var(--color-primary-light), var(--color-primary-dark));
        }

        /* CUSTOM INPUTS */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .input-stealth {
            background: transparent;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .input-stealth:focus {
            background: rgba(255,255,255,0.05);
            border-color: var(--color-primary);
            outline: none;
        }

    const Utils = {
        uuid: () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
            const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        }),
        
        delay: (ms) => new Promise(resolve => setTimeout(resolve, ms)),

        formatTime: (seconds) => {
            if (seconds === undefined || isNaN(seconds)) return "00:00";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return h > 0 
                ? `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`
                : `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        },

        formatDate: (timestamp) => {
            return new Date(timestamp).toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
        },

        calculate1RM: (weight, reps) => {
            if (reps === 1) return weight;
            // Epley Formula
            return Math.round(weight * (1 + (reps / 30)));
        },

        calculateWilks: (weight, bodyweight, gender) => {
            // Simplified coefficient for demo purposes
            const coeff = 500 / bodyweight; 
            return Math.round(weight * coeff);
        },

        randomInt: (min, max) => Math.floor(Math.random() * (max - min + 1) + min)
    };

    /**
     * STATE MANAGEMENT ENGINE (FLUX PATTERN)
     */
    class Store {
        constructor() {
            this.state = this.loadInitialState();
            this.listeners = new Set();
            this.middleware = [];
        }

        get defaultState() {
            return {
                user: { 
                    name: 'Atleta', 
                    xp: 0, 
                    level: 1, 
                    theme: 'theme-blue',
                    onboardingComplete: false
                },
                activeWorkout: null,
                history: [],
                measurements: [], // { date, weight, bodyFat, chest, arms, legs }
                achievements: [], // { id, unlockedAt }
                templates: [
                    { id: 'tpl_upper', name: 'Upper Body Power', exercises: ['bp_bar', 'row_bar', 'ohp_bar', 'pullup', 'tri_skull', 'curl_bar'] },
                    { id: 'tpl_lower', name: 'Lower Body Power', exercises: ['squat', 'rdl', 'leg_press', 'calf_stand', 'leg_ext'] },
                    { id: 'tpl_full', name: 'Full Body Classic', exercises: ['squat', 'bp_bar', 'row_bar', 'ohp_bar'] }
                ],
                settings: {
                    soundEnabled: true,
                    restTimer: 90,
                    weightUnit: 'kg'
                }
            };
        }

        loadInitialState() {
            const raw = localStorage.getItem('titanium_os_v2');
            return raw ? { ...this.defaultState, ...JSON.parse(raw) } : this.defaultState;
        }

        getState() { return this.state; }

        setState(newState) {
            const prevState = { ...this.state };
            this.state = { ...this.state, ...newState };
            
            // Run Middleware (e.g., Achievement Checks)
            this.middleware.forEach(mw => mw(prevState, this.state, (patch) => {
                this.state = { ...this.state, ...patch };
            }));

            this.persist();
            this.notify();
        }

        subscribe(fn) {
            this.listeners.add(fn);
            // Return unsubscribe function
            return () => this.listeners.delete(fn);
        }

        notify() {
            this.listeners.forEach(fn => fn(this.state));
        }

        persist() {
            localStorage.setItem('titanium_os_v2', JSON.stringify(this.state));
        }

        use(middlewareFn) {
            this.middleware.push(middlewareFn);
        }
    }

    const appStore = new Store();

    /**
     * GAMIFICATION & ACHIEVEMENT MIDDLEWARE
     * Checks for unlocks every time state changes.
     */
    const AchievementSystem = (prevState, nextState, patchState) => {
        const badges = [
            { id: 'first_blood', name: 'Primeiro Passo', desc: 'Completou o primeiro treino', check: (s) => s.history.length >= 1 },
            { id: 'consistent', name: 'Consistência', desc: '5 treinos completados', check: (s) => s.history.length >= 5 },
            { id: 'veteran', name: 'Veterano', desc: '20 treinos completados', check: (s) => s.history.length >= 20 },
            { id: 'heavy_lifter', name: 'Heavy Lifter', desc: 'Levantou mais de 1000kg num treino', check: (s) => s.history.some(w => w.totalVolume > 1000) },
            { id: 'night_owl', name: 'Coruja', desc: 'Treinou após as 22h', check: (s) => s.history.some(w => new Date(w.endTime).getHours() >= 22) }
        ];

        const newUnlocks = [];
        const currentIds = new Set(nextState.achievements.map(a => a.id));

        badges.forEach(badge => {
            if (!currentIds.has(badge.id) && badge.check(nextState)) {
                newUnlocks.push({ id: badge.id, unlockedAt: Date.now() });
                UI.toast(`Conquista Desbloqueada: ${badge.name}`, 'success');
                // Play sound
                if(nextState.settings.soundEnabled) {
                    // Mock sound
                }
            }
        });

        if (newUnlocks.length > 0) {
            // Also add XP
            const xpGain = newUnlocks.length * 100;
            const newXp = nextState.user.xp + xpGain;
            const newLevel = Math.floor(newXp / 500) + 1;
            
            if (newLevel > nextState.user.level) {
                UI.toast(`LEVEL UP! Nível ${newLevel}`, 'info');
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            }

            patchState({
                achievements: [...nextState.achievements, ...newUnlocks],
                user: { ...nextState.user, xp: newXp, level: newLevel }
            });
        }
    };

    appStore.use(AchievementSystem);

    /**
     * CHART ENGINE v2.0
     * Supports Line, Bar, and Radar charts using SVG.
     */
    const ChartEngine = {
        createSVG(width, height, content) {
            return `<svg viewBox="0 0 ${width} ${height}" class="w-full h-full overflow-visible">${content}</svg>`;
        },

        Line: (data, color = '#3b82f6') => {
            if(!data || data.length < 2) return '<div class="h-full flex items-center justify-center text-xs text-text-dim">Dados insuficientes</div>';
            
            const w = 300, h = 150, pad = 20;
            const max = Math.max(...data.map(d => d.y));
            const min = Math.min(...data.map(d => d.y));
            const range = max - min || 1;

            const points = data.map((d, i) => {
                const x = pad + (i / (data.length - 1)) * (w - pad * 2);
                const y = h - pad - ((d.y - min) / range) * (h - pad * 2);
                return `${x},${y}`;
            }).join(' ');

            return ChartEngine.createSVG(w, h, `
                <path d="M${pad},${h-pad} L${w-pad},${h-pad}" stroke="#3f3f46" stroke-width="1" />
                <path d="M${pad},${pad} L${pad},${h-pad}" stroke="#3f3f46" stroke-width="1" />
                <polyline points="${points}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                ${data.map((d, i) => {
                    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
                    const y = h - pad - ((d.y - min) / range) * (h - pad * 2);
                    return `<circle cx="${x}" cy="${y}" r="4" fill="#18181b" stroke="${color}" stroke-width="2" />`;
                }).join('')}
            `);
        },

        Radar: (stats) => {
            // stats: { label: 'Chest', value: 0-100 }
            const w = 200, h = 200, cx = 100, cy = 100, r = 80;
            const count = stats.length;
            if(count < 3) return '';

            const angleStep = (Math.PI * 2) / count;
            
            // Generate Grid
            let gridSVG = '';
            [0.25, 0.5, 0.75, 1].forEach(scale => {
                const pts = stats.map((_, i) => {
                    const a = i * angleStep - Math.PI/2;
                    return `${cx + Math.cos(a) * r * scale},${cy + Math.sin(a) * r * scale}`;
                }).join(' ');
                gridSVG += `<polygon points="${pts}" fill="none" stroke="#3f3f46" stroke-width="1" opacity="0.5" />`;
            });

            // Generate Data Poly
            const dataPts = stats.map((s, i) => {
                const val = Math.min(Math.max(s.value, 10), 100) / 100; // Normalize
                const a = i * angleStep - Math.PI/2;
                return `${cx + Math.cos(a) * r * val},${cy + Math.sin(a) * r * val}`;
            }).join(' ');

            // Labels
            const labelsSVG = stats.map((s, i) => {
                const a = i * angleStep - Math.PI/2;
                const dist = r + 15;
                const lx = cx + Math.cos(a) * dist;
                const ly = cy + Math.sin(a) * dist;
                return `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#a1a1aa" font-size="10" font-family="sans-serif">${s.label}</text>`;
            }).join('');

            return ChartEngine.createSVG(w, h, `
                ${gridSVG}
                <polygon points="${dataPts}" fill="var(--color-primary)" fill-opacity="0.2" stroke="var(--color-primary)" stroke-width="2" />
                ${labelsSVG}
            `);
        }
    };

    /**
     * VIRTUAL DOM & COMPONENT SYSTEM
     * Simple reactive view layer.
     */
    const UI = {
        createElement: (tag, className, content = '') => {
            const el = document.createElement(tag);
            if(className) el.className = className;
            if(typeof content === 'string') el.innerHTML = content;
            else if(content instanceof HTMLElement) el.appendChild(content);
            else if(Array.isArray(content)) content.forEach(c => el.appendChild(c));
            return el;
        },

        toast: (msg, type = 'info') => {
            const container = document.getElementById('notification-layer');
            const el = UI.createElement('div', `
                bg-bg-surface border border-white/10 shadow-glass rounded-lg px-4 py-3 
                text-sm font-medium flex items-center gap-3 animate-slide-up text-white w-full max-w-sm
                ${type === 'success' ? 'border-l-4 border-l-status-success' : ''}
            `);
            
            const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info';
            const color = type === 'success' ? 'text-status-success' : type === 'error' ? 'text-status-danger' : 'text-status-info';

            el.innerHTML = `
                <i data-lucide="${icon}" class="w-5 h-5 ${color}"></i>
                <span>${msg}</span>
            `;
            
            container.appendChild(el);
            lucide.createIcons();

            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-10px)';
                setTimeout(() => el.remove(), 200);
            }, 3000);
        },

        modal: (contentFn) => {
            const layer = document.getElementById('overlay-layer');
            // Remove existing
            layer.innerHTML = '';
            layer.classList.remove('pointer-events-none');

            const backdrop = UI.createElement('div', 'absolute inset-0 bg-black/80 backdrop-blur-sm animate-enter');
            backdrop.onclick = () => UI.closeModal();

            const panel = UI.createElement('div', 'relative w-full max-w-lg bg-bg-surface rounded-t-2xl sm:rounded-2xl border border-white/10 shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-slide-up');
            
            panel.appendChild(contentFn());
            
            layer.appendChild(backdrop);
            layer.appendChild(panel);
            lucide.createIcons();
        },

        closeModal: () => {

    const Router = {
        routes: {},
        current: null,

        register(path, viewFn) {
            this.routes[path] = viewFn;
        },

        navigate(path, params = {}) {
            this.current = path;
            const root = document.getElementById('root');
            root.innerHTML = ''; // Clear
            
            if(this.routes[path]) {
                const view = this.routes[path](params);
                root.appendChild(view);
                lucide.createIcons();
                
                // Animation Hook
                view.classList.add('animate-enter');
            } else {
                console.error(`Route ${path} not found`);
            }
        }

            <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-primary-600 to-indigo-500 flex items-center justify-center text-3xl font-bold text-white shadow-glow mb-4">
                ${state.user.name.substring(0,2).toUpperCase()}
            </div>
            <h2 class="text-2xl font-bold text-white">${state.user.name}</h2>
            <div class="flex items-center gap-2 mt-2">
                <span class="px-3 py-1 bg-bg-highlight rounded-full text-xs font-bold text-primary-400 border border-white/5">Level ${state.user.level}</span>
                <span class="text-xs text-text-muted">${state.user.xp} XP</span>
            </div>
        `;
        
        const content = UI.createElement('main', 'flex-1 overflow-y-auto p-4 space-y-6 no-scrollbar');

        // Radar Chart (Muscle Balance - Mock)
        const radarData = [
            {label:'Chest', value:80}, {label:'Back', value:65}, {label:'Legs', value:40}, 
            {label:'Arms', value:90}, {label:'Shldr', value:70}
        ];
        const radarCard = UI.createElement('div', 'bg-bg-surface p-4 rounded-xl border border-white/5 flex flex-col items-center');
        radarCard.innerHTML = `<h3 class="w-full text-left text-xs font-bold text-text-muted uppercase mb-2">Balanço Muscular</h3>` + ChartEngine.Radar(radarData);
        content.appendChild(radarCard);

        // Achievements
        const achieveCard = UI.createElement('div', 'space-y-3');
        achieveCard.innerHTML = `<h3 class="text-xs font-bold text-text-muted uppercase">Conquistas Recentes</h3>`;
        if(state.achievements.length === 0) {
            achieveCard.innerHTML += `<p class="text-sm text-text-dim italic">Nenhuma conquista ainda.</p>`;
        } else {
            const list = UI.createElement('div', 'grid grid-cols-4 gap-2');
            state.achievements.forEach(a => {
                list.innerHTML += `<div class="aspect-square bg-bg-surface rounded-lg border border-accent-gold/30 flex items-center justify-center text-accent-gold" title="${a.id}"><i data-lucide="trophy" class="w-6 h-6"></i></div>`;
            });
            achieveCard.appendChild(list);
        }
        content.appendChild(achieveCard);

        // Settings Actions
        const actions = UI.createElement('div', 'space-y-2');
        actions.innerHTML = `
            <button class="w-full p-4 bg-bg-surface rounded-xl flex justify-between items-center hover:bg-bg-highlight transition-colors" onclick="Actions.switchTheme()">
                <div class="flex items-center gap-3"><i data-lucide="palette" class="w-5 h-5 text-primary-500"></i><span>Alterar Tema</span></div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-text-dim"></i>
            </button>
            <button class="w-full p-4 bg-bg-surface rounded-xl flex justify-between items-center hover:bg-bg-highlight transition-colors text-status-danger" onclick="Actions.resetData()">
                <div class="flex items-center gap-3"><i data-lucide="trash-2" class="w-5 h-5"></i><span>Resetar Dados</span></div>
            </button>
        `;
        content.appendChild(actions);

        container.appendChild(header);
        container.appendChild(content);
        container.appendChild(NavBar('profile'));
        return container;
    });

    /**
     * ACTIONS & CONTROLLERS
     */
    const Actions = {
        startWorkout: (name, exIds = []) => {
            const exercises = exIds.length > 0 
                ? exIds.map(id => ({ id, sets: [{ type: 'N', weight: 0, reps: 0, done: false }], notes: '' }))
                : [];
            
            appStore.setState({
                activeWorkout: {
                    id: Utils.uuid(),
                    name,
                    startTime: Date.now(),
                    exercises
                }
            });
            Router.navigate('active_workout');
        },

        addSet: (exIdx) => {
            const s = appStore.getState();
            const ex = s.activeWorkout.exercises[exIdx];
            const last = ex.sets[ex.sets.length - 1];
            ex.sets.push({ type: 'N', weight: last?.weight||0, reps: last?.reps||0, done: false });
            appStore.setState({ activeWorkout: s.activeWorkout });
            window.renderActiveWorkout();
        },

        updateSet: (exIdx, sIdx, field, val) => {
            const s = appStore.getState();
            s.activeWorkout.exercises[exIdx].sets[sIdx][field] = parseFloat(val);
            appStore.setState({ activeWorkout: s.activeWorkout });
        },

        toggleDone: (exIdx, sIdx) => {
            const s = appStore.getState();
            s.activeWorkout.exercises[exIdx].sets[sIdx].done = !s.activeWorkout.exercises[exIdx].sets[sIdx].done;
            appStore.setState({ activeWorkout: s.activeWorkout });
            window.renderActiveWorkout();
            
            if(s.activeWorkout.exercises[exIdx].sets[sIdx].done) {
                if(navigator.vibrate) navigator.vibrate(50);
            }
        },

        toggleSetType: (exIdx, sIdx) => {
            const types = ['N', 'W', 'D', 'F'];
            const s = appStore.getState();
            const set = s.activeWorkout.exercises[exIdx].sets[sIdx];
            const idx = types.indexOf(set.type);
            set.type = types[(idx+1) % types.length];
            appStore.setState({ activeWorkout: s.activeWorkout });
            window.renderActiveWorkout();
        },

        removeExercise: (exIdx) => {
            if(!confirm("Remover exercício?")) return;
            const s = appStore.getState();
            s.activeWorkout.exercises.splice(exIdx, 1);
            appStore.setState({ activeWorkout: s.activeWorkout });
            window.renderActiveWorkout();
        },

        finishWorkout: () => {
            const s = appStore.getState();
            if(!confirm("Finalizar treino?")) return;
            
            // Calc volume
            let vol = 0;
            s.activeWorkout.exercises.forEach(e => e.sets.forEach(set => {
                if(set.done) vol += (set.weight * set.reps);
            }));

            const finished = { 
                ...s.activeWorkout, 
                endTime: Date.now(),
                totalVolume: vol
            };

            appStore.setState({
                activeWorkout: null,
                history: [...s.history, finished]
            });
            
            confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
            Router.navigate('history');
        },

        openExerciseSelector: () => {
            UI.modal(() => {
                const div = UI.createElement('div', 'p-4 h-[70vh] flex flex-col');
                div.innerHTML = `
                    <h3 class="text-lg font-bold text-white mb-4">Adicionar Exercício</h3>
                    <input type="text" id="ex-search" placeholder="Buscar..." class="w-full bg-bg-highlight p-3 rounded-lg text-white mb-4 focus:outline-none focus:ring-1 ring-primary-500">
                    <div id="ex-list" class="flex-1 overflow-y-auto space-y-2 no-scrollbar"></div>
                `;
                
                const list = div.querySelector('#ex-list');
                const render = (filter = '') => {
                    list.innerHTML = '';
                    DB.exercises.filter(e => e.name.toLowerCase().includes(filter.toLowerCase())).forEach(ex => {
                        const row = UI.createElement('div', 'p-3 bg-bg-main rounded-lg flex justify-between items-center cursor-pointer hover:bg-bg-highlight');
                        row.innerHTML = `<span class="text-sm font-medium text-white">${ex.name}</span><i data-lucide="plus" class="w-4 h-4 text-primary-500"></i>`;
                        row.onclick = () => {
                            const s = appStore.getState();
                            s.activeWorkout.exercises.push({ id: ex.id, sets: [{type:'N', weight:0, reps:0, done:false}], notes: '' });
                            appStore.setState({ activeWorkout: s.activeWorkout });
                            window.renderActiveWorkout();
                            UI.closeModal();
                            UI.toast('Exercício Adicionado', 'success');
                        };
                        list.appendChild(row);
                    });
                    lucide.createIcons();
                };
                
                div.querySelector('input').oninput = (e) => render(e.target.value);
                render();
                return div;
            });
        },

        showPlateCalc: () => {
            UI.modal(() => {
                const div = UI.createElement('div', 'p-6');
                div.innerHTML = `
                    <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="disc-3" class="text-primary-500"></i> Calc. Anilhas</h3>
                    
                    <div class="flex items-center gap-2 mb-6">
                        <button class="p-4 bg-bg-highlight rounded-lg text-text-muted hover:text-white" onclick="adjustPlateWeight(-5)"><i data-lucide="minus"></i></button>
                        <input id="plate-target" type="number" value="60" class="flex-1 bg-transparent text-center text-3xl font-bold text-white border-none focus:outline-none">
                        <button class="p-4 bg-bg-highlight rounded-lg text-text-muted hover:text-white" onclick="adjustPlateWeight(5)"><i data-lucide="plus"></i></button>
                    </div>

                    <div id="plate-viz" class="h-24 bg-bg-highlight rounded-lg relative flex items-center px-8 overflow-hidden mb-4">
                        <div class="w-full h-2 bg-text-dim absolute z-0"></div>
                        <!-- Plates go here -->
                    </div>
                    <p id="plate-text" class="text-center text-sm font-mono text-primary-400"></p>
                `;

                window.adjustPlateWeight = (v) => {
                    const inp = document.getElementById('plate-target');
                    inp.value = Math.max(20, parseInt(inp.value) + v);
                    renderPlates();
                };

                const renderPlates = () => {
                    const target = parseInt(document.getElementById('plate-target').value) || 0;
                    const side = (target - 20) / 2;
                    const plates = [25, 20, 15, 10, 5, 2.5, 1.25];
                    const colors = { 25: '#ef4444', 20: '#3b82f6', 15: '#eab308', 10: '#22c55e', 5: '#ffffff', 2.5: '#000000', 1.25: '#9ca3af' };
                    const heights = { 25: 'h-20', 20: 'h-20', 15: 'h-16', 10: 'h-14', 5: 'h-12', 2.5: 'h-10', 1.25: 'h-8' };
                    
                    let rem = side;
                    let html = '<div class="w-full h-2 bg-gray-600 absolute z-0"></div>'; // bar
                    
                    plates.forEach(p => {
                        while(rem >= p) {
                            html += `<div class="${heights[p]} w-4 sm:w-6 rounded-sm border-r border-black/20 z-10 shadow-lg mx-[1px]" style="background:${colors[p]}" title="${p}kg"></div>`;
                            rem -= p;
                        }
                    });

                    document.getElementById('plate-viz').innerHTML = html;
                    document.getElementById('plate-text').innerHTML = side > 0 ? `${side}kg cada lado` : 'Barra Vazia';
                };

                setTimeout(renderPlates, 0); // Render init
                return div;
            });
        },
        
        switchTheme: () => {
            const themes = ['theme-blue', 'theme-purple', 'theme-emerald', 'theme-crimson', 'theme-gold'];
            const s = appStore.getState();
            const currIdx = themes.indexOf(s.user.theme);
            const next = themes[(currIdx + 1) % themes.length];
            document.body.className = next;
            appStore.setState({ user: { ...s.user, theme: next } });
        },

        resetData: () => {
            if(confirm("ATENÇÃO: Isso apagará todo seu histórico. Continuar?")) {
                Persistence.reset();
                location.reload();
            }
        }
    };

    /**
     * INIT BOOTSTRAP
     */
    (async () => {
        // Mock Boot Delay for aesthetics
        await Utils.delay(800);
        
        const loader = document.getElementById('boot-loader');
        loader.classList.add('animate-exit');
        loader.addEventListener('animationend', () => loader.remove());

        const state = appStore.getState();
        if(state.user.theme) document.body.className = state.user.theme;

        if(!state.user.onboardingComplete) {
            Router.navigate('onboarding');
        } else if(state.activeWorkout) {
            Router.navigate('active_workout');
        } else {
            Router.navigate('home');
        }

        console.log("%c TITANIUM OS LOADED ", "background: #3b82f6; color: white; font-weight: bold; padding: 4px;");
    })();

    </script>
</body>
</html>
